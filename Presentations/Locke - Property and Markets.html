<script>
const slides=[];const src=(pages,extra='')=>`[Sources]\nSource material, “Property and markets,” source PDF, pp. ${pages}.${extra?`\n${extra}`:''}\n[/Sources]`;const add=s=>slides.push(s);const cover=(title,work,course,notes)=>add({type:'cover',title,work,course,notes});const section=(roman,title,notes)=>add({type:'section',eyebrow:`${roman}. ${title.toUpperCase()}`,title,notes});const question=(eyebrow,prompt,context,notes)=>add({type:'question',eyebrow,prompt,context,notes});const quote=(text,cite,notes)=>add({type:'quote',text,cite,notes});const duo=(title,left,right,notes)=>add({type:'duo',title,left,right,notes});const head=(title,items,notes)=>add({type:'head',title,items,notes});const diagnostic=(prompt,notes)=>add({type:'diagnostic',eyebrow:'The property-and-market test',prompt,notes});const refs=(items,notes)=>add({type:'refs',title:'References',items,notes});function build(id,title,paragraphs,notes,pages){paragraphs.forEach((_,i)=>add({type:'content',title,paragraphs:paragraphs.slice(0,i+1),buildGroup:id,notes:notes+(i<paragraphs.length-1?'\n\nPause before revealing the next step.':'')+'\n\n'+src(pages)}));}

cover('Property and Markets','Can private ownership and exchange be made just?','Political Philosophy',`Open with Rousseau’s challenge: a claim of “mine” can turn common access into exclusion.\n\n${src('1','Rousseau quotation reproduced in the source material.')}`);
question('The starting tension','What could make it legitimate to exclude everyone else from land or goods?','An unowned thing is available for anyone to use. Private property gives one person the power to deny that use to everyone else. The argument asks how that power could be justified.',`The question turns from a familiar institution to its moral basis.\n\n${src('1-2')}`);
section('I','How can common things become someone’s property?',`Start with the issue Nozick calls justice in initial acquisition: how an object that belonged to no one can become privately owned.\n\n${src('1-2','Nozick’s three principles are discussed in the source material.')}`);
build('acquisition','Private property changes what everyone else may do',[`Every object now owned by someone was either once unowned or ultimately made from something that was unowned.`,`Before a thing is privately owned, everyone is at liberty to use it. Once it becomes mine, others may use it only with my permission.`,`That is why land is especially puzzling. A private owner can exclude others from a place that was previously open to all.`,`The question is not merely who possesses something first. It is what could create a moral right to exclude others from it.`],`Keep “possession” and “a moral right” distinct.`,`1-2`);
section('I','Locke tries to justify the first claim of “mine”',`Locke’s chapter on property offers several ways in which initial appropriation might be justified.\n\n${src('2-3','Locke, Second Treatise, is the primary work discussed.')}`);
build('survival','Survival permits taking what is needed - but does not settle ownership',[`Locke begins from a world owned in common and from a fundamental law of nature: human beings must be preserved as much as possible.`,`If no one could take anything from nature, people would die. So people must be permitted to take what they need to survive.`,`This argument fits fruits and nuts that can be consumed. It does not yet explain how someone could own land itself or transfer it to an heir.`],`The survival argument establishes permission to take necessities, not a full property right.`,`2-3`);
duo('Locke’s permission to take has two limits',{label:'Non-wastage',text:'Do not take more than you can make use of. Appropriation is not justified when useful things are allowed to spoil.'},{label:'Enough and as good',text:'Leave enough equally good resources for others. Your taking must not make everyone else worse off.'},`Introduce these as conditions that apply throughout Locke’s defense.\n\n${src('3')}`);
question('A stronger claim is needed','How can someone gain the right to land, not merely permission to eat what they need?','Locke’s next argument starts from something every person already owns: their own labor. It then tries to connect that labor to an external object.',`The next build presents the labor-mixing argument before testing its weak point.\n\n${src('3-4')}`);
build('mixing','Locke says labor can turn a common object into property',[`Each person has property in their own person. Locke treats the labor of a person’s body and the work of their hands as their own.`,`When someone removes an object from its natural condition and mixes their labor with it, they add something that is already theirs.`,`Locke concludes that labor can make the object private property, so long as it was not already justly claimed and enough and as good remains for others.`,`This labor-mixing argument seems able to justify working a plot of land, not only taking food from it.`],`Define labor-mixing in ordinary language before considering its appeal.\n\n${src('3-4','Locke quotation from Second Treatise, sec. 27, reproduced in the source material.')}`);
quote('If I own a can of tomato juice and spill it in the sea … do I thereby come to own the sea, or have I foolishly dissipated my tomato juice?','Robert Nozick, Anarchy, State, and Utopia, p. 175; quoted in the source material',`Let the counterexample test the missing premise: mixing something one owns with an unowned thing gives one ownership of the whole.\n\n${src('4','Nozick quotation reproduced in the source material.')}`);
question('What is special about labor?','Why should labor have a power that tomato juice does not?','Nozick’s example suggests that labor-mixing needs a further premise. Locke’s next line of thought focuses not on mixing, but on the value labor creates.',`The next build shifts from the act of mixing to the value added by work.\n\n${src('4-5')}`);
build('value','Labor may justify the value it adds - but does it justify the land?',[`Locke argues that cultivation can make a plot vastly more productive. Labor, he says, puts the difference of value on things.`,`That makes it plausible that a worker deserves the crops or other value produced by their effort.`,`But the land itself existed before the labor. The value-added argument seems to justify keeping the product, not gaining permanent ownership of the underlying land.`],`Emphasize the distinction between added value and the resource that made adding value possible.\n\n${src('4-5','Locke quotation from Second Treatise, sec. 40, reproduced in the source material.')}`);
build('desert','Desert supports the fruits of effort more easily than inherited land',[`Locke also pictures an industrious person who improves land and a quarrelsome person who wants the benefit without doing the work.`,`The thought is one of desert: someone who works hard may deserve the fruits of that work, while others have no claim to benefit from it for free.`,`Yet this reasoning may at most support a temporary right to use land while making good use of it. It does not explain a right to sell it, leave it to children, or keep it forever.`],`The argument presents desert as a possible implicit argument, not an unambiguous Locke doctrine.\n\n${src('5-6')}`);
question('What happens when the frontier disappears?','Can “enough and as good” still be true once desirable land is scarce?','The proviso is least troubling when equally good land remains. Scarcity makes the original exclusion problem reappear for those born later.',`The next section tests the proviso under conditions closer to the present.\n\n${src('6')}`);
section('II','Scarcity exposes the cost of the first claim',`The labor argument is under greatest pressure when no comparable land remains for others to take.\n\n${src('6-7')}`);
build('scarcity','Later generations cannot simply work unclaimed land',[`If the proviso is read literally, initial appropriation is justified only while there really is enough equally good land left for others.`,`Once good land is scarce, early claimants can take it, while later generations inherit the position of having no comparable land of their own.`,`Locke may reply that people are better off working for owners than they would have been in the state of nature. But this is a different and weaker condition than leaving enough and as good.`,`The later person’s complaint is not laziness. It is that an inherited advantage depends on what earlier ancestors happened to claim.`],`Do not equate the historical illustration with a claim about any one present property holder. The point is the structure of the justification.\n\n${src('6-7','Locke’s comparison of an American king and an English day laborer is discussed in the source material.')}`);
question('The underlying puzzle','What could one person do to an object that cancels everyone else’s previous liberty to use it?','The argument concludes that Locke’s premises make this powerful transition very hard to justify. That does not automatically prove that all property is theft.',`This is the pivot: the failure of a standalone acquisition principle may invite a different way to justify a property system.\n\n${src('7')}`);
build('pivot','Property may need to be justified as part of a whole system',[`The argument resists the simple conclusion that property is theft. Instead, it questions whether justice in acquisition can be treated as a separable element of distributive justice.`,`A theory might justify private property as one part of an overall just arrangement without explaining every original act of appropriation from nature.`,`Many defenses of the free market take this broader route. They ask what a property-and-exchange system does, rather than how every first owner acquired an object.`],`Signal the change in the question: from historical origin to the consequences of an institutional arrangement.\n\n${src('7-8')}`);
section('III','Can markets justify property by what they achieve?',`Introduce the utilitarian case: a system is defended because it promotes human happiness better than alternatives.\n\n${src('8')}`);
build('utilitarian','The market defense shifts attention from origin to outcomes',[`A utilitarian defense holds that allowing people to own, trade, improve, and leave property to descendants encourages productive use of talents and resources.`,`The central claim is comparative: extensive private property may contribute more to human happiness than alternative arrangements.`,`On this view, justice in transfer matters more than justice in initial acquisition. The market becomes the central mechanism for voluntary transfer.`],`Define utilitarian as concerned with the comparative contribution to human happiness, as the argument does.\n\n${src('8')}`);
head('The pure capitalist free-market model',[['Secure property','Land, raw materials, goods, and labor are held by individuals or firms.'],['Profit production','Goods are produced for profit rather than simply to meet need.'],['Voluntary exchange','Supply and demand organize trade between willing participants.'],['Free competition','Anyone may produce and offer a good for sale.']],`The argument calls this a pure model. Real economies modify each of these features.\n\n${src('8-9')}`);
duo('The radical alternative changes every feature',{label:'Free market',text:'Private ownership, profit, voluntary exchange, and competition coordinate production and distribution.'},{label:'Planned economy',text:'The state controls productive property, allocates goods centrally, and directs what and how much may be produced.'},`Avoid implying that every actual economy perfectly fits either ideal type.\n\n${src('9')}`);
question('How can unplanned choices coordinate?','If people act separately, who makes sure there is enough of the right things?','Central planning seems rational because it can aim directly at needs. The market must explain how dispersed choices can convey information and produce a response.',`Use the garlic example as the argument’s case study of price coordination.\n\n${src('9-10')}`);
section('IV','A price can carry a message without a planner',`The argument uses a change in the garlic market to show how prices and profit can coordinate dispersed action.\n\n${src('10-11')}`);
build('garlic','A rise in price tells producers that demand has changed',[`Suppose garlic sells for fifty pence a bulb. A report makes people want much more garlic, so retailers sell out and buyers bid the price upward.`,`The higher price signals that garlic is in short supply. It also creates higher profits for those who can supply it.`,`The prospect of profit gives new producers a reason to enter the garlic market. As supply rises, the price falls toward a new equilibrium.`,`The argument’s point is not that any particular price is morally fair. It is that price communicates information and profit gives people a reason to act on it.`],`The garlic report is a hypothetical illustration from the source material.\n\n${src('10-11')}`);
quote('It is not from the benevolence of the butcher, the brewer, or the baker that we expect our dinner, but from their regard to their own interest.','Adam Smith, The Wealth of Nations, p. 119; quoted in the source material',`Use this briefly to state the incentive claim: other people need not be altruistic to respond to what buyers want.\n\n${src('11','Smith quotation reproduced in the source material.')}`);
build('promise','Markets can respond to preference, competition, and scarcity',[`Price signals information about scarcity or oversupply. Profit gives producers an incentive to change what they make.`,`Competition can put pressure on prices and quality. In this way, people with money can express preferences through what they buy.`,`A central planner would have to know not only general needs, but fine-grained preferences such as vanilla rather than chocolate ice cream. The argument argues that planning requires extraordinary knowledge, power, and benevolence.`,`This is essentially a utilitarian case: compared with full planning, markets may produce greater efficiency and well-being.`],`Keep the qualifier “people with money” visible; it matters for the later critique.\n\n${src('11-12')}`);
question('Is efficiency the whole standard?','If markets coordinate well, does that show that an unmodified market is best?','The comparison with central planning leaves open a different question: whether markets systematically leave some costs and benefits out of the price system.',`The next section introduces market failure rather than treating it as an exception that can be ignored.\n\n${src('12-13')}`);
section('V','Some costs and benefits fall outside the price',`Externalities show why a market can be efficient for an exchange while still producing outcomes that are bad for others.\n\n${src('13-14')}`);
head('Externalities are effects on people outside a transaction',[['Negative externality','A cost someone else bears without choosing it, such as pollution or noise.'],['Positive externality','A benefit someone else receives without paying for it, such as a pleasant view.'],['Public good','A good whose benefits cannot be restricted to only those who paid, such as street lights.']],`Define each term in plain language before applying it.\n\n${src('13')}`);
build('publicgoods','Markets can oversupply harms and undersupply shared benefits',[`A producer may use a noisy process because it is cheaper, while other people bear the disturbance. The producer has effectively shifted part of the cost onto them.`,`Street lights benefit everyone nearby, including people who do not contribute. Each person can reason that they will receive the benefit whether or not they pay.`,`If everyone reasons this way, no one supplies the lights. This is the free-rider problem: a shared benefit can be underprovided because each individual can avoid paying.`,`The market therefore tends to oversupply goods with negative externalities and undersupply goods with positive externalities.`],`Tie “free-rider” to the incentive structure, not to a claim that people are unusually selfish.\n\n${src('13-14')}`);
build('intervention','The utilitarian defense can support changing the market',[`One standard response is for the state to provide public goods and tax citizens to pay for them.`,`The state can also make pollution illegal, returning a cost to the polluter rather than leaving it with those who suffer it.`,`Other approaches give victims a right to recover damages or allow providers of positive externalities to charge beneficiaries. The key point is that a utilitarian defense need not demand a completely unregulated market.`],`This is a transition to deeper criticisms, not an assertion that one policy solution is always best.\n\n${src('14')}`);
question('Are correction and welfare enough?','Can a modified market answer objections about work, power, and inequality?','The argument now turns to Marxist and socialist criticisms. They challenge not only market failures but the character and distribution of life under a market system.',`The next section keeps four objections distinct: waste, alienation, exploitation, and inequality.\n\n${src('14')}`);
section('VI','The market is accused of wasting people and possibilities',`Engels and Marx challenge the market on utilitarian, human, and distributive grounds.\n\n${src('14-18')}`);
build('waste','Engels sees boom and bust as a form of waste',[`Engels argues that markets create recurring crises in which businesses fail, people lose work, and goods are wasted or sold at a loss.`,`He also counts many people as unproductive under capitalism, including unemployed people and intermediaries between producers and consumers.`,`Defenders see intermediaries differently: they can move goods from where they are oversupplied to places where demand is high. The argument concludes that a modified market may still be more efficient than proposed alternatives.`],`Present both sides as competing evaluations within a utilitarian frame.\n\n${src('14-15','Engels’s Speeches in Elberfeld are discussed in the source material.')}`);
build('alienation','A job can produce goods while frustrating the worker',[`Alienation is the criticism that capitalist production can make work degrading and unfitting for human beings.`,`The profit motive can encourage a fine division of labor in which each worker performs a specialized, repetitive task.`,`Marx’s concern is that a person becomes subordinate to a machine, and their intelligent, creative potential is frustrated. The open question is whether this is specifically capitalist or a feature of modern technology more generally.`],`Do not treat alienation as merely disliking one’s job; it concerns a claim about human potential.\n\n${src('15')}`);
build('exploitation','Exploitation turns on the moral status of returns to property',[`For Marx, exploitation involves surplus labor: workers create profits for capitalists that are not proportional to the work capitalists perform.`,`Shareholders may receive a portion of profits without doing the productive work. On this view, people who receive less than they create are exploited.`,`A market defense says owners may fairly receive a return for property, machinery, raw materials, or risk. The disagreement therefore returns to the earlier issue: are they morally entitled to own the property that earns the return?`],`Connect this objection explicitly back to the initial-acquisition problem rather than presenting it as unrelated.\n\n${src('16')}`);
build('inequality','The market’s gains do not settle the justice of its inequalities',[`A final criticism is that an unconstrained market can lead to devastating poverty and very large inequalities. Welfare provisions can reduce the worst outcomes, yet wide differences remain.`,`Utilitarianism contains a case for redistribution: because of diminishing marginal returns, an extra good or sum of money may bring more benefit to a poor person than to a rich one.`,`But equality may also affect how much is produced. Defenders argue that some inequality creates incentives for innovation and work, producing more wealth overall.`,`The argument leaves a pointed question: even if a welfare-modified market maximizes happiness better than its alternatives, is that enough to make it just?`],`Use “diminishing marginal returns” in the argument’s simple biscuit example if further explanation is needed, but do not add claims beyond the text.\n\n${src('17-18')}`);
diagnostic('When does a system of ownership and exchange make people better off - and when does it merely make exclusion more efficient?',`End without resolving the tension. Rawls’s theory offers a subsequent way of addressing this concern.\n\n${src('18')}`);

const nodes=slides.map(renderSlide),counter=document.getElementById('counter'),progress=document.getElementById('progress'),notes=document.getElementById('notes'),notesBody=document.getElementById('notes-body'),overview=document.getElementById('overview'),overviewGrid=document.getElementById('overview-grid');let current=0;const label=s=>s.title||s.prompt||s.text||'Slide';slides.forEach((s,i)=>{const b=document.createElement('button');b.className='overview-card';b.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')} / ${slides.length}</span><span class="label">${esc(label(s))}</span>`;b.addEventListener('click',()=>{closePanels();show(i)});overviewGrid.appendChild(b)});const cards=[...overviewGrid.children];

function closePanels(){overview.classList.remove('open');notes.classList.remove('open')}function toggle(p){p.classList.contains('open')?closePanels():(closePanels(),p.classList.add('open'))}function fullscreen(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}document.getElementById('fullscreen').addEventListener('click',fullscreen);document.querySelectorAll('.close').forEach(b=>b.addEventListener('click',closePanels));document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanels();return}if(overview.classList.contains('open')||notes.classList.contains('open'))return;if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();show(current+1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}else if(e.key.toLowerCase()==='o')toggle(overview);else if(e.key.toLowerCase()==='n')toggle(notes);else if(e.key.toLowerCase()==='f')fullscreen()});let tx=0,ty=0;document.addEventListener('touchstart',e=>{tx=e.changedTouches[0].screenX;ty=e.changedTouches[0].screenY},{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-tx,dy=e.changedTouches[0].screenY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))show(current+(dx<0?1:-1))},{passive:true});
