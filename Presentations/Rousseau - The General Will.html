<style>
  :root{

  *{box-sizing:border-box}

  body{font-family:Inter,system-ui,sans-serif}

  .title{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;letter-spacing:-.018em}

  .cover .work{font:500 calc(clamp(20px,2.15vw,31px)*var(--fit))/1.4 "Cormorant Garamond",Georgia,serif;color:var(--vellum);margin:1.5rem auto 0;max-width:36ch}
  .cover .course{margin-top:2.4rem;color:var(--gold);font:500 calc(clamp(11px,1vw,15px)*var(--fit))/1.4 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
  .section .slide-inner{width:min(900px,86vw)}

  .content .title,.head .title,.duo .title{font-size:calc(clamp(38px,4.5vw,62px)*var(--fit));line-height:1.05;margin-bottom:1.6rem}
  .content .body{font-family:"Cormorant Garamond",Georgia,serif;font-size:calc(clamp(25px,2.35vw,35px)*var(--fit));line-height:1.34;text-align:left}

    margin:0 0 1.05em -1.25rem;

    border-left:3px solid transparent;

  }
  .content .body p:last-child{margin-bottom:1.05em}
  .content .body p.fresh{
    color:var(--text);
    border-left-color:var(--gold);
    background:linear-gradient(90deg,rgba(201,162,75,.15),rgba(201,162,75,0) 78%);
    text-shadow:0 0 18px rgba(239,231,214,.08);
  }
  .question .slide-inner,.diagnostic .slide-inner{width:min(900px,86vw)}
  .question .prompt,.diagnostic .prompt{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:calc(clamp(42px,5.2vw,72px)*var(--fit));line-height:1.08;font-weight:600;letter-spacing:-.015em}
  .question .prompt::after,.diagnostic .prompt::after{content:"";display:block;width:42px;height:2px;background:var(--gold);margin:1.8rem auto 0}

  .quote blockquote{margin:0 auto;max-width:26ch;font-family:"Cormorant Garamond",Georgia,serif;font-size:calc(clamp(39px,4.45vw,63px)*var(--fit));line-height:1.12;font-weight:500}
  .quote blockquote::before{content:"“";color:var(--gold);margin-right:.08em}
  .quote blockquote::after{content:"”";color:var(--gold);margin-left:.08em}
  .quote cite{display:block;margin-top:1.6rem;color:var(--vellum);font:500 calc(clamp(12px,1.15vw,17px)*var(--fit))/1.45 "IBM Plex Mono",monospace;font-style:normal}
  .duo-grid{display:grid;grid-template-columns:1fr 1fr;gap:4.5rem;text-align:left;margin-top:1.5rem}

  .duo-col p{margin:0;color:var(--text);font:500 calc(clamp(24px,2.15vw,33px)*var(--fit))/1.34 "Cormorant Garamond",Georgia,serif}
  .head-list{display:grid;gap:1.15rem;text-align:left;margin-top:1.8rem}
  .head-item{display:grid;grid-template-columns:9rem 1fr;gap:1.5rem;align-items:baseline;padding-top:1rem;border-top:1px solid var(--border)}
  .head-item b{color:var(--gold);font:600 calc(clamp(12px,1.1vw,16px)*var(--fit))/1.3 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
  .head-item span{min-width:0;font:500 calc(clamp(23px,2.05vw,31px)*var(--fit))/1.3 "Cormorant Garamond",Georgia,serif}
  .diagnostic .eyebrow{color:var(--vellum)}
  .diagnostic .prompt{font-size:calc(clamp(52px,6.6vw,90px)*var(--fit))}
  .refs .slide-inner{width:min(980px,86vw);text-align:left}
  .refs .title{font-size:calc(clamp(40px,4.6vw,64px)*var(--fit));margin-bottom:1.7rem}
  .refs-list{display:grid;gap:1.05rem}
  .ref{padding-top:.95rem;border-top:1px solid var(--border);font:500 calc(clamp(18px,1.65vw,24px)*var(--fit))/1.38 "Cormorant Garamond",Georgia,serif;color:var(--vellum)}
  .ref strong{color:var(--text);font-weight:600}
  #progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--gold);z-index:30}
  #nav-hint,#counter{position:fixed;bottom:18px;z-index:30;color:var(--vellum);font:500 12px/1.3 "IBM Plex Mono",monospace;letter-spacing:.08em}
  #nav-hint{left:24px} #counter{right:24px}
  #fullscreen{position:fixed;top:20px;right:22px;z-index:30;color:var(--vellum);background:transparent;border:1px solid var(--border);border-radius:3px;padding:8px 11px;cursor:pointer;font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
  #fullscreen:hover{color:var(--gold);border-color:var(--gold-dim)}
  .panel{position:fixed;inset:4vh 4vw;z-index:60;display:none;background:rgba(18,20,26,.985);border:1px solid var(--border);overflow:auto}
  .panel.open{display:block}
  .panel-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;background:var(--bg-2);border-bottom:1px solid var(--border);z-index:2}

  .close{color:var(--text);background:transparent;border:1px solid var(--border);padding:7px 10px;cursor:pointer}
  #overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:20px}

  .overview-card .num{display:block;color:var(--gold);font:500 11px/1.3 "IBM Plex Mono",monospace;margin-bottom:12px}
  .overview-card .label{font:600 22px/1.1 "Cormorant Garamond",Georgia,serif}
  #notes-body{padding:28px 34px;white-space:pre-wrap;color:var(--text);font:400 18px/1.62 Inter,sans-serif;max-width:900px}

    .slide{padding:9vh 8vw 10vh}.slide.top{padding-top:9.5vh}.slide-inner,.slide.duo .slide-inner{width:84vw}
    .duo-grid{grid-template-columns:1fr;gap:1.5rem}.head-item{grid-template-columns:1fr;gap:.45rem}
    #nav-hint{display:none}#fullscreen{top:12px;right:12px}.content .body{font-size:calc(clamp(22px,5.6vw,30px)*var(--fit))}
    .duo-col p{font-size:calc(clamp(22px,5.3vw,29px)*var(--fit))}
  }
  /* General Will: a civic assembly poster — public argument, equal voices, and visible disagreement. */
  :root{--bg:#f6f0e3;--bg-2:#e8ddca;--text:#17233e;--vellum:#53627a;--gold:#b6453a;--gold-dim:#81332f;--border:rgba(23,35,62,.2)}
  html,body{background:var(--bg)}

  .slide-inner{position:relative;z-index:1}

  .section .title{color:var(--text);line-height:.98}
  .section .rule{width:100%;height:3px;margin:1.35rem 0 0;background:linear-gradient(90deg,var(--text) 0 24%,var(--gold) 24% 48%,transparent 48%)}
  .content .slide-inner,.head .slide-inner{width:min(1050px,88vw);padding:1rem 1.65rem 1.35rem;border-left:6px solid var(--text);background:rgba(255,250,240,.56)}
  .content .title,.head .title,.duo .title{color:var(--text);margin-bottom:1.25rem;padding-bottom:.65rem;border-bottom:2px solid rgba(23,35,62,.22)}
  .content .body p{margin-left:0;padding:.42em .95em;color:rgba(23,35,62,.58);border-left:4px solid transparent;background:transparent}
  .content .body p:nth-child(odd){background:rgba(23,35,62,.035)}
  .content .body p.fresh{color:var(--text);border-left-color:var(--gold);background:linear-gradient(90deg,rgba(182,69,58,.15),rgba(23,35,62,.04),transparent 83%);text-shadow:none}
  .question .slide-inner,.diagnostic .slide-inner{padding:2.55rem 3.15rem;border:5px solid var(--text);border-radius:0;color:#fffaf0;background:var(--text);box-shadow:12px 12px 0 var(--gold)}
  .question .eyebrow,.diagnostic .eyebrow{color:#f7c05e}.question .prompt,.diagnostic .prompt{color:#fffaf0}.question .context{color:#d8e0e7}

  .quote .slide-inner{max-width:min(950px,84vw);padding:2.2rem 3rem;border-left:10px solid var(--gold);border-top:1px solid rgba(23,35,62,.22);border-bottom:1px solid rgba(23,35,62,.22);border-radius:0;background:rgba(255,250,240,.68)}

  #progress{height:6px;background:linear-gradient(90deg,var(--gold) 0 50%,var(--text) 50% 100%)}

<script>
const slides = [{"type":"cover","title":"The General Will","work":"Rousseau on democratic self-rule, equality, and freedom","course":"Political Philosophy","notes":"Begin with the promise: Rousseau wants citizens to obey only laws they give themselves. The difficulty is discovering when a majority decision really expresses a common good.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 1-2.\n[/Sources]"},{"type":"section","eyebrow":"I. WHO SHOULD RULE WHEN EVERYONE MUST LIVE UNDER THE LAW?","title":"Who should rule when everyone must live under the law?","notes":"Introduce Rousseau as a democratic alternative to Plato: political education should belong to all citizens, not a select few.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 1.\n[/Sources]"},{"type":"content","title":"Rousseau spreads the work of ruling","paragraphs":["Plato argues that ruling requires special training, but Rousseau rejects the idea that this training should belong only to a few experts."],"buildGroup":"civic-opening","notes":"Keep the opening contrast precise: Rousseau does not reject political education; he democratizes it.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 1.\n[/Sources]"},{"type":"content","title":"Rousseau spreads the work of ruling","paragraphs":["Plato argues that ruling requires special training, but Rousseau rejects the idea that this training should belong only to a few experts.","Rousseau wants every citizen educated for public life and included in the body he calls the Sovereign: the people acting collectively with authority over themselves."],"buildGroup":"civic-opening","notes":"Keep the opening contrast precise: Rousseau does not reject political education; he democratizes it.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 1.\n[/Sources]"},{"type":"content","title":"Rousseau spreads the work of ruling","paragraphs":["Plato argues that ruling requires special training, but Rousseau rejects the idea that this training should belong only to a few experts.","Rousseau wants every citizen educated for public life and included in the body he calls the Sovereign: the people acting collectively with authority over themselves.","Citizenship therefore means more than having rights. It requires active public service and a willingness to support laws that express the shared interest."],"buildGroup":"civic-opening","notes":"Keep the opening contrast precise: Rousseau does not reject political education; he democratizes it.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 1.\n[/Sources]"},{"type":"question","eyebrow":"The first tension","prompt":"How can everyone rule together without turning the state into a permanent mass meeting?","context":"Rousseau’s answer will divide political authority: the people make general laws, while an executive applies them. Before that division can work, we need his account of the general will.","notes":"Use this question to move from civic education to Rousseau’s central concept.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 1-2.\n[/Sources]"},{"type":"section","eyebrow":"II. THE GENERAL WILL IS NOT JUST THE WILL OF THE MAJORITY","title":"The general will is not just the will of the majority","notes":"Define Rousseau’s distinction before introducing the institutional machinery that depends on it.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 2-3.\n[/Sources]"},{"type":"content","title":"Two kinds of political will","paragraphs":["A particular will is what a person wants for themselves: a preference shaped by their own interests."],"buildGroup":"will-distinction","notes":"Make the contrast visible: adding preferences is not the same as asking what everyone can share as citizens.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 2-3.\n[/Sources]"},{"type":"content","title":"Two kinds of political will","paragraphs":["A particular will is what a person wants for themselves: a preference shaped by their own interests.","The will of all is the sum of everyone’s particular wills. Adding private demands together can produce a collection of conflicting or impossible claims."],"buildGroup":"will-distinction","notes":"Make the contrast visible: adding preferences is not the same as asking what everyone can share as citizens.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 2-3.\n[/Sources]"},{"type":"content","title":"Two kinds of political will","paragraphs":["A particular will is what a person wants for themselves: a preference shaped by their own interests.","The will of all is the sum of everyone’s particular wills. Adding private demands together can produce a collection of conflicting or impossible claims.","The general will is different. It aims at the common interest: a policy that is equally in the interests of all citizens rather than specially advantageous to one person or group."],"buildGroup":"will-distinction","notes":"Make the contrast visible: adding preferences is not the same as asking what everyone can share as citizens.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 2-3.\n[/Sources]"},{"type":"content","title":"A wage dispute makes the distinction concrete","paragraphs":["Imagine 1,000 employees sharing a fixed £1 million fund for wage increases. Each employee would prefer to receive as much as possible."],"buildGroup":"wage-example","notes":"This is the argument’s illustration. Let the fixed budget expose why a common interest cannot be reduced to the sum of private wishes.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 2-3.\n[/Sources]"},{"type":"content","title":"A wage dispute makes the distinction concrete","paragraphs":["Imagine 1,000 employees sharing a fixed £1 million fund for wage increases. Each employee would prefer to receive as much as possible.","The will of all would be the sum of those private demands: everyone asking for the whole fund. That total cannot be granted."],"buildGroup":"wage-example","notes":"This is the argument’s illustration. Let the fixed budget expose why a common interest cannot be reduced to the sum of private wishes.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 2-3.\n[/Sources]"},{"type":"content","title":"A wage dispute makes the distinction concrete","paragraphs":["Imagine 1,000 employees sharing a fixed £1 million fund for wage increases. Each employee would prefer to receive as much as possible.","The will of all would be the sum of those private demands: everyone asking for the whole fund. That total cannot be granted.","A policy that distributes the fund equally expresses the general interest. It is not anyone’s special demand, but it treats all members as equally entitled unless there is a strong reason to do otherwise."],"buildGroup":"wage-example","notes":"This is the argument’s illustration. Let the fixed budget expose why a common interest cannot be reduced to the sum of private wishes.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 2-3.\n[/Sources]"},{"type":"quote","text":"The general will","cite":"Rousseau, The Social Contract (1762), bk. II, ch. 4, p. 62","notes":"Use the short phrase as a hinge: the general will must be general “in its object as well as its essence.”\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 3.\nPrimary work quoted in the argument: Jean-Jacques Rousseau, The Social Contract (1762), bk. II, ch. 4, p. 62.\n[/Sources]"},{"type":"question","eyebrow":"A harder standard","prompt":"What would stop a majority from passing a law that benefits one group while merely pretending to serve everyone?","context":"Rousseau’s answer is that the general will must govern through general laws, not rulers’ targeted commands.","notes":"The next section makes the legal form of the general will explicit.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 3.\n[/Sources]"},{"type":"section","eyebrow":"III. LAWS MUST RULE; RULERS MUST NOT","title":"Laws must rule; rulers must not","notes":"Clarify the difference between the Sovereign, the government, and the kinds of acts each may perform.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 3-4.\n[/Sources]"},{"type":"content","title":"The general will must govern everyone in principle","paragraphs":["A law expresses the general will only when it applies equally to all citizens in principle. It cannot be a private order aimed at a named person or group."],"buildGroup":"general-law","notes":"Stress Rousseau’s rule-of-law idea: equal applicability is supposed to prevent the law from becoming an instrument of personal power.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 3.\n[/Sources]"},{"type":"content","title":"The general will must govern everyone in principle","paragraphs":["A law expresses the general will only when it applies equally to all citizens in principle. It cannot be a private order aimed at a named person or group.","This generality protects the idea of common interest: every citizen is subject to the same kind of rule, even when the rule has different effects in particular cases."],"buildGroup":"general-law","notes":"Stress Rousseau’s rule-of-law idea: equal applicability is supposed to prevent the law from becoming an instrument of personal power.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 3.\n[/Sources]"},{"type":"content","title":"The general will must govern everyone in principle","paragraphs":["A law expresses the general will only when it applies equally to all citizens in principle. It cannot be a private order aimed at a named person or group.","This generality protects the idea of common interest: every citizen is subject to the same kind of rule, even when the rule has different effects in particular cases.","The people, acting as Sovereign, make these laws. They do not hand their lawmaking power to a ruler who decides the common good on their behalf."],"buildGroup":"general-law","notes":"Stress Rousseau’s rule-of-law idea: equal applicability is supposed to prevent the law from becoming an instrument of personal power.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 3.\n[/Sources]"},{"type":"duo","title":"One state, two kinds of authority","left":{"label":"The Sovereign","text":"The people assembled make general laws that express the common interest."},"right":{"label":"The government","text":"An executive administers those laws and handles particular acts, such as deciding whether conditions for war have been met."},"notes":"This is how Rousseau differs from Plato: even his “elected aristocracy” may apply the law, but it may not make the law.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 3-4.\n[/Sources]"},{"type":"content","title":"Popular assemblies are where the general will is declared","paragraphs":["Rousseau says the Sovereign can act only when the people are assembled. Laws therefore arise in popular assemblies rather than in a parliament of permanent representatives."],"buildGroup":"assembly","notes":"Keep the assembly tied to the concept of the general will. The point is not merely more frequent voting; it is a different understanding of what a vote is for.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 4.\n[/Sources]"},{"type":"content","title":"Popular assemblies are where the general will is declared","paragraphs":["Rousseau says the Sovereign can act only when the people are assembled. Laws therefore arise in popular assemblies rather than in a parliament of permanent representatives.","The assembly does not ask each person whether a proposal matches their private interest. It asks whether the proposal conforms to the general will, understood as the common interest."],"buildGroup":"assembly","notes":"Keep the assembly tied to the concept of the general will. The point is not merely more frequent voting; it is a different understanding of what a vote is for.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 4.\n[/Sources]"},{"type":"content","title":"Popular assemblies are where the general will is declared","paragraphs":["Rousseau says the Sovereign can act only when the people are assembled. Laws therefore arise in popular assemblies rather than in a parliament of permanent representatives.","The assembly does not ask each person whether a proposal matches their private interest. It asks whether the proposal conforms to the general will, understood as the common interest.","Voting is therefore a judgment about what is right for the political community, not a market in which each person simply trades their vote for a personal benefit."],"buildGroup":"assembly","notes":"Keep the assembly tied to the concept of the general will. The point is not merely more frequent voting; it is a different understanding of what a vote is for.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 4.\n[/Sources]"},{"type":"quote","text":"When the opinion contrary to my own prevails, it proves nothing more than I made a mistake","cite":"Rousseau, The Social Contract (1762), bk. IV, ch. 2, p. 124","notes":"The quotation captures Rousseau’s strong assumption: a dissenting voter may be wrong about the general will.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 4.\nPrimary work quoted in the argument: Jean-Jacques Rousseau, The Social Contract (1762), bk. IV, ch. 2, p. 124.\n[/Sources]"},{"type":"question","eyebrow":"Truth or obedience?","prompt":"Why should a majority vote be trusted to discover the morally correct policy rather than merely count preferences?","context":"The argument connects Rousseau to Condorcet’s claim that voting can find the right answer when citizens vote on what is right and are, on average, more likely than not to be correct.","notes":"This question opens the instrumental defense of democracy.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 4-5.\n[/Sources]"},{"type":"section","eyebrow":"IV. DEMOCRACY WORKS ONLY IF CITIZENS ARE PREPARED TO JUDGE THE COMMON GOOD","title":"Democracy works only if citizens are prepared to judge the common good","notes":"Introduce the two conditions needed for voting to be a truth-tracking device.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 4-5.\n[/Sources]"},{"type":"content","title":"Rousseau’s democracy needs two things","paragraphs":["First, citizens must vote for what they think is morally right, not simply for the outcome that most favors them personally."],"buildGroup":"condorcet-conditions","notes":"Do not present this as a proof that every majority is right. It is a conditional argument about when voting can be reliable.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 4-5.\n[/Sources]"},{"type":"content","title":"Rousseau’s democracy needs two things","paragraphs":["First, citizens must vote for what they think is morally right, not simply for the outcome that most favors them personally.","Second, citizens must have a better-than-even chance of being right about the common good. If both conditions hold, a large majority is likely to reach the correct answer."],"buildGroup":"condorcet-conditions","notes":"Do not present this as a proof that every majority is right. It is a conditional argument about when voting can be reliable.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 4-5.\n[/Sources]"},{"type":"content","title":"Rousseau’s democracy needs two things","paragraphs":["First, citizens must vote for what they think is morally right, not simply for the outcome that most favors them personally.","Second, citizens must have a better-than-even chance of being right about the common good. If both conditions hold, a large majority is likely to reach the correct answer.","Rousseau’s political design tries to make both conditions plausible: educate citizens, reduce class conflict, and structure laws so that everyone is affected by them equally."],"buildGroup":"condorcet-conditions","notes":"Do not present this as a proof that every majority is right. It is a conditional argument about when voting can be reliable.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 4-5.\n[/Sources]"},{"type":"quote","text":"No civilized state should have citizens too ignorant to participate in government","cite":"W. E. B. Du Bois, “Of the Ruling of Men” (1920), p. 81","notes":"The quotation sharpens Rousseau’s educational demand: political competence is a duty of the state, not a reason to exclude citizens.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 5.\nPrimary work quoted in the argument: W. E. B. Du Bois, “Of the Ruling of Men,” in Darkwater (1920), p. 81.\n[/Sources]"},{"type":"question","eyebrow":"The social obstacle","prompt":"Can citizens really discover one common interest when they live in unequal classes with opposed economic positions?","context":"Rousseau’s next move is not to deny class conflict. It is to say that the conditions for a general will require rough equality in the first place.","notes":"Move from the epistemic problem of voting to the material structure that makes common judgment possible.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 5-6.\n[/Sources]"},{"type":"section","eyebrow":"V. EQUALITY IS A PRECONDITION FOR THE GENERAL WILL","title":"Equality is a precondition for the general will","notes":"Show why Rousseau treats large economic inequalities as threats to both political judgment and political freedom.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 5-6.\n[/Sources]"},{"type":"content","title":"No one should be rich enough to buy another person","paragraphs":["If some citizens are rich and others poor, the law may appear general while its effects and political influence remain unequal."],"buildGroup":"equality","notes":"The point is political, not merely economic. Equality protects the conditions under which citizens can form a shared judgment.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 5-6.\n[/Sources]"},{"type":"content","title":"No one should be rich enough to buy another person","paragraphs":["If some citizens are rich and others poor, the law may appear general while its effects and political influence remain unequal.","The rich can use money and influence to arrange laws in their own favor; the poor may be pressured to sell their votes or political independence."],"buildGroup":"equality","notes":"The point is political, not merely economic. Equality protects the conditions under which citizens can form a shared judgment.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 5-6.\n[/Sources]"},{"type":"content","title":"No one should be rich enough to buy another person","paragraphs":["If some citizens are rich and others poor, the law may appear general while its effects and political influence remain unequal.","The rich can use money and influence to arrange laws in their own favor; the poor may be pressured to sell their votes or political independence.","Rousseau therefore requires rough equality: no citizen should be rich enough to buy another, and no citizen should be poor enough to be forced to sell themselves."],"buildGroup":"equality","notes":"The point is political, not merely economic. Equality protects the conditions under which citizens can form a shared judgment.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 5-6.\n[/Sources]"},{"type":"content","title":"Partial associations turn citizens into blocs","paragraphs":["Even if citizens are sincere, organized factions can distort their view of the common good by making one group’s interest feel like the whole community’s interest."],"buildGroup":"factions","notes":"Use the union example to show how a group can be internally general and externally particular at the same time.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 6-7.\n[/Sources]"},{"type":"content","title":"Partial associations turn citizens into blocs","paragraphs":["Even if citizens are sincere, organized factions can distort their view of the common good by making one group’s interest feel like the whole community’s interest.","Return to the wage example: ten unions may each demand more than their fair share. Each union has a general interest for its own members, but a particular interest toward everyone else."],"buildGroup":"factions","notes":"Use the union example to show how a group can be internally general and externally particular at the same time.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 6-7.\n[/Sources]"},{"type":"content","title":"Partial associations turn citizens into blocs","paragraphs":["Even if citizens are sincere, organized factions can distort their view of the common good by making one group’s interest feel like the whole community’s interest.","Return to the wage example: ten unions may each demand more than their fair share. Each union has a general interest for its own members, but a particular interest toward everyone else.","Rousseau therefore distrusts parties and factions. He recommends either no political parties or so many competing associations that no single group can dominate the whole."],"buildGroup":"factions","notes":"Use the union example to show how a group can be internally general and externally particular at the same time.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 6-7.\n[/Sources]"},{"type":"content","title":"Civic education widens the field of concern","paragraphs":["Rousseau wants people raised to identify strongly with the political community rather than viewing public decisions as contests among private groups."],"buildGroup":"civic-identity","notes":"Name the worry without resolving it: shaping citizens to identify with the state can look like civic formation or like indoctrination.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 7.\n[/Sources]"},{"type":"content","title":"Civic education widens the field of concern","paragraphs":["Rousseau wants people raised to identify strongly with the political community rather than viewing public decisions as contests among private groups.","Education in civic virtue is meant to make citizens cherish one another and care about the state as a whole. The goal is not to erase judgment, but to orient judgment toward the common interest."],"buildGroup":"civic-identity","notes":"Name the worry without resolving it: shaping citizens to identify with the state can look like civic formation or like indoctrination.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 7.\n[/Sources]"},{"type":"question","eyebrow":"Unity or indoctrination?","prompt":"If the state teaches citizens to want what society wants, can it still claim to protect individual freedom?","context":"Rousseau’s answer adds two more instruments of unity: a censor who enforces public morality and a civil religion that gives citizens shared commitments.","notes":"Let the question carry the argument into Rousseau’s most illiberal devices.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 7-8.\n[/Sources]"},{"type":"section","eyebrow":"VI. SOCIAL UNITY IS BUILT THROUGH EDUCATION, CENSORSHIP, AND CIVIL RELIGION","title":"Social unity is built through education, censorship, and civil religion","notes":"Present Rousseau’s devices as attempts to secure the motivations his democratic system requires.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 7-9.\n[/Sources]"},{"type":"content","title":"Rousseau tries to make the general will psychologically possible","paragraphs":["The censor is not described mainly as a modern speech police. Its explicit task is to encourage public morality by ridiculing and discouraging behavior judged anti-social."],"buildGroup":"unity-devices","notes":"The argument notes Rousseau’s reply to the charge of artificial unity: education formalizes customs and traditions that should already bind a people together.\n\nConstructed analogy: a shared civic language can coordinate action, but it can also punish people who speak outside it.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 7-9.\n[/Sources]"},{"type":"content","title":"Rousseau tries to make the general will psychologically possible","paragraphs":["The censor is not described mainly as a modern speech police. Its explicit task is to encourage public morality by ridiculing and discouraging behavior judged anti-social.","Civil religion asks citizens to affirm shared sentiments of sociability. Private religions may be tolerated, but only when they also tolerate others and do not make citizens enemies."],"buildGroup":"unity-devices","notes":"The argument notes Rousseau’s reply to the charge of artificial unity: education formalizes customs and traditions that should already bind a people together.\n\nConstructed analogy: a shared civic language can coordinate action, but it can also punish people who speak outside it.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 7-9.\n[/Sources]"},{"type":"content","title":"Rousseau tries to make the general will psychologically possible","paragraphs":["The censor is not described mainly as a modern speech police. Its explicit task is to encourage public morality by ridiculing and discouraging behavior judged anti-social.","Civil religion asks citizens to affirm shared sentiments of sociability. Private religions may be tolerated, but only when they also tolerate others and do not make citizens enemies.","Together with civic education, these devices are meant to produce citizens who can see themselves as members of one common association rather than as competitors for private advantage."],"buildGroup":"unity-devices","notes":"The argument notes Rousseau’s reply to the charge of artificial unity: education formalizes customs and traditions that should already bind a people together.\n\nConstructed analogy: a shared civic language can coordinate action, but it can also punish people who speak outside it.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 7-9.\n[/Sources]"},{"type":"duo","title":"The instrumental case versus the lived cost","left":{"label":"Why democracy could work","text":"Education, equality, and civic unity make citizens more likely to vote for the common good and make majority decisions more likely to be right."},"right":{"label":"Why the system feels dangerous","text":"The same tools can suppress difference, punish dissent, and demand a shared identity that leaves too little room for independent thought."},"notes":"This is the argument’s central evaluation problem: a system can be reliable at producing correct outcomes and still be unattractive as a way of life.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 7-9.\n[/Sources]"},{"type":"question","eyebrow":"A democracy worth wanting?","prompt":"Even if Rousseau’s institutions could find the right answer, would we want to live under the conditions they require?","context":"The next section tests Rousseau’s polity against the values of equality and freedom, not only against the accuracy of its decisions.","notes":"Shift from instrumental justification to the intrinsic value of democracy.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 9.\n[/Sources]"},{"type":"section","eyebrow":"VII. EQUALITY CAN BE DEFENDED WHILE THE CITIZENRY REMAINS EXCLUDED","title":"Equality can be defended while the citizenry remains excluded","notes":"Examine the gap between Rousseau’s egalitarian principle and his restricted account of who counts as a citizen.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 9-11.\n[/Sources]"},{"type":"content","title":"Rousseau’s equality is powerful but incomplete","paragraphs":["Rousseau’s general will is deeply egalitarian: the correct policy must benefit citizens equally, and every citizen has an equal say in trying to discover it."],"buildGroup":"equality-paradox","notes":"Be explicit that this is the argument’s criticism of Rousseau’s polity, not an attempt to rescue the historical exclusion.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 9-11.\n[/Sources]"},{"type":"content","title":"Rousseau’s equality is powerful but incomplete","paragraphs":["Rousseau’s general will is deeply egalitarian: the correct policy must benefit citizens equally, and every citizen has an equal say in trying to discover it.","But Rousseau uses “citizen” in a restricted way. He assumes that women are subordinate and that political citizenship belongs to men."],"buildGroup":"equality-paradox","notes":"Be explicit that this is the argument’s criticism of Rousseau’s polity, not an attempt to rescue the historical exclusion.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 9-11.\n[/Sources]"},{"type":"content","title":"Rousseau’s equality is powerful but incomplete","paragraphs":["Rousseau’s general will is deeply egalitarian: the correct policy must benefit citizens equally, and every citizen has an equal say in trying to discover it.","But Rousseau uses “citizen” in a restricted way. He assumes that women are subordinate and that political citizenship belongs to men.","The argument argues that this exclusion conflicts with the logic of Rousseau’s own political thought. If equal standing is the basis of common rule, there is no good reason to reserve it for male citizens."],"buildGroup":"equality-paradox","notes":"Be explicit that this is the argument’s criticism of Rousseau’s polity, not an attempt to rescue the historical exclusion.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 9-11.\n[/Sources]"},{"type":"quote","text":"The washing machine has made inclusive democracy possible","cite":"The argument’s reflection on universal suffrage and domestic labor","notes":"The point is not that technology alone creates equality. It is that the time demanded by active citizenship has historically depended on unequal domestic labor and property assumptions.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 10-11.\n[/Sources]"},{"type":"question","eyebrow":"How inclusive is self-rule?","prompt":"Can a political order call itself democratic if some people’s time, labor, or voice makes other people’s participation possible?","context":"The critique now turns from who belongs to freedom: what kind of liberty does Rousseau think the general will gives citizens?","notes":"This question connects the franchise problem to the argument’s analysis of freedom.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 10-12.\n[/Sources]"},{"type":"content","title":"Rousseau defines freedom as self-legislation","paragraphs":["Rousseau’s polity restricts freedom of thought through civil religion, bans on atheism and intolerant religion, and the censor’s enforcement of public morality."],"buildGroup":"freedom","notes":"Define positive freedom as the argument does: freedom requires certain kinds of action and self-government, not only absence of interference.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 11-12.\n[/Sources]"},{"type":"content","title":"Rousseau defines freedom as self-legislation","paragraphs":["Rousseau’s polity restricts freedom of thought through civil religion, bans on atheism and intolerant religion, and the censor’s enforcement of public morality.","He nevertheless claims that citizens remain free because they obey laws they prescribe to themselves as members of the Sovereign."],"buildGroup":"freedom","notes":"Define positive freedom as the argument does: freedom requires certain kinds of action and self-government, not only absence of interference.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 11-12.\n[/Sources]"},{"type":"content","title":"Rousseau defines freedom as self-legislation","paragraphs":["Rousseau’s polity restricts freedom of thought through civil religion, bans on atheism and intolerant religion, and the censor’s enforcement of public morality.","He nevertheless claims that citizens remain free because they obey laws they prescribe to themselves as members of the Sovereign.","This is a positive idea of freedom: being free means living according to the rational law one gives oneself, not merely following whatever desire happens to be strongest."],"buildGroup":"freedom","notes":"Define positive freedom as the argument does: freedom requires certain kinds of action and self-government, not only absence of interference.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 11-12.\n[/Sources]"},{"type":"quote","text":"The impulsion of mere appetite is slavery, and obedience to the law one has prescribed to oneself is freedom","cite":"Rousseau, The Social Contract (1762), bk. IV, ch. 8, p. 54","notes":"Let the quotation do the work of stating Rousseau’s positive conception of freedom.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 12.\nPrimary work quoted in the argument: Jean-Jacques Rousseau, The Social Contract (1762), bk. IV, ch. 8, p. 54.\n[/Sources]"},{"type":"question","eyebrow":"The forced-free problem","prompt":"If the majority identifies the general will and forces a dissenter to obey it, in what sense is that person free?","context":"Rousseau can reply that doing what one prefers is slavery to impulse. Critics reply that obedience to a law that defeats your judgment may still be coercion.","notes":"This is the hinge into the argument’s radical criticism of Rousseau.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 12-14.\n[/Sources]"},{"type":"section","eyebrow":"VIII. THE PRICE OF THE GENERAL WILL MAY BE REPRESSION","title":"The price of the general will may be repression","notes":"Present the three linked criticisms: the general will may not exist, dissent may be criminalized, and participation may not equal freedom.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 13-14.\n[/Sources]"},{"type":"content","title":"Rousseau’s safeguards create a dangerous bargain","paragraphs":["First, modern societies are divided by class, religion, moral outlook, culture, ethnicity, and race. A policy equally in everyone’s interest may be rare or impossible to identify."],"buildGroup":"radical-critique","notes":"Keep the structure of the criticism visible: the conditions that make the general will easier to discover also make disagreement harder to tolerate.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 13-14.\n[/Sources]"},{"type":"content","title":"Rousseau’s safeguards create a dangerous bargain","paragraphs":["First, modern societies are divided by class, religion, moral outlook, culture, ethnicity, and race. A policy equally in everyone’s interest may be rare or impossible to identify.","Second, Rousseau’s treatment of minority views is harsh. If dissent is treated as treason, the system assumes that the majority has found the general will and that dissenters are mistaken or anti-social."],"buildGroup":"radical-critique","notes":"Keep the structure of the criticism visible: the conditions that make the general will easier to discover also make disagreement harder to tolerate.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 13-14.\n[/Sources]"},{"type":"content","title":"Rousseau’s safeguards create a dangerous bargain","paragraphs":["First, modern societies are divided by class, religion, moral outlook, culture, ethnicity, and race. A policy equally in everyone’s interest may be rare or impossible to identify.","Second, Rousseau’s treatment of minority views is harsh. If dissent is treated as treason, the system assumes that the majority has found the general will and that dissenters are mistaken or anti-social.","Third, taking part in a vote does not automatically mean that the resulting law is one you authored. A minority may have participated in the procedure while the law was created despite its members."],"buildGroup":"radical-critique","notes":"Keep the structure of the criticism visible: the conditions that make the general will easier to discover also make disagreement harder to tolerate.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 13-14.\n[/Sources]"},{"type":"content","title":"Rousseau’s safeguards create a dangerous bargain","paragraphs":["First, modern societies are divided by class, religion, moral outlook, culture, ethnicity, and race. A policy equally in everyone’s interest may be rare or impossible to identify.","Second, Rousseau’s treatment of minority views is harsh. If dissent is treated as treason, the system assumes that the majority has found the general will and that dissenters are mistaken or anti-social.","Third, taking part in a vote does not automatically mean that the resulting law is one you authored. A minority may have participated in the procedure while the law was created despite its members.","The same tight social unity that makes Rousseau’s democracy look reliable also makes it unacceptably repressive. It may secure equality, but at the cost of freedom, pluralism, and diversity."],"buildGroup":"radical-critique","notes":"Keep the structure of the criticism visible: the conditions that make the general will easier to discover also make disagreement harder to tolerate.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 13-14.\n[/Sources]"},{"type":"quote","text":"Forced to be free","cite":"Rousseau’s phrase as discussed in the source material","notes":"This phrase names the paradox, not a solution. If freedom is identified with obedience to the general will, coercion can be redescribed as liberation.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 12-14.\n[/Sources]"},{"type":"question","eyebrow":"What should dissent do?","prompt":"If the majority may be wrong, should a conscientious minority be silent for the sake of unity?","context":"The argument’s answer is no: dissent can expose mistakes, deepen deliberation, and sometimes justify civil disobedience.","notes":"Use the question to move from Rousseau’s closed unity to a more plural conception of democratic politics.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 14-16.\n[/Sources]"},{"type":"section","eyebrow":"IX. DEMOCRATIC DEBATE MAY BE A SIGN OF HEALTH, NOT DECAY","title":"Democratic debate may be a sign of health, not decay","notes":"Show how the argument replaces Rousseau’s suspicion of dissension with an argument for many voices and continuing disagreement.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 14-16.\n[/Sources]"},{"type":"content","title":"Dissent can improve democratic judgment","paragraphs":["Rousseau says long debates and dissensions signal the rise of particular interests and the decline of the state."],"buildGroup":"debate","notes":"The argument does not turn every disagreement into virtue. It argues that disagreement has democratic value even when the majority eventually remains in power.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 15-16.\n[/Sources]"},{"type":"content","title":"Dissent can improve democratic judgment","paragraphs":["Rousseau says long debates and dissensions signal the rise of particular interests and the decline of the state.","His critics reverse the diagnosis: when the common good is contested, hearing many voices is how a society tests its own decisions rather than assuming that one majority has final access to the truth."],"buildGroup":"debate","notes":"The argument does not turn every disagreement into virtue. It argues that disagreement has democratic value even when the majority eventually remains in power.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 15-16.\n[/Sources]"},{"type":"content","title":"Dissent can improve democratic judgment","paragraphs":["Rousseau says long debates and dissensions signal the rise of particular interests and the decline of the state.","His critics reverse the diagnosis: when the common good is contested, hearing many voices is how a society tests its own decisions rather than assuming that one majority has final access to the truth.","An outvoted minority may obey the law while continuing to speak, organize, and argue for change. Conscientious disobedience may sometimes be justified when a majority decision is seriously wrong."],"buildGroup":"debate","notes":"The argument does not turn every disagreement into virtue. It argues that disagreement has democratic value even when the majority eventually remains in power.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 15-16.\n[/Sources]"},{"type":"quote","text":"As meals to which many have contributed are better than those provided by one","cite":"Aristotle, The Politics, bks. III and IV, 1281a44-b9","notes":"The analogy supports a modest claim: many partial perspectives can combine into better judgment than one person’s view.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 15.\nPrimary work quoted in the argument: Aristotle, The Politics, bks. III and IV, 1281a44-b9, trans. Richard Robinson (1984), p. 36.\n[/Sources]"},{"type":"content","title":"The dissenting citizen has a place","paragraphs":["A citizen who loses a vote has no automatic duty to change their mind. They may continue to challenge the decision and ask the majority to reconsider."],"buildGroup":"dissent","notes":"Let the final sentence remain open to the next question: how much participation is enough, and where should it reach?\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 16.\n[/Sources]"},{"type":"content","title":"The dissenting citizen has a place","paragraphs":["A citizen who loses a vote has no automatic duty to change their mind. They may continue to challenge the decision and ask the majority to reconsider.","Treating conscientious disagreement as treason in order to preserve unity is a mistake, because preserving peace cannot require silencing the possibility that the majority is wrong."],"buildGroup":"dissent","notes":"Let the final sentence remain open to the next question: how much participation is enough, and where should it reach?\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 16.\n[/Sources]"},{"type":"question","eyebrow":"Beyond the ballot","prompt":"If decisions shape people’s lives in the workplace, family, and civil society, why should democratic control stop at legislation?","context":"This question introduces participatory and deliberative democracy: attempts to keep Rousseau’s commitment to self-rule while loosening his hostility to pluralism and dissent.","notes":"Move from criticism to repair.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 16-18.\n[/Sources]"},{"type":"section","eyebrow":"X. CAN DEMOCRACY GO ALL THE WAY DOWN?","title":"Can democracy go all the way down?","notes":"Present the four ways participatory and deliberative models extend Rousseau’s project.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 16-18.\n[/Sources]"},{"type":"content","title":"Participatory democracy expands the field of self-rule","paragraphs":["First, it makes more room for individual involvement in political discussion and gives dissenting voices a larger role in public debate."],"buildGroup":"participatory","notes":"Keep the four extensions separate; each repairs a different limitation in Rousseau’s model.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 16-18.\n[/Sources]"},{"type":"content","title":"Participatory democracy expands the field of self-rule","paragraphs":["First, it makes more room for individual involvement in political discussion and gives dissenting voices a larger role in public debate.","Second, it rethinks the boundary between the Sovereign and the executive. Citizens might help decide important particular acts, not only general laws, with communication technology widening the possibilities."],"buildGroup":"participatory","notes":"Keep the four extensions separate; each repairs a different limitation in Rousseau’s model.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 16-18.\n[/Sources]"},{"type":"content","title":"Participatory democracy expands the field of self-rule","paragraphs":["First, it makes more room for individual involvement in political discussion and gives dissenting voices a larger role in public debate.","Second, it rethinks the boundary between the Sovereign and the executive. Citizens might help decide important particular acts, not only general laws, with communication technology widening the possibilities.","Third, it broadens political communication beyond formal argument. Protests, poems, songs, slogans, and art can change political understanding even when they are not conventional proofs."],"buildGroup":"participatory","notes":"Keep the four extensions separate; each repairs a different limitation in Rousseau’s model.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 16-18.\n[/Sources]"},{"type":"content","title":"Participatory democracy expands the field of self-rule","paragraphs":["First, it makes more room for individual involvement in political discussion and gives dissenting voices a larger role in public debate.","Second, it rethinks the boundary between the Sovereign and the executive. Citizens might help decide important particular acts, not only general laws, with communication technology widening the possibilities.","Third, it broadens political communication beyond formal argument. Protests, poems, songs, slogans, and art can change political understanding even when they are not conventional proofs.","Fourth, it carries democratic principles into workplaces, families, and other institutions. Equal political rights mean little if everyday decisions remain controlled by people who are never answerable to those affected."],"buildGroup":"participatory","notes":"Keep the four extensions separate; each repairs a different limitation in Rousseau’s model.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 16-18.\n[/Sources]"},{"type":"head","title":"Participation creates new problems of its own","items":[["Implementation","Groups deliberate well, but action eventually requires administrators or individual agents."],["Scale","Larger groups can create noise and confusion, so democratic systems may still need expert deliberators."],["Agenda","Before citizens can vote on an issue, someone must decide which issues will be put to a vote."]],"notes":"These are not reasons to abandon democracy. They explain why full participation may be difficult to make coherent and effective.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 18-20.\n[/Sources]"},{"type":"content","title":"The argument ends with experiments between representation and total participation","paragraphs":["Fully participatory politics may demand more time than people can give without sacrificing work, relationships, culture, and other life plans."],"buildGroup":"modest-reforms","notes":"Keep the conclusion measured. These proposals move toward greater involvement, but they do not recreate Rousseau’s direct democracy.\n\nPause before revealing the next step.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 20-21.\n[/Sources]"},{"type":"content","title":"The argument ends with experiments between representation and total participation","paragraphs":["Fully participatory politics may demand more time than people can give without sacrificing work, relationships, culture, and other life plans.","The argument therefore points to intermediate proposals: Deliberation Day and deliberative polling create structured opportunities for citizens to hear arguments, discuss, and reconsider without asking everyone to decide everything every day."],"buildGroup":"modest-reforms","notes":"Keep the conclusion measured. These proposals move toward greater involvement, but they do not recreate Rousseau’s direct democracy.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 20-21.\n[/Sources]"},{"type":"diagnostic","eyebrow":"The Rousseau test","prompt":"Can citizens rule themselves without first becoming the kind of people who agree about what self-rule requires?","notes":"Return to the opening promise. Rousseau makes democratic legitimacy depend on a shared general will; his critics ask whether freedom is safer when disagreement remains visible and politically legitimate.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 1-21.\n[/Sources]"},{"type":"refs","title":"References","items":[["Source material","“Rousseau and the general will,” source PDF, pp. 1-21."],["Primary works quoted and discussed","Jean-Jacques Rousseau, The Social Contract (1762); Rousseau, Discourse on Political Economy (1755); W. E. B. Du Bois, “Of the Ruling of Men” (1920); Aristotle, The Politics, bks. III and IV."]],"notes":"These are the only works used to reconstruct the visible argument.\n\n[Sources]\nSource material, “Rousseau and the general will,” source PDF, pp. 1-21.\n[/Sources]"}].filter(slide => slide.type !== "quote" && slide.type !== "question");

const deck=document.getElementById('deck');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function renderSlide(s,i){
  const article=document.createElement('article');
  article.className=`slide ${s.type}${s.type==='content'||s.type==='head'?' top':''}`;
  article.dataset.index=i;
  if(s.buildGroup) article.dataset.buildGroup=s.buildGroup;
  let html='<div class="slide-inner">';
  if(s.type==='cover') html+=`<h1 class="title">${esc(s.title)}</h1><p class="work">${esc(s.work)}</p><div class="course">${esc(s.course)}</div>`;
  if(s.type==='section') html+=`<div class="eyebrow">${esc(s.eyebrow)}</div><h2 class="title">${esc(s.title)}</h2><div class="rule"></div>`;
  if(s.type==='content') html+=`<h2 class="title">${esc(s.title)}</h2><div class="body">${s.paragraphs.map((p,j)=>`<p class="${j===s.paragraphs.length-1?'fresh':''}">${esc(p)}</p>`).join('')}</div>`;
  if(s.type==='question'||s.type==='diagnostic') html+=`<div class="eyebrow">${esc(s.eyebrow)}</div><p class="prompt">${esc(s.prompt)}</p>${s.context?`<p class="context">${esc(s.context)}</p>`:''}`;
  if(s.type==='quote') html+=`<blockquote>${esc(s.text)}</blockquote><cite>${esc(s.cite)}</cite>`;
  if(s.type==='duo') html+=`<h2 class="title">${esc(s.title)}</h2><div class="duo-grid">${[s.left,s.right].map(x=>`<div class="duo-col"><h3>${esc(x.label)}</h3><p>${esc(x.text)}</p></div>`).join('')}</div>`;
  if(s.type==='head') html+=`<h2 class="title">${esc(s.title)}</h2><div class="head-list">${s.items.map(x=>`<div class="head-item"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div>`;
  if(s.type==='refs') html+=`<h2 class="title">${esc(s.title)}</h2><div class="refs-list">${s.items.map(x=>`<div class="ref"><strong>${esc(x[0])}.</strong> ${esc(x[1])}</div>`).join('')}</div>`;
  article.innerHTML=html+'</div>';
  deck.appendChild(article);
  return article;
}
const nodes=slides.map(renderSlide);
let current=0;
const counter=document.getElementById('counter');
const progress=document.getElementById('progress');
const notes=document.getElementById('notes');
const notesBody=document.getElementById('notes-body');
const overview=document.getElementById('overview');
const overviewGrid=document.getElementById('overview-grid');
function labelFor(s){return s.title||s.prompt||s.text||'Slide';}
slides.forEach((s,i)=>{const b=document.createElement('button');b.className='overview-card';b.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')} / ${slides.length}</span><span class="label">${esc(labelFor(s))}</span>`;b.addEventListener('click',()=>{closePanels();show(i)});overviewGrid.appendChild(b)});
const cards=[...overviewGrid.children];
function show(i){
  current=Math.max(0,Math.min(slides.length-1,i));
  nodes.forEach((n,j)=>n.classList.toggle('active',j===current));
  cards.forEach((n,j)=>n.classList.toggle('current',j===current));
  counter.textContent=`${current+1} / ${slides.length}`;
  progress.style.width=`${((current+1)/slides.length)*100}%`;
  notesBody.textContent=slides[current].notes||'No notes for this slide.';
  document.title=`${current+1}/${slides.length} · Rousseau - The General Will`;
}
function openPanel(panel){closePanels();panel.classList.add('open')}
function closePanels(){overview.classList.remove('open');notes.classList.remove('open')}
function togglePanel(panel){panel.classList.contains('open')?closePanels():openPanel(panel)}
function toggleFullscreen(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
document.getElementById('fullscreen').addEventListener('click',toggleFullscreen);
document.querySelectorAll('.close').forEach(b=>b.addEventListener('click',closePanels));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closePanels();return}
  if(overview.classList.contains('open')||notes.classList.contains('open')) return;
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();show(current+1)}
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}
  else if(e.key.toLowerCase()==='o') togglePanel(overview);
  else if(e.key.toLowerCase()==='n') togglePanel(notes);
  else if(e.key.toLowerCase()==='f') toggleFullscreen();
});
let touchX=0,touchY=0;
document.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))show(current+(dx<0?1:-1))},{passive:true});
function fits(node){const inner=node.querySelector('.slide-inner');return inner.scrollHeight<=node.clientHeight*.82&&inner.scrollWidth<=node.clientWidth*.92}
function fitNode(node,start=1){let f=start;node.classList.add('measuring');node.style.setProperty('--fit',f);while(f>.72&&!fits(node)){f-=.02;node.style.setProperty('--fit',f)}node.classList.remove('measuring');return f}
function fitAll(){
  nodes.forEach(n=>n.style.setProperty('--fit',1));
  const groups={};nodes.forEach(n=>{if(n.dataset.buildGroup)(groups[n.dataset.buildGroup]??=[]).push(n)});
  const grouped=new Set(Object.values(groups).flat());
  Object.values(groups).forEach(group=>{const final=group[group.length-1];const f=fitNode(final);group.forEach(n=>n.style.setProperty('--fit',f))});
  nodes.filter(n=>!grouped.has(n)).forEach(n=>fitNode(n));
  show(current);
}
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fitAll,120)});
if(document.fonts?.ready)document.fonts.ready.then(fitAll);else fitAll();
show(0);
</script>
