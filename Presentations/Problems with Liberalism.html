  <style>

  --muted:#b9b4bc;

}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink)}
body{font-family:Inter,system-ui,sans-serif}
button{font:inherit}
#deck{position:relative;width:100vw;height:100vh;overflow:hidden;background:
  radial-gradient(ellipse 54% 58% at 102% -8%,rgba(222,129,111,.16),transparent 68%),

  linear-gradient(138deg,#17191f 0%,var(--paper) 49%,#21232d 100%)}

  linear-gradient(118deg,transparent 0 26.4%,rgba(222,129,111,.14) 26.42% 26.49%,transparent 26.52% 100%),
  linear-gradient(63deg,transparent 0 72.1%,rgba(157,148,188,.17) 72.13% 72.2%,transparent 72.23% 100%),
  linear-gradient(90deg,transparent 0 7.3vw,rgba(244,239,232,.06) 7.3vw calc(7.3vw + 1px),transparent calc(7.3vw + 1px)),
  repeating-linear-gradient(0deg,transparent 0 7.4vh,rgba(244,239,232,.028) 7.4vh calc(7.4vh + 1px))}
#deck::after{content:"";position:absolute;right:7vw;top:8vh;width:18vw;height:10vh;border-top:1px solid rgba(222,129,111,.38);border-right:1px solid rgba(222,129,111,.18);transform:skewY(-8deg);pointer-events:none}
.slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:7.5vh 8vw 9vh;text-align:center;overflow:hidden}
.slide.active,.slide.measuring{display:flex}
.slide.measuring{visibility:hidden;pointer-events:none}
.slide.top{align-items:flex-start;padding-top:8vh}

.eyebrow{margin:0 0 1.1rem;color:var(--accent);font:600 clamp(11px,1.08vw,16px)/1.3 "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase}

.section .slide-inner{width:min(900px,86vw);padding:2.25rem 2.75rem 2.35rem;text-align:left;border-left:4px solid var(--accent);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:linear-gradient(90deg,rgba(222,129,111,.12),rgba(36,39,49,.18) 76%,transparent)}

.question .slide-inner,.diagnostic .slide-inner{width:min(900px,86vw);padding:2.6rem 3.35rem;border:1px solid rgba(222,129,111,.46);box-shadow:inset 0 0 0 9px rgba(222,129,111,.025),10px 11px 0 rgba(157,148,188,.06);background:rgba(32,34,43,.74)}
.question .prompt,.diagnostic .prompt{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:calc(clamp(42px,5.15vw,71px)*var(--fit));line-height:1.08;font-weight:600;letter-spacing:-.015em}
.question .prompt::after,.diagnostic .prompt::after{content:"";display:block;width:7.2rem;height:2px;background:linear-gradient(90deg,var(--accent),var(--alert));margin:1.7rem auto 0}
.question .context{max-width:48ch;margin:1.35rem auto 0;color:var(--muted);font:500 calc(clamp(18px,1.68vw,25px)*var(--fit))/1.4 "Cormorant Garamond",Georgia,serif}
.quote .slide-inner{max-width:min(900px,84vw);padding:2.4rem 3.2rem;border-left:4px solid var(--alert);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:linear-gradient(90deg,rgba(217,180,93,.09),rgba(36,39,49,.18) 62%,transparent)}
.quote blockquote{margin:0 auto;max-width:29ch;font-family:"Cormorant Garamond",Georgia,serif;font-size:calc(clamp(35px,3.7vw,54px)*var(--fit));line-height:1.12;font-weight:500;font-style:italic}
.quote blockquote::before{content:"“";color:var(--alert);margin-right:.08em}.quote blockquote::after{content:"”";color:var(--alert);margin-left:.08em}
.quote cite{display:block;margin-top:1.55rem;color:var(--muted);font:500 calc(clamp(12px,1.13vw,17px)*var(--fit))/1.45 "IBM Plex Mono",monospace;font-style:normal}
.duo-grid{display:grid;grid-template-columns:1fr 1fr;gap:2.4rem;text-align:left;margin-top:1.45rem}

.duo-col:last-child{border-top-color:var(--alert)}

.head-item:nth-child(even){border-left-color:rgba(157,148,188,.7);background:linear-gradient(90deg,rgba(157,148,188,.05),transparent 54%)}
.head-item b{color:var(--accent);font:600 calc(clamp(12px,1.08vw,16px)*var(--fit))/1.3 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
.head-item:nth-child(even) b{color:var(--accent-quiet)}
.head-item span{font:500 calc(clamp(23px,2.03vw,31px)*var(--fit))/1.3 "Cormorant Garamond",Georgia,serif}
.diagnostic .eyebrow{color:var(--alert)}.diagnostic .prompt{font-size:calc(clamp(51px,6.5vw,88px)*var(--fit))}
.refs .slide-inner{width:min(980px,86vw);text-align:left}.refs .title{font-size:calc(clamp(40px,4.5vw,63px)*var(--fit));margin-bottom:1.6rem}
.refs-list{display:grid;gap:1rem}.ref{padding-top:.95rem;border-top:1px solid var(--rule);font:500 calc(clamp(18px,1.62vw,24px)*var(--fit))/1.38 "Cormorant Garamond",Georgia,serif;color:var(--muted)}.ref strong{color:var(--ink);font-weight:600}
#progress{position:fixed;z-index:20;left:0;top:0;width:0;height:4px;background:linear-gradient(90deg,var(--accent-quiet),var(--accent),var(--alert));transition:width .22s ease}
#nav-hint,#counter{position:fixed;bottom:18px;z-index:20;color:var(--muted);font:500 12px/1.3 "IBM Plex Mono",monospace;letter-spacing:.08em}#nav-hint{left:24px}#counter{right:24px}
#fullscreen{position:fixed;z-index:20;right:3vw;top:2.35vh;color:var(--ink);background:rgba(25,27,34,.66);border:1px solid rgba(222,129,111,.5);padding:.55rem .75rem;cursor:pointer;font:500 clamp(10px,.86vw,13px)/1.2 "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase}
#fullscreen:hover{border-color:var(--alert);color:var(--alert)}
.panel{position:fixed;z-index:40;inset:0;display:none;overflow:auto;padding:5vh 7vw 8vh;background:rgba(25,27,34,.985)}.panel.open{display:block}
.panel-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:0 0 1.3rem;background:var(--paper);border-bottom:1px solid var(--rule);z-index:2}.panel-head h2{margin:0;font:600 clamp(28px,3vw,46px)/1 "Cormorant Garamond",Georgia,serif}.close{border:1px solid var(--rule);background:transparent;color:var(--ink);padding:.55rem .8rem;cursor:pointer;font:500 12px/1 "IBM Plex Mono",monospace}
#overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;padding-top:1.35rem}.overview-card{min-height:100px;text-align:left;padding:1rem;background:linear-gradient(145deg,#2b2d38,#1d1f27);border:1px solid var(--rule);border-left:3px solid transparent;color:var(--ink);cursor:pointer}.overview-card:hover,.overview-card.current{border-left-color:var(--accent);border-color:rgba(222,129,111,.55)}.overview-card .num{display:block;color:var(--accent);font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.1em}.overview-card .label{display:block;margin-top:.7rem;font:600 21px/1.12 "Cormorant Garamond",Georgia,serif}
#notes-body{max-width:900px;padding:2.4rem 0;white-space:pre-wrap;color:var(--ink);font:400 18px/1.62 Inter,sans-serif}
@media (max-width:760px){.slide{padding:9vh 8vw 10vh}.slide.top{padding-top:9.5vh}.slide-inner,.slide.duo .slide-inner{width:84vw}.cover .slide-inner,.section .slide-inner,.question .slide-inner,.diagnostic .slide-inner,.quote .slide-inner{padding:1.7rem 1.5rem}.duo-grid{grid-template-columns:1fr;gap:1.35rem}.head-item{grid-template-columns:1fr;gap:.45rem}.content .body{font-size:calc(clamp(22px,5.5vw,30px)*var(--fit))}.duo-col p{font-size:calc(clamp(22px,5.25vw,29px)*var(--fit))}#nav-hint{display:none}#fullscreen{top:12px;right:12px}}
</style>

<body>
  <main id="deck" aria-live="polite"></main>
  <div id="progress"></div>
  <div id="nav-hint">ARROWS / SPACE · O OVERVIEW · N NOTES · F FULLSCREEN</div>
  <div id="counter">1 / 1</div>
  <button id="fullscreen" aria-label="Toggle fullscreen">Fullscreen</button>
  <section id="overview" class="panel" aria-label="Slide overview"><div class="panel-head"><h2>Overview</h2><button class="close" data-close="overview">Close</button></div><div id="overview-grid"></div></section>
  <aside id="notes" class="panel" aria-label="Speaker notes"><div class="panel-head"><h2>Speaker notes</h2><button class="close" data-close="notes">Close</button></div><div id="notes-body"></div></aside>

  <script>
const slides=[];
const add=slide=>slides.push(slide);
const source=(section,extra='')=>`[Sources]\nSource material: “The Place of Liberty - Problem with Liberalism.pdf,” ${section}.${extra?`\n${extra}`:''}\n[/Sources]`;
const note=(text,section,extra='')=>`${text}\n\n${source(section,extra)}`;
const cover=(title,work,course,notes)=>add({type:'cover',title,work,course,notes});
const section=(roman,title,notes)=>add({type:'section',eyebrow:`${roman}. ${title.toUpperCase()}`,title,notes});
const question=(eyebrow,prompt,context,notes)=>add({type:'question',eyebrow,prompt,context,notes});
const quote=(text,cite,notes)=>add({type:'quote',text,cite,notes});
const duo=(title,left,right,notes)=>add({type:'duo',title,left,right,notes});
const head=(title,items,notes)=>add({type:'head',title,items,notes});
const diagnostic=(prompt,notes)=>add({type:'diagnostic',eyebrow:'The liberty test',prompt,notes});
const refs=(items,notes)=>add({type:'refs',title:'References',items,notes});
function build(id,title,paragraphs,sectionName,notes=''){
  paragraphs.forEach((_,i)=>add({type:'content',title,paragraphs:paragraphs.slice(0,i+1),buildGroup:id,notes:note(`${notes}${i<paragraphs.length-1?'\n\nPause before revealing the next step.':''}`,sectionName)}));
}

cover('Problems with Liberalism','Mill, Marx, and the communitarian challenge','Political Philosophy',note('Open with the pressure point: a principle designed to protect liberty may leave important problems unresolved.','Opening, pp. 1-2'));

section('I','A simple principle develops difficult edges',note('The argument begins with Mill’s own qualifications to the Liberty Principle. The question is whether these are ordinary applications of the principle or signs that it needs support from somewhere else.','“Poison, drunkenness, and indecency,” pp. 1-3'));
build('poison','Preventing crime can justify a narrow intrusion',[ 
  'Mill says that the Liberty Principle has obvious limits when a restriction prevents crime. If poison were bought only to commit murder, society would be justified in banning its production and sale.',
  'But poisons also have ordinary uses. Mill therefore recommends a less sweeping rule: chemists should record each sale, including the purchaser’s name and stated purpose.',
  'That record makes a later investigation easier if someone is poisoned. Mill treats the buyer’s lost privacy as a small cost compared with the benefit of deterring or solving murder.'
],'pp. 1-2','The example is meant to show a restriction Mill considers compatible with liberty because it is directed at preventing serious harm.');
question('The preventive rule','When does a modest restriction protect liberty, and when does it become an unacceptable intrusion?','The poison case tests whether a rule can be justified by the danger it addresses without giving public authority a general license to monitor private life.',note('Keep both features in view: the rule is intrusive, but it is aimed at a specific serious crime.','pp. 1-2'));
duo('Mill’s poison policy tries to hold two values together',
  {label:'Individual privacy',text:'An innocent purchaser may reasonably object that recording their name and purpose invades a private choice.'},
  {label:'Protection from murder',text:'A register can make it easier to identify likely suspects after a poisoning and can discourage criminal use of poison.'},
  note('This is a matched comparison, not a claim that privacy always loses. Mill’s judgment turns on the gravity of the possible harm.','pp. 1-2'));
build('drunkenness','Past violence can make a future restriction seem justified',[
  'Mill also says that drunkenness is ordinarily no crime. A person does not lose liberty merely because drinking is unwise or unpopular.',
  'Yet someone who has been violent toward others while drunk may, on Mill’s view, be prohibited from drinking. The restriction responds to a risk of later harm to other people.',
  'Some liberals may think this is too restrictive, especially because the feared harm has not yet occurred again. Mill’s point is that a serious risk can outweigh a person’s ordinary liberty to drink.'
],'p. 2','The argument presents this as another exception justified by danger to others, even when that danger is not immediate.');
quote('“Done publicly, [such acts] are a violation of good manners.”','John Stuart Mill, On Liberty, p. 166.',note('The next difficulty is different. Mill’s concern now appears to be public decency rather than harm in the ordinary sense.','p. 2','Primary work quoted: John Stuart Mill, On Liberty (1859), p. 166.'));
build('public-indecency','Public indecency puts Mill’s distinction under strain',[
  'Mill seems to say that an action may be legally permitted in private but prohibited when done publicly. The argument uses sexual intimacy between married partners as an example of conduct that may be unobjectionable in private but widely unacceptable in public.',
  'The problem is that Mill insists mere offence is not harm. If public indecency is prohibited because people are offended, then his policy seems to rest on a reason the Liberty Principle rejects.',
  'The argument concludes that Mill here appears to let customary morality override the Liberty Principle without offering a serious argument that makes the exception consistent with his other views.'
],'pp. 2-3','Do not treat this as a charge that every public-decency rule is wrong. The argument’s narrower claim is that Mill has not adequately explained the rule in his own terms.');

section('II','Can criminal law enforce a shared morality?',note('Lord Devlin’s challenge makes the tension explicit: if the law cannot enforce morality, why do liberal societies retain moralized criminal laws?','“Problems with liberalism,” pp. 3-4'));
build('devlin-context','Devlin turns familiar laws into a challenge for liberalism',[
  'Lord Justice Devlin criticized the Wolfenden Report, which recommended decriminalizing consensual homosexual acts and argued that prostitution should not itself be illegal. Those recommendations appear to fit the Liberty Principle.',
  'Yet Devlin notes that many legal prohibitions are hard to defend by appeal to harm alone. The argument names duelling, incest between siblings, and euthanasia as examples.',
  'His challenge is not simply that people dislike these actions. It is that liberalism needs a principled explanation for why some apparently voluntary conduct remains the concern of criminal law.'
],'p. 3','The historical examples are used as philosophical tests. The deck does not assume that they all have the same moral or legal status.');
quote('“If prostitution is ... not the law’s business, what concern has the law with the [intermediary] or the brothel-keeper?”','Lord Devlin, “Morals and the Criminal Law,” p. 12.',note('Devlin presses an apparent inconsistency in a liberal position on sex work.','p. 3','Primary work quoted: Lord Devlin, “Morals and the Criminal Law” (1958), p. 12.'));
build('sex-work','The employment question makes the challenge concrete',[
  'A liberal might say that sex work concerns only the worker and the customer, so it is none of the law’s business. Devlin asks why that answer changes once another person employs or profits from the worker.',
  'The usual legal answer is that employment or management is exploitative. Devlin doubts that this label, by itself, explains the difference, comparing the arrangement to other commercial relationships in which someone profits from another person’s work.',
  'The pressure is conceptual: if voluntary sex work is permitted because it is private, then the liberal must explain why related commercial activity is criminal without quietly relying on moral disapproval.'
],'pp. 3-4','The argument reports Devlin’s objection. It does not settle the real-world question of exploitation.');
duo('Two ways to understand the law’s concern',
  {label:'The liberal route',text:'The law should interfere only when there is a relevant harm, coercion, or exploitation that can be independently explained.'},
  {label:'Devlin’s route',text:'The law may preserve the shared moral principles on which a society depends, even when a voluntary act does not directly harm another person.'},
  note('The contrast names two competing standards for legitimate criminal law.','pp. 3-4'));
question('The morality test','May a society punish conduct because it violates the morality that holds the society together?','This question arises because Devlin thinks legal prohibitions reveal a shared moral order, while Mill thinks popular morality is not enough to justify coercion.',note('The next build gives Devlin’s positive account before returning to the cost for Mill.','pp. 3-4'));
build('shared-morality','Devlin treats moral violation as an offence against society',[
  'Devlin’s view is that a society has shared moral principles and enforces them through criminal law. On this picture, someone who breaks those principles offends society as a whole.',
  'This makes customary morality more than a private preference. It becomes part of the social conditions that law may protect.',
  'Mill would reject the claim that law should always uphold customary morality. But Devlin’s examples show how difficult it can be to apply a strictly liberal principle to legal practices that many people take for granted.'
],'pp. 3-4','Keep the positions distinct: this is Devlin’s proposed explanation, not Mill’s.');
question('The one-principle problem','If a liberal can oppose an act for other reasons, why should customary morality ever decide the case?','The question isolates the argument’s central worry. A liberal may reach some of the same conclusions as Devlin, but needs reasons that do not treat social disapproval as enough.',note('The final build in this section returns to Mill’s advertised simplicity.','p. 4'));
build('mill-tension','Mill’s “one simple principle” may conceal a more complex outlook',[
  'The argument does not claim that a liberal could never object to euthanasia, brothel-keeping, or other practices Devlin names. A liberal might identify harms or forms of exploitation in particular cases.',
  'The harder question is what happens when a liberal judgment conflicts with customary morality. If the Liberty Principle is as strict as Mill suggests, social morality should not settle the conflict.',
  'Mill’s apparent concessions make his belief system look more complicated than “one simple principle.” The problem is not merely an awkward result but an unclear boundary between principled liberty and inherited moral regulation.'
],'p. 4','This section closes with a diagnostic, not a verdict against all liberal legal reasoning.');

section('III','Equal rights can coexist with unequal lives',note('Marx objects not chiefly that liberalism permits too much private conduct, but that its legal equality leaves deeper social domination intact.','“Marxist objections to liberalism,” pp. 4-6'));
build('marx-context','Marx begins with religious equality, then changes the question',[
  'Karl Marx’s “On the Jewish Question” responds to Bruno Bauer’s opposition to Jewish emancipation in Prussia. Bauer thought religion itself had to be abolished before people could be emancipated.',
  'Marx disagrees with Bauer’s conclusion, but argues that Bauer misses a deeper distinction. A state can remove religious barriers from its laws while people remain unfree in their everyday social lives.',
  'The distinction Marx introduces is between political emancipation and human emancipation. Liberal equal rights may achieve the first without achieving the second.'
],'pp. 4-5','The historical material sets up Marx’s conceptual distinction. It is not included as a biography lesson.');
build('two-emancipations','Political emancipation changes the law, not necessarily life',[
  'Political emancipation means equal rights in the state. In a religious context, it means laws with no religious privileges or barriers.',
  'Marx treated the United States as an example close to political emancipation because many state laws did not distinguish people by religion. The argument notes that this picture was seriously incomplete: the United States was still a slave society and women lacked equal voting rights.',
  'Even where law is religion-blind, individuals may remain prejudiced. Discrimination can survive in employment, education, and other parts of civil society.'
],'p. 5','The argument itself corrects Marx’s historical example. The conceptual point is that equal law does not automatically transform social relations.');
duo('Marx’s two kinds of emancipation',
  {label:'Political emancipation',text:'The state removes formal legal barriers and treats people as equal citizens, regardless of their religion.'},
  {label:'Human emancipation',text:'People are free in the ordinary social and economic world as well, not merely equal in a legal status the state declares.'},
  note('The state/civil-society distinction gives Marx’s critique its structure.','pp. 5-6'));
quote('“A state can liberate itself from a limitation without man himself being truly free of it.”','Karl Marx, On the Jewish Question, p. 51.',note('The quotation condenses Marx’s challenge: reforming the state may not reform the conditions under which people live.','p. 5','Primary work quoted: Karl Marx, On the Jewish Question (1844), p. 51.'));
build('formal-equality','A legal right does not erase daily discrimination',[
  'Suppose a state gives every religion equal standing before the law. That is a real advance over a state that officially privileges one faith.',
  'But people can still be denied opportunities, treated with hatred, or excluded from ordinary social and economic life. The rights of the citizen can coexist with inequality in civil society.',
  'Marx’s main lesson is therefore not that legal equality is worthless. It is that formally granting equal rights is not the same thing as treating people as equals in day-to-day life.'
],'pp. 5-6','The argument explicitly calls political emancipation a great advance even while Marx says it falls short of full emancipation.');
head('Marx sees a rights regime that protects separate individuals',[
  {label:'Equality',text:'Equal legal standing in the political order.'},
  {label:'Liberty',text:'A protected sphere in which each person pursues their own life.'},
  {label:'Security',text:'Protection of the individual’s person and possessions.'},
  {label:'Property',text:'A right that helps organize economic life in civil society.'}
],note('These are the liberal rights named in the argument. The next build gives Marx’s critical interpretation of them.','pp. 5-6'));
build('egoistic-rights','Marx thinks liberal rights reinforce separation',[
  'Marx calls liberal rights egoistic rights of separation. In his interpretation, they encourage each person to see others as limits on their own freedom rather than as fellow members of a cooperative community.',
  'The state then looks like a community of equal citizens, while everyday civil society remains a competition among people who are not actually equal in power or resources.',
  'Marx says this legal community can become a sham: a formal equality that cloaks an antagonistic social world in which people treat one another, and themselves, as means.'
],'p. 6','This is Marx’s interpretation of liberal rights. The argument reports it without treating it as a settled conclusion.');
question('The equality screen','Does declaring equal rights solve inequality, or can it become a cheap answer to complaints about unequal life?','The question follows from Marx’s worry that legal equality may conceal, rather than remedy, discrimination and social power.',note('The next build states Marx’s final judgment and preserves the advance/failure distinction.','p. 6'));
build('shallow-liberalism','For Marx, liberalism is an advance that stops too early',[
  'Marx thinks political emancipation is better than a hierarchical and discriminatory state. Liberal rights matter because they remove formal political inequalities.',
  'But he thinks liberalism stops at the surface. His ideal is a communist society in which emancipation reaches civil society itself, not only the state.',
  'That transformation, Marx believes, requires revolutionary action. Liberalism therefore appears to him as a shallow doctrine: one that announces equality while leaving the social relations of inequality in place.'
],'p. 6','The slide distinguishes Marx’s acknowledgment of liberal progress from his radical criticism of its limits.');

section('IV','The self may be more social than liberalism allows',note('Communitarians share Marx’s concern with individualism but seek a remedy in the culture and traditions of existing communities, not in a future communist society.','“Communitarianism and liberalism,” pp. 6-9'));
build('communitarian-start','Communitarians challenge the picture of the isolated chooser',[
  'Communitarians criticize what they call the atomism or individualism of liberalism. They think liberalism pictures people as isolated individuals pursuing a private good inside a protected sphere.',
  'On that picture, attachments to local customs, culture, traditions, and conventions matter only when an individual chooses them. The individual is imagined as standing apart from social bonds.',
  'Communitarians answer that people are thoroughly social beings. Identity and self-understanding are shaped by the communities in which people already find themselves, not simply selected by free choice.'
],'pp. 6-7','The contrast concerns a picture of human identity, not merely a preference for more or less government.');
quote('“The social state is at once so natural, so necessary, and so habitual to man ...”','John Stuart Mill, Utilitarianism, p. 207.',note('The argument notes that Mill himself acknowledges humans as members of a social body, but communitarians think he does not draw the full implication.','p. 7','Primary work quoted: John Stuart Mill, Utilitarianism, p. 207.'));
build('identity','Community is not just an accessory to a finished individual',[
  'Communitarians argue that a person’s commitments and allegiances are not optional decorations added to an already complete self. Without their particular social setting, people would literally be different people.',
  'Mill values liberty because it allows people to resist the crushing force of custom and conformity. The communitarian replies that this assumes people can throw off their social bonds in a way that misunderstands human nature.',
  'On this view, denying the importance of community puts people on a path toward individual alienation and the eventual dislocation of society.'
],'pp. 7-8','This is the communitarian diagnosis. It does not say that every inherited custom deserves obedience.');
duo('Two diagnoses of the pressure of custom',
  {label:'Mill’s fear',text:'Custom and conformity can crush individuality. Liberty makes room for experiments in living and moral reform.'},
  {label:'The communitarian fear',text:'Treating people as independent choosers can detach them from the traditions and relationships that make a shared social life possible.'},
  note('The positions are matched because both care about how people live together, but they locate the main danger in different places.','pp. 7-8'));
build('customary-morality','The communitarian gives customary morality political weight',[
  'For the communitarian, customary morality is not merely an obstacle to freedom. It is a bond that holds society together and helps shape the identities of its members.',
  'Customary morality need not be static. People can dispute what their traditions mean and what they should become. But the room for reform is constrained by the customs and traditions they already have.',
  'This leads to a demanding conclusion: no one should expect a right to do whatever would seriously undermine social morality. The liberal demand for a protected private sphere is therefore limited by communal preservation.'
],'p. 8','The last sentence gives the communitarian implication. The next question asks what conception of liberty could support it.');
question('Freedom from or freedom to?','Does leaving people alone make them free, or must freedom involve becoming able to choose well?','This question appears because communitarians reject a merely negative definition of liberty and offer a different account of what it means to be free.',note('The following builds clarify negative and positive liberty without reducing the contrast to a slogan.','pp. 8-9'));
build('negative-liberty','Negative liberty focuses on acting without constraint',[
  'Many liberals use what Isaiah Berlin called a negative definition of liberty: a person is free to the extent that they can make their own choices about how to live.',
  'The familiar contrast between “freedom from” and “freedom to” is not enough by itself. Every freedom claim has three elements: a person, a constraint, and an action or goal.',
  'To say that someone is free to go out this evening is to say that they are free from constraints, such as a curfew or conflicting commitment, to perform that action. A promise to stay in can itself become a constraint.'
],'pp. 8-9','This matters because the argument says the usual slogan does not yet reveal the deepest disagreement about freedom.');
build('positive-liberty','Positive liberty focuses on self-mastery, not mere permission',[
  'The alternative account goes back to Rousseau. On this view, following a desire does not always make someone free; a person can be a slave to a desire.',
  'The argument uses a drug addict or someone obsessively attached to a film star as illustrations. Freedom requires the capacity to form and act from more reasonable desires, which is a kind of self-control or self-mastery.',
  'A communitarian can then say that thorough socialization helps people recognize their real interests and become capable of positive freedom. If an action undermines the society that forms those interests, prohibiting it may be described as no loss of freedom at all.'
],'pp. 9-10','The final claim shows why Mill fears repression: an authority that claims to know real interests may treat coercion as liberation.');

section('V','Which danger should a free society fear most?',note('The argument closes without simply choosing Mill or the communitarian. It shows that the disagreement turns on competing predictions about human improvement and social life.','Conclusion, p. 10'));
build('middle','Mill and the communitarian suspect opposite forms of failure',[
  'Mill fears that customary morality will repress individuality and block experiments in living. The communitarian fears that Mill’s negative liberty will produce isolation, alienation, and social dislocation.',
  'Each side therefore thinks the other has mistaken the nature of freedom. For Mill, community can become a tyrannical force. For the communitarian, individual choice can be empty or destructive without the right social formation.',
  'The argument leaves open the possibility of a compromise: perhaps the happiest society would combine a modified Liberty Principle with a modified respect for customs and traditions.'
],'p. 9','Treat the compromise as a possibility raised by the argument, not as a final formula that settles the disagreement.');
question('The final comparison','Which risk is worse: repression in the name of community, or alienation in the name of liberty?','This is the practical and philosophical choice the preceding sections have prepared. A judgment depends on what people are capable of becoming under freer or more communal institutions.',note('The next build identifies the empirical and moral premise that Mill’s defense needs.','p. 10'));
build('moral-progress','Mill’s defense ultimately depends on moral progress',[
  'The argument judges that Mill was right to value negative liberty and to think a liberal society is likely to be happier than many illiberal societies.',
  'But Mill’s defense rests heavily on faith that human beings can make moral progress. Experiments in living help only if people are capable of learning from them and improving.',
  'If that faith were mistaken, a communitarian society might be preferable even on utilitarian grounds. Defenders of liberty must therefore show that people can make moral progress or provide a different foundation for their view.'
],'p. 10','This is the argument’s conditional conclusion: liberty needs a defense that can answer the question of human progress.');
quote('“It was Mill, not Marx, that Franco’s regime chose to censor.”','Source material, p. 10.',note('The final anecdote gives the abstract argument a political edge. Mill’s account of free speech and liberty could be more threatening to an autocratic regime than Marx’s doctrines in that setting.','p. 10'));
diagnostic('Can a society protect the social conditions people need without letting “community,” “freedom,” or “equality” become a name for domination?',note('Leave the question unresolved. It gathers the argument’s three critiques: moral regulation, formal equality, and social identity.','Whole argument'));

    const deck=document.getElementById('deck');
    const escapeHTML=value=>String(value).replace(/[&<>"']/g,char=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[char]));
    function renderSlide(slide,index){
      const node=document.createElement('article');
      node.className=`slide ${slide.type}${slide.type==='content'?' top':''}`;
      node.dataset.index=index;
      node.dataset.group=slide.buildGroup||'';
      let content='';
      if(slide.type==='cover') content=`<div class="slide-inner"><p class="eyebrow">Liberalism</p><h1 class="title">${escapeHTML(slide.title)}</h1><p class="work">${escapeHTML(slide.work)}</p><p class="course">${escapeHTML(slide.course)}</p></div>`;
      if(slide.type==='section') content=`<div class="slide-inner"><p class="eyebrow">${escapeHTML(slide.eyebrow)}</p><h2 class="title">${escapeHTML(slide.title)}</h2><div class="rule"></div></div>`;
      if(slide.type==='content') content=`<div class="slide-inner"><h2 class="title">${escapeHTML(slide.title)}</h2><div class="body">${slide.paragraphs.map((p,i)=>`<p class="${i===slide.paragraphs.length-1?'fresh':''}">${escapeHTML(p)}</p>`).join('')}</div></div>`;
      if(slide.type==='question'||slide.type==='diagnostic') content=`<div class="slide-inner"><p class="eyebrow">${escapeHTML(slide.eyebrow)}</p><h2 class="prompt">${escapeHTML(slide.prompt)}</h2>${slide.context?`<p class="context">${escapeHTML(slide.context)}</p>`:''}</div>`;
      if(slide.type==='quote') content=`<div class="slide-inner"><blockquote>${escapeHTML(slide.text)}</blockquote><cite>${escapeHTML(slide.cite)}</cite></div>`;
      if(slide.type==='duo') content=`<div class="slide-inner"><h2 class="title">${escapeHTML(slide.title)}</h2><div class="duo-grid"><section class="duo-col"><h3>${escapeHTML(slide.left.label)}</h3><p>${escapeHTML(slide.left.text)}</p></section><section class="duo-col"><h3>${escapeHTML(slide.right.label)}</h3><p>${escapeHTML(slide.right.text)}</p></section></div></div>`;
      if(slide.type==='head') content=`<div class="slide-inner"><h2 class="title">${escapeHTML(slide.title)}</h2><div class="head-list">${slide.items.map(item=>`<div class="head-item"><b>${escapeHTML(item.label)}</b><span>${escapeHTML(item.text)}</span></div>`).join('')}</div></div>`;
      if(slide.type==='refs') content=`<div class="slide-inner"><p class="eyebrow">Sources</p><h2 class="title">${escapeHTML(slide.title)}</h2><div class="refs-list">${slide.items.map(item=>`<div class="ref">${item}</div>`).join('')}</div></div>`;
      node.innerHTML=content;
      return node;
    }
    slides.forEach((slide,index)=>deck.appendChild(renderSlide(slide,index)));
    const rendered=[...document.querySelectorAll('.slide')];
    const progress=document.getElementById('progress');
    const counter=document.getElementById('counter');
    const notesBody=document.getElementById('notes-body');
    const overview=document.getElementById('overview');
    const notesPanel=document.getElementById('notes');
    let current=0;
    function fitBuildGroups(){
      const groups=new Map();
      rendered.forEach(slide=>{const key=slide.dataset.group;if(key) groups.set(key,slide);});
      rendered.forEach(slide=>slide.style.setProperty('--fit','1'));
      groups.forEach(last=>{
        last.classList.add('measuring');
        const inner=last.querySelector('.slide-inner');
        const natural=inner.scrollHeight;
        const available=window.innerHeight*.765;
        const fit=Math.min(1,Math.max(.72,available/natural));
        rendered.filter(slide=>slide.dataset.group===last.dataset.group).forEach(slide=>slide.style.setProperty('--fit',fit.toFixed(3)));
        last.classList.remove('measuring');
      });
    }
    function updateOverview(){
      document.querySelectorAll('.overview-card').forEach(card=>card.classList.toggle('current',Number(card.dataset.target)===current));
    }
    function show(index){
      current=Math.max(0,Math.min(slides.length-1,index));
      rendered.forEach((slide,i)=>slide.classList.toggle('active',i===current));
      progress.style.width=`${((current+1)/slides.length)*100}%`;
      counter.textContent=`${current+1} / ${slides.length}`;
      notesBody.textContent=slides[current].notes||'No speaker notes for this slide.';
      updateOverview();
    }
    function togglePanel(panel){const willOpen=!panel.classList.contains('open');document.querySelectorAll('.panel').forEach(item=>item.classList.remove('open'));if(willOpen)panel.classList.add('open')}
    slides.forEach((slide,index)=>{
      const card=document.createElement('button');card.className='overview-card';card.dataset.target=index;card.innerHTML=`<span class="num">${String(index+1).padStart(2,'0')}</span><span class="label">${escapeHTML(slide.title||slide.prompt||slide.eyebrow||'Untitled slide')}</span>`;card.addEventListener('click',()=>{overview.classList.remove('open');show(index)});document.getElementById('overview-grid').appendChild(card);
    });
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'){document.querySelectorAll('.panel').forEach(panel=>panel.classList.remove('open'));return}
      if(event.key==='o'||event.key==='O'){togglePanel(overview);return}
      if(event.key==='n'||event.key==='N'){togglePanel(notesPanel);return}
      if(event.key==='f'||event.key==='F'){toggleFullscreen();return}
      if(['ArrowRight','ArrowDown','PageDown',' '].includes(event.key)){event.preventDefault();show(current+1)}
      if(['ArrowLeft','ArrowUp','PageUp'].includes(event.key)){event.preventDefault();show(current-1)}
    });
    document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>document.getElementById(button.dataset.close).classList.remove('open')));
    function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
    document.getElementById('fullscreen').addEventListener('click',toggleFullscreen);
    let touchStart=null;deck.addEventListener('touchstart',event=>{touchStart=event.changedTouches[0].clientX},{passive:true});deck.addEventListener('touchend',event=>{if(touchStart===null)return;const dx=event.changedTouches[0].clientX-touchStart;if(Math.abs(dx)>55)show(current+(dx<0?1:-1));touchStart=null},{passive:true});
    window.addEventListener('resize',()=>{fitBuildGroups();show(current)});
    fitBuildGroups();show(0);
  </script>
</body>
</html>
