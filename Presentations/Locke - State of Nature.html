<body>
<div id="deck" aria-live="polite"></div>
<div id="progress"></div>
<div id="nav-hint">ARROWS / SPACE · O OVERVIEW · N NOTES · F FULLSCREEN</div>
<div id="counter">1 / 1</div>
<button id="fullscreen" aria-label="Toggle fullscreen">Fullscreen</button>

<section id="overview" class="panel" aria-label="Slide overview">
  <div class="panel-head"><h2>Overview</h2><button class="close" data-close="overview">Close</button></div>
  <div id="overview-grid"></div>
</section>
<aside id="notes" class="panel" aria-label="Speaker notes">
  <div class="panel-head"><h2>Speaker notes</h2><button class="close" data-close="notes">Close</button></div>
  <div id="notes-body"></div>
</aside>

<script>
const slides=[];
const src=(pages,extra='')=>`[Sources]\nSource material, “Locke,” source PDF, pp. ${pages}.${extra?`\n${extra}`:''}\n[/Sources]`;
const add=s=>{if(s.type==="quote"||s.type==="question")return;slides.push(s);};
const cover=(title,work,course,notes)=>add({type:'cover',title,work,course,notes});
const section=(roman,title,notes)=>add({type:'section',eyebrow:`${roman}. ${title.toUpperCase()}`,title,notes});
const question=(eyebrow,prompt,context,notes)=>add({type:'question',eyebrow,prompt,context,notes});
const quote=(text,cite,notes)=>add({type:'quote',text,cite,notes});
const duo=(title,left,right,notes)=>add({type:'duo',title,left,right,notes});
const head=(title,items,notes)=>add({type:'head',title,items,notes});
const diagnostic=(prompt,notes)=>add({type:'diagnostic',eyebrow:'The Locke test',prompt,notes});
const refs=(items,notes)=>add({type:'refs',title:'References',items,notes});
function build(id,title,paragraphs,notes,pages){
  paragraphs.forEach((_,i)=>add({type:'content',title,paragraphs:paragraphs.slice(0,i+1),buildGroup:id,notes:`${notes}${i<paragraphs.length-1?'\n\nPause before revealing the next step.':''}\n\n${src(pages)}`}));
}

cover('The State of Nature','John Locke and the problem of judging without a judge','Political Philosophy',`Begin with the puzzle: a world without government can be peaceful, yet still become intolerable.\n\n${src('1-8')}`);

section('I','Can freedom survive without a ruler?',`Introduce Locke's state of nature as a moral order without political authority.\n\n${src('1-2')}`);
build('three-starts','Locke begins with three claims',[
  'The state of nature is a condition without a shared political authority: no common lawmaker, public judge, or established enforcement power.',
  'It is a state of perfect freedom, because each person directs their own actions rather than living under another person\'s political command.',
  'It is also a state of equality, because no person has a natural right to rule or subordinate anyone else.',
  'Yet freedom and equality are governed by the Law of Nature, a moral rule that applies before any government makes positive law.'
],'Treat the three claims as one structure: freedom, equality, and a prior moral law.','1-2');
question('The central puzzle','If no one naturally rules, what keeps equal and independent people from falling into Hobbesian war?','Locke must explain both why moral limits exist before government and how those limits can have practical force.',`This question identifies the two burdens of Locke's argument: moral authority and enforcement.\n\n${src('1-3')}`);

section('II','Equality removes every natural throne',`Contrast Locke's moral equality with Hobbes's equality of vulnerability and with Filmer's natural hierarchy.\n\n${src('1-2')}`);
build('moral-equality','Equality is a claim about rights',[
  'Hobbes treats people as roughly equal in physical and mental power because even the weakest can threaten the strongest.',
  'Locke uses equality differently. He means that nobody is born with a superior moral title to command another person.',
  'This directly challenges Robert Filmer\'s claim that rulers inherit a God-given authority that began with Adam.'
],'Keep factual similarity and moral status distinct: Locke is asking who has a right to rule.','1-2');
build('law-content','The Law of Nature protects every person',[
  'Locke thinks reason can discover a Law of Nature that applies to everyone before civil law exists.',
  'Its basic demand is that no one ought to harm another person in life, health, liberty, or possessions.',
  'Locke\'s theological reason is that every person belongs to God. Because people are God\'s property, one equal person cannot treat another as disposable property.',
  'The larger principle is preservation: each person must preserve themselves and, when self-preservation is not threatened, preserve the rest of humanity as much as possible.'
],'Define the rule, then show how the theological premise is supposed to support it.','2');
quote('The state of Nature has a Law of Nature to govern it, which obliges every one.','John Locke, Second Treatise, section 6, pp. 270-271',`The quotation makes the key limit on natural freedom explicit: moral obligation exists before civil law.\n\n${src('3','John Locke, Second Treatise, s. 6, pp. 270-271, as quoted in the source material.')}`);
question('Why morality is not enough','A rule can tell people what they ought to do, but what makes anyone follow it when disobedience is profitable?','Locke cannot defeat Hobbes merely by declaring violence wrong. He must show that the moral law can influence conduct without a state.',`The next section clarifies the kind of freedom this law permits before confronting enforcement.\n\n${src('2-4')}`);

section('III','Liberty is not permission to do anything',`Explain Locke's distinction between liberty and licence before the argument turns to punishment.\n\n${src('3')}`);
build('liberty-not-licence','Natural liberty has moral boundaries',[
  'Perfect freedom does not mean an unlimited permission to do whatever seems useful.',
  'Locke distinguishes liberty from licence. Liberty is the freedom to choose among actions that the Law of Nature permits.',
  'Because harming another person violates the prior moral law, a prohibition on theft or attack does not count as a loss of rightful liberty.'
],'Stress that Locke builds moral limits into the meaning of freedom itself.','3');
duo('The same word hides two different theories',
  {label:'Hobbesian liberty',text:'Natural liberty can permit whatever a person judges necessary for survival, including force against an innocent person.'},
  {label:'Lockean liberty',text:'Natural liberty permits only what the Law of Nature allows, so freedom never includes a moral right to invade another person.'},
  `The disagreement concerns the content of liberty, not merely the amount of liberty.\n\n${src('3')}`);
question('The motivational gap','Does knowing that aggression is wrong give a threatened person enough reason to trust that others will remain peaceful?','Hobbes can accept that people recognize rules and still argue that fear, suspicion, and advantage will defeat them.',`This question returns the argument from moral definition to practical enforcement.\n\n${src('3-4')}`);

section('IV','A law needs someone who can execute it',`Derive the executive power of the Law of Nature from the need for enforcement and natural equality.\n\n${src('4')}`);
build('law-needs-force','An unenforced law would be empty',[
  'Locke does not assume that people will automatically obey the Law of Nature.',
  'Like every law that concerns conduct in this world, the Law of Nature needs a power able to protect the innocent and restrain offenders.',
  'Without anyone able to respond to violations, the law would be practically vain: it could condemn harm but could not help prevent repeated harm.',
  'Because Locke treats the Law of Nature as God\'s law, he cannot accept that it was created with no possible means of execution.'
],'The argument does not depend on universal goodness. It depends on a law having a means of enforcement.','4');
build('equal-executives','Equality distributes enforcement power',[
  'No natural sovereign exists in the state of nature, so enforcement cannot belong to one person by birth or divine appointment.',
  'If anyone has the power to execute the Law of Nature, equality requires that every person have it.',
  'Locke therefore gives every individual the natural right to punish anyone who violates another person\'s life, liberty, health, or possessions.'
],'Make the inference explicit: the law needs an executor; no one is naturally superior; therefore everyone shares the executive power.','4');
question('The strange doctrine','Can every person be an enforcer without turning every dispute into a private war?','The executive power supplies Locke\'s answer to lawbreaking, but distributing it equally creates the next problem: each person also interprets the law.',`Locke calls the natural right to punish a strange doctrine and then explains its purpose and limits.\n\n${src('4-5')}`);

section('V','Punishment protects a common moral order',`Separate punishment from self-defense and explain why Locke lets anyone punish an offender.\n\n${src('4-5')}`);
build('punishment-purpose','Punishment looks backward and forward',[
  'Self-defense tries to stop or ward off an immediate threat. Punishment responds after a person has overstepped the Law of Nature.',
  'Punishment may require reparation, meaning an attempt to repair or compensate for the harm already done.',
  'It may also restrain the offender and deter both that person and others from committing similar violations later.',
  'Its severity is limited by these purposes: punishment should make wrongdoing a bad bargain, not become unlimited private revenge.'
],'Keep reparation, restraint, deterrence, and revenge distinct.','4');
build('anyone-can-punish','A violation threatens more than its victim',[
  'The power to punish cannot belong only to the direct victim, because a victim may be dead or too weak to subdue the offender.',
  'A person who rejects the common moral law threatens everyone\'s peace, so law-abiding people may join together to bring the offender to justice.'
],'The shared executive power is supposed to let collective strength support the vulnerable.','4-5');
quote('Each Transgression may be punished to that degree, and with so much Severity as will suffice to make it an ill bargain to the Offender.','John Locke, Second Treatise, section 12, p. 275',`The rest of Locke's sentence identifies repentance and deterrence as the governing aims.\n\n${src('4','John Locke, Second Treatise, s. 12, p. 275, as quoted in the source material.')}`);
duo('Why the power is supposed to be natural',
  {label:'The foreigner problem',text:'A foreigner has not consented to a country\'s civil laws, so those laws alone cannot explain the country\'s right to punish that person.'},
  {label:'Locke\'s answer',text:'The ruler and the foreigner remain in a state of nature with one another, so punishment rests on the universal executive power of natural law.'},
  `The argument notes that Locke later has another possible answer based on tacit consent.\n\n${src('5')}`);
question('What enforcement could secure','If the Law of Nature can be enforced, which ordinary rights become possible before civil government exists?','Locke\'s answer extends beyond physical safety. Effective natural law is also supposed to protect stable possession and productive use.',`The next section introduces private property only to the extent developed in this argument.\n\n${src('5-6')}`);

section('VI','Property turns preservation into practice',`Show why Locke thinks people must be able to use and possess parts of the natural world.\n\n${src('5-6')}`);
build('property-need','Survival requires rightful use',[
  'If the earth is available to humanity in common, each person still needs a way to rightfully consume particular apples, acorns, and other goods.',
  'A rule requiring everyone\'s permission before any use would make ordinary preservation impossible: people could starve while waiting for universal consent.',
  'Secure possession of land also supports cultivation, because people are more likely to improve a plot when they can exclude others and enjoy what it produces.'
],'The argument sketches the form of the property argument and postpones its full development to a later chapter.','5-6');
duo('Two routes to the same practical claim',
  {label:'Theological route',text:'God placed humanity on earth to live, so the world must be usable in ways that make preservation possible.'},
  {label:'Natural reason route',text:'Even without the theological premise, it seems absurd to require universal permission before anyone may use food or land needed for life.'},
  `The argument presents natural reason as a possible way for later Lockean arguments to loosen their theological dependence.\n\n${src('5-6')}`);
question('The secular challenge','How much of Locke\'s argument survives if someone rejects the claim that human beings belong to God?','The appeal to natural reason may support necessary use, but the theological premise originally grounds the equal moral duty to preserve humanity.',`Leave the tension visible: the argument calls the natural-reason route plausible without claiming it replaces every part of Locke's theology.\n\n${src('6')}`);

section('VII','Hobbes can challenge the enforcers',`Present the strongest objection to Locke's executive power before adding the abundance premise.\n\n${src('6-7')}`);
build('revenge-cycle','Enforcement may reproduce the problem',[
  'Suppose several people unite to punish a violent offender and require reparation.',
  'The offender may return with like-minded allies and treat the punishment as a reason for revenge.',
  'Anyone considering enforcement must now ask whether intervening today creates a more dangerous enemy tomorrow.',
  'A stable authority seems necessary to decide disputes and make judgments effective, but an acknowledged authority already looks like the beginning of a state.'
],'This is the argument\'s Hobbesian reply: greater power can subdue power, but stable greater power resembles government.','6');
build('natural-abundance','Locke lowers the pressure toward conflict',[
  'Locke also assumes that nature originally provides abundant land and enough room for people to establish their own plots.',
  'When unused land is plentiful, cultivating an independent plot is usually more attractive than invading a neighbor\'s possession.',
  'The right to punish then supports peace partly because it rarely needs to be used: fewer collisions over land mean fewer occasions for dangerous enforcement.'
],'Treat abundance as a second pillar of peace, not as a replacement for moral law.','7');
question('The fragile peace','Can abundant land secure peace when stealing finished goods may still be easier than producing them?','Hobbes can accept open space and still predict conflict over harvested crops, tools, shelter, and other usable goods.',`The next section tests both abundance and private enforcement under more realistic pressures.\n\n${src('7')}`);

section('VIII','Private justice creates its own insecurity',`Move through the theft objection to Locke's primary inconvenience: biased and disputed judgment.\n\n${src('7-8')}`);
build('finished-goods','Land is not the only scarce good',[
  'Abundant land does not guarantee an abundance of finished and consumable goods.',
  'Taking a neighbor\'s harvest may require less work than ploughing, sowing, and waiting for one\'s own crop.',
  'If theft is likely and punishment is unreliable, productive effort becomes risky because what one makes may end up in someone else\'s hands.'
],'The objection shifts attention from the quantity of nature to the reliability of social expectations.','7');
build('justice-inconvenience','The deepest problem is administering justice',[
  'Locke does not finally say that every person constantly fights over goods. The primary inconvenience is that each person must administer the Law of Nature for themselves.',
  'People can disagree about whether an offense occurred because the facts and the meaning of the law may be disputed.',
  'Even when they agree that an offense occurred, they can disagree about the proper punishment and the amount of compensation.',
  'A person may also know what justice requires but lack enough power to enforce it against a stronger offender.'
],'Name the three defects clearly: uncertain interpretation, partial judgment, and inadequate power.','7-8');
build('fence-case','Constructed illustration: the disputed fence',[
  'Imagine that one neighbor moves a boundary fence after a storm. One person sees theft; the other sees a correction to an earlier surveying mistake.',
  'Each side gathers friends, interprets the natural law, estimates the loss, and decides what force would count as proportionate punishment.',
  'Even people who sincerely want justice can become enemies because there is no impartial judge whose public decision both sides must accept.'
],'This is a constructed illustration, not an event from the argument. Use it to isolate disagreement about facts, law, remedy, and enforcement.','8');
question('Why leave a mostly peaceful condition?','If most people recognize the moral law, what does government add that private conscience and mutual aid cannot supply?','Government need not invent morality. It can supply known rules, an impartial judge, and stable power to execute judgments.',`The following section adds scarcity created by money and shows why the inconveniences become urgent.\n\n${src('8')}`);

section('IX','Money turns room into rivalry',`Explain the sequence from perishable limits to accumulation, land scarcity, multiplied disputes, and civil government.\n\n${src('8')}`);
build('money-scarcity','Money changes what people have reason to accumulate',[
  'Before money, taking far more land than a family can use has little point because surplus produce spoils.',
  'Money is durable, so surplus goods can be exchanged for something that can be stored without rotting.',
  'People now have a reason to cultivate more land than they need for immediate consumption and to produce goods for sale.',
  'As more land is claimed for accumulation and exchange, the original abundance gives way to scarcity and pressure over boundaries.'
],'Follow the causal order carefully: durable money permits hoarding, which encourages expanded production, which pressures land.','8');
build('need-government','The inconveniences multiply',[
  'Scarce land creates more disputes about ownership, trespass, compensation, and the proper use of force.',
  'More disputes place greater strain on private judgment, and every person remains tempted to favor their own case.',
  'A common government becomes imperative because it can provide publicly known rules, an impartial authority to settle disagreements, and dependable power to enforce the result.',
  'Locke\'s state of nature is therefore not identical to war: it can begin in peace, yet its own system of private justice becomes nearly unbearable as scarcity and conflict grow.'
],'End by preserving Locke\'s double claim: natural society is morally ordered, but civil society is needed to remedy its inconveniences.','8');
diagnostic('When every person may judge, punish, and enforce, who can be sure that justice is not becoming revenge?',`The question tests Locke's reason for leaving natural freedom without denying that natural moral duties already exist.\n\n${src('1-8')}`);
refs([
  ['Source material','“Locke,” source PDF, pp. 1-8.'],
  ['Primary work quoted and discussed','John Locke, Second Treatise of Civil Government (1689), ed. Peter Laslett (Cambridge University Press, 1988), sections and pages cited in the deck.'],
  ['Position opposed in the argument','Sir Robert Filmer, Patriarcha (published 1680), discussed as a defense of divinely authorized natural hierarchy.']
],`These are the only works used to reconstruct the visible argument.\n\n${src('1-8')}`);

const deck=document.getElementById('deck');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function renderSlide(s,i){
  const article=document.createElement('article');
  article.className=`slide ${s.type}${s.type==='content'||s.type==='head'?' top':''}`;
  article.dataset.index=i;
  if(s.buildGroup) article.dataset.buildGroup=s.buildGroup;
  let html='<div class="slide-inner">';
  if(s.type==='cover') html+=`<h1 class="title">${esc(s.title)}</h1><p class="work">${esc(s.work)}</p><div class="course">${esc(s.course)}</div>`;
  if(s.type==='section') html+=`<div class="eyebrow">${esc(s.eyebrow)}</div><h2 class="title">${esc(s.title)}</h2><div class="rule"></div>`;
  if(s.type==='content') html+=`<h2 class="title">${esc(s.title)}</h2><div class="body">${s.paragraphs.map((p,j)=>`<p class="${j===s.paragraphs.length-1?'fresh':''}">${esc(p)}</p>`).join('')}</div>`;
  if(s.type==='question'||s.type==='diagnostic') html+=`<div class="eyebrow">${esc(s.eyebrow)}</div><p class="prompt">${esc(s.prompt)}</p>${s.context?`<p class="context">${esc(s.context)}</p>`:''}`;
  if(s.type==='quote') html+=`<blockquote>${esc(s.text)}</blockquote><cite>${esc(s.cite)}</cite>`;
  if(s.type==='duo') html+=`<h2 class="title">${esc(s.title)}</h2><div class="duo-grid">${[s.left,s.right].map(x=>`<div class="duo-col"><h3>${esc(x.label)}</h3><p>${esc(x.text)}</p></div>`).join('')}</div>`;
  if(s.type==='head') html+=`<h2 class="title">${esc(s.title)}</h2><div class="head-list">${s.items.map(x=>`<div class="head-item"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div>`;
  if(s.type==='refs') html+=`<h2 class="title">${esc(s.title)}</h2><div class="refs-list">${s.items.map(x=>`<div class="ref"><strong>${esc(x[0])}.</strong> ${esc(x[1])}</div>`).join('')}</div>`;
  article.innerHTML=html+'</div>';
  deck.appendChild(article);
  return article;
}
const nodes=slides.map(renderSlide);
let current=0;
const counter=document.getElementById('counter');
const progress=document.getElementById('progress');
const notes=document.getElementById('notes');
const notesBody=document.getElementById('notes-body');
const overview=document.getElementById('overview');
const overviewGrid=document.getElementById('overview-grid');
function labelFor(s){return s.title||s.prompt||s.text||'Slide';}
slides.forEach((s,i)=>{const b=document.createElement('button');b.className='overview-card';b.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')} / ${slides.length}</span><span class="label">${esc(labelFor(s))}</span>`;b.addEventListener('click',()=>{closePanels();show(i)});overviewGrid.appendChild(b)});
const cards=[...overviewGrid.children];
function show(i){
  current=Math.max(0,Math.min(slides.length-1,i));
  nodes.forEach((n,j)=>n.classList.toggle('active',j===current));
  cards.forEach((n,j)=>n.classList.toggle('current',j===current));
  counter.textContent=`${current+1} / ${slides.length}`;
  progress.style.width=`${((current+1)/slides.length)*100}%`;
  notesBody.textContent=slides[current].notes||'No notes for this slide.';
  document.title=`${current+1}/${slides.length} · Locke - The State of Nature`;
}
function openPanel(panel){closePanels();panel.classList.add('open')}
function closePanels(){overview.classList.remove('open');notes.classList.remove('open')}
function togglePanel(panel){panel.classList.contains('open')?closePanels():openPanel(panel)}
function toggleFullscreen(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
document.getElementById('fullscreen').addEventListener('click',toggleFullscreen);
document.querySelectorAll('.close').forEach(b=>b.addEventListener('click',closePanels));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closePanels();return}
  if(overview.classList.contains('open')||notes.classList.contains('open')) return;
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();show(current+1)}
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}
  else if(e.key.toLowerCase()==='o') togglePanel(overview);
  else if(e.key.toLowerCase()==='n') togglePanel(notes);
  else if(e.key.toLowerCase()==='f') toggleFullscreen();
});
let touchX=0,touchY=0;
document.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))show(current+(dx<0?1:-1))},{passive:true});
function fits(node){const inner=node.querySelector('.slide-inner');return inner.scrollHeight<=node.clientHeight*.82&&inner.scrollWidth<=node.clientWidth*.92}
function fitNode(node,start=1){let f=start;node.classList.add('measuring');node.style.setProperty('--fit',f);while(f>.72&&!fits(node)){f-=.02;node.style.setProperty('--fit',f)}node.classList.remove('measuring');return f}
function fitAll(){
  nodes.forEach(n=>n.style.setProperty('--fit',1));
  const groups={};nodes.forEach(n=>{if(n.dataset.buildGroup)(groups[n.dataset.buildGroup]??=[]).push(n)});
  const grouped=new Set(Object.values(groups).flat());
  Object.values(groups).forEach(group=>{const final=group[group.length-1];const f=fitNode(final);group.forEach(n=>n.style.setProperty('--fit',f))});
  nodes.filter(n=>!grouped.has(n)).forEach(n=>fitNode(n));
  show(current);
}
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fitAll,120)});
if(document.fonts?.ready)document.fonts.ready.then(fitAll);else fitAll();
show(0);
</script>
