<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rousseau - The State of Nature</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#102b23;
    --bg-2:#173b2d;
    --bg-3:#214a38;
    --text:#f4f0df;
    --muted:#c8d4bd;
    --muted-dim:rgba(200,212,189,.58);
    --sage:#91bd79;
    --gold:#d6ad60;
    --gold-dim:#92733f;
    --clay:#b78658;
    --border:rgba(231,239,215,.17);
    --fit:1;
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text)}
  body{font-family:Inter,system-ui,sans-serif}
  button{font:inherit}
  #deck{
    position:relative;
    width:100vw;
    height:100vh;
    background:
      radial-gradient(ellipse at 16% 8%,rgba(145,189,121,.18),transparent 27%),
      radial-gradient(ellipse at 91% 91%,rgba(214,173,96,.12),transparent 30%),
      linear-gradient(145deg,#0b241c 0%,#102b23 52%,#263b2c 100%);
  }
  #deck::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.34;
    background:
      radial-gradient(ellipse at 0 100%,transparent 0 49%,rgba(204,222,185,.25) 49.3% 49.55%,transparent 49.85%),
      radial-gradient(ellipse at 100% 0,transparent 0 41%,rgba(204,222,185,.18) 41.25% 41.5%,transparent 41.8%);
    background-size:18rem 18rem,23rem 23rem;
    background-position:-7rem 20rem,12rem -7rem;
  }
  #deck::after{
    content:"";
    position:absolute;
    left:-12vw;
    top:21vh;
    width:44vw;
    height:25vw;
    border:1px solid rgba(200,216,190,.12);
    border-radius:50%;
    transform:rotate(-24deg);
    pointer-events:none;
  }
  .slide{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:7.2vh 4vw 8vh;
    text-align:center;
    overflow:hidden;
  }
  .slide.active,.slide.measuring{display:flex}
  .slide.measuring{visibility:hidden;pointer-events:none}
  .slide.top{align-items:flex-start;padding-top:8.5vh}
  .slide-inner{
    position:relative;
    z-index:1;
    width:min(1640px,90vw);
    max-height:82vh;
    margin:auto;
    transform-origin:top center;
  }
  .slide.top .slide-inner{margin:0 auto}
  .slide.duo .slide-inner{width:min(1760px,91.5vw)}
  .eyebrow{
    margin:0 0 1.2rem;
    color:var(--gold);
    font:600 clamp(12px,1.12vw,17px)/1.3 "IBM Plex Mono",monospace;
    letter-spacing:.18em;
    text-transform:uppercase;
  }
  .title{
    margin:0;
    font-family:"Cormorant Garamond",Georgia,serif;
    font-weight:600;
    letter-spacing:-.018em;
  }
  .cover .slide-inner{
    width:min(1640px,90vw);
    padding:3rem 4rem 3.3rem;
    background:linear-gradient(135deg,rgba(24,65,48,.78),rgba(19,45,35,.22));
    border-top:1px solid rgba(200,216,190,.23);
    border-bottom:4px solid rgba(214,173,96,.52);
    border-radius:52% 8% 42% 10%;
    box-shadow:0 20px 55px rgba(0,0,0,.23);
  }
  .cover .title{
    font-size:calc(clamp(64px,7.15vw,116px)*var(--fit));
    line-height:.96;
    max-width:none;
    letter-spacing:-.035em;
  }
  .cover .work{
    font:500 calc(clamp(20px,2.15vw,31px)*var(--fit))/1.35 "Cormorant Garamond",Georgia,serif;
    color:var(--muted);
    margin:1.5rem auto 0;
    max-width:40ch;
  }
  .cover .course{
    display:inline-block;
    margin-top:2.35rem;
    padding:.5rem .8rem;
    color:var(--gold);
    background:rgba(214,173,96,.13);
    border:1px solid rgba(214,173,96,.18);
    border-radius:999px;
    font:500 calc(clamp(11px,1vw,15px)*var(--fit))/1.4 "IBM Plex Mono",monospace;
    letter-spacing:.14em;
    text-transform:uppercase;
  }
  .section .slide-inner{
    width:min(1640px,90vw);
    padding:2.5rem 3.4rem 2.8rem;
    border-radius:1rem 5rem 1rem 5rem;
    background:linear-gradient(105deg,rgba(145,189,121,.12),transparent 62%);
  }
  .section .title{
    font-size:calc(clamp(52px,5.85vw,94px)*var(--fit));
    line-height:1.02;
    max-width:none;
  }
  .section .rule{
    width:6.5rem;
    height:4px;
    margin:1.8rem auto 0;
    border-radius:999px;
    background:linear-gradient(90deg,var(--gold),var(--sage));
  }
  .content .title,.head .title,.duo .title{
    font-size:calc(clamp(42px,4.75vw,74px)*var(--fit));
    line-height:1.02;
    max-width:none;
    margin-bottom:1.35rem;
    text-shadow:0 3px 18px rgba(0,0,0,.2);
  }
  .content .body{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:calc(clamp(25px,2.35vw,35px)*var(--fit));
    line-height:1.34;
    text-align:left;
  }
  .content .body p{
    margin:0 0 1.05em;
    padding:.42em .85em .42em 1.2rem;
    border-left:4px solid transparent;
    border-radius:0 1rem 1rem 0;
    color:var(--muted-dim);
    font-weight:600;
    background:rgba(145,189,121,.055);
  }
  .content .body p:nth-child(even){background:rgba(214,173,96,.035)}
  .content .body p.fresh{
    color:var(--text);
    border-left-color:var(--sage);
    background:linear-gradient(90deg,rgba(145,189,121,.2),rgba(214,173,96,.08),transparent 85%);
    text-shadow:none;
  }
  .question .slide-inner,.diagnostic .slide-inner{
    width:min(1640px,90vw);
    max-height:none;
    padding:2.9rem 3.7rem 2.6rem;
    background:linear-gradient(135deg,rgba(29,72,55,.82),rgba(35,57,42,.66));
    border-top:1px solid rgba(200,216,190,.24);
    border-bottom:4px solid rgba(214,173,96,.44);
    border-radius:4.8rem 1rem 4.8rem 1rem;
  }
  .question .prompt,.diagnostic .prompt{
    max-width:min(34ch,86vw);
    margin:0 auto;
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:calc(clamp(42px,5.2vw,72px)*var(--fit));
    line-height:1.08;
    font-weight:600;
    letter-spacing:-.015em;
  }
  .question .prompt::after,.diagnostic .prompt::after{
    content:"";
    display:block;
    width:5.7rem;
    height:4px;
    margin:1.8rem auto 0;
    border-radius:999px;
    background:linear-gradient(90deg,var(--sage),var(--gold));
  }
  .question .context{
    max-width:48ch;
    margin:1.2rem auto 0;
    color:var(--muted);
    font:500 calc(clamp(18px,1.7vw,25px)*var(--fit))/1.4 "Cormorant Garamond",Georgia,serif;
  }
  .quote .slide-inner{
    width:min(1640px,90vw);
    padding:2.6rem 3.5rem 2.8rem;
    background:rgba(20,59,44,.52);
    border-top:1px solid rgba(200,216,190,.34);
    border-bottom:4px solid rgba(214,173,96,.55);
    border-radius:50% 50% 12% 12% / 7% 7% 3% 3%;
  }
  .quote blockquote{
    margin:0 auto;
    max-width:min(34ch,84vw);
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:calc(clamp(39px,4.45vw,63px)*var(--fit));
    line-height:1.12;
    font-weight:500;
    font-style:italic;
  }
  .quote blockquote::before{content:"“";color:var(--gold);margin-right:.08em}
  .quote blockquote::after{content:"”";color:var(--gold);margin-left:.08em}
  .quote cite{
    display:block;
    margin-top:1.6rem;
    color:#d1ddc0;
    font:500 calc(clamp(12px,1.15vw,17px)*var(--fit))/1.45 "IBM Plex Mono",monospace;
    font-style:normal;
  }
  .duo-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:clamp(2.25rem,3.25vw,4rem);
    margin-top:1.5rem;
    text-align:left;
  }
  .duo-col{
    min-height:13rem;
    padding:1.35rem 1.4rem 1.1rem;
    border-top:1px solid rgba(200,216,190,.26);
    border-bottom:1px solid rgba(200,216,190,.1);
    background:linear-gradient(110deg,rgba(145,189,121,.07),transparent 78%);
  }
  .duo-col:nth-child(2){background:linear-gradient(110deg,rgba(214,173,96,.06),transparent 78%)}
  .duo-col h3{
    margin:0 0 .85rem;
    color:#d9bd77;
    font:600 calc(clamp(13px,1.25vw,18px)*var(--fit))/1.3 "IBM Plex Mono",monospace;
    letter-spacing:.12em;
    text-transform:uppercase;
  }
  .duo-col p{
    margin:0;
    color:var(--text);
    font:500 calc(clamp(24px,2.15vw,33px)*var(--fit))/1.34 "Cormorant Garamond",Georgia,serif;
  }
  .head-list{
    display:grid;
    gap:.85rem;
    margin-top:1.8rem;
    text-align:left;
  }
  .head-item{
    display:grid;
    grid-template-columns:11rem 1fr;
    gap:1.5rem;
    align-items:baseline;
    padding:.85rem 1.1rem;
    border-top:1px solid rgba(200,216,190,.18);
    background:rgba(19,58,43,.34);
  }
  .head-item b{
    color:#d9bd77;
    font:600 calc(clamp(12px,1.1vw,16px)*var(--fit))/1.3 "IBM Plex Mono",monospace;
    letter-spacing:.12em;
    text-transform:uppercase;
  }
  .head-item span{
    font:500 calc(clamp(23px,2.05vw,31px)*var(--fit))/1.3 "Cormorant Garamond",Georgia,serif;
  }
  .diagnostic .eyebrow{color:var(--muted)}
  .diagnostic .prompt{font-size:calc(clamp(52px,6.6vw,90px)*var(--fit))}
  .refs .slide-inner{width:min(1640px,90vw);text-align:left}
  .refs .title{
    font-size:calc(clamp(44px,4.9vw,76px)*var(--fit));
    line-height:1.02;
    max-width:none;
    margin-bottom:1.7rem;
  }
  .refs-list{display:grid;gap:1.05rem}
  .ref{
    padding-top:.95rem;
    border-top:1px solid rgba(200,216,190,.2);
    color:var(--muted);
    font:500 calc(clamp(18px,1.65vw,24px)*var(--fit))/1.38 "Cormorant Garamond",Georgia,serif;
  }
  .ref strong{color:var(--text);font-weight:600}
  #progress{
    position:fixed;
    top:0;
    left:0;
    height:4px;
    width:0;
    z-index:30;
    background:linear-gradient(90deg,var(--sage),var(--gold));
  }
  #nav-hint,#counter{
    position:fixed;
    bottom:18px;
    z-index:30;
    color:var(--muted);
    font:500 12px/1.3 "IBM Plex Mono",monospace;
    letter-spacing:.08em;
  }
  #nav-hint{left:24px}
  #counter{right:24px}
  #fullscreen{
    position:fixed;
    top:20px;
    right:22px;
    z-index:30;
    color:var(--muted);
    background:rgba(19,58,43,.34);
    border:1px solid rgba(200,216,190,.26);
    border-radius:999px;
    padding:8px 11px;
    cursor:pointer;
    font:500 11px/1 "IBM Plex Mono",monospace;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  #fullscreen:hover{color:var(--gold);border-color:var(--gold-dim)}
  .panel{
    position:fixed;
    inset:4vh 4vw;
    z-index:60;
    display:none;
    background:rgba(16,43,35,.985);
    border:1px solid rgba(200,216,190,.2);
    overflow:auto;
  }
  .panel.open{display:block}
  .panel-head{
    position:sticky;
    top:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 22px;
    background:#173b2d;
    border-bottom:1px solid rgba(200,216,190,.18);
    z-index:2;
  }
  .panel-head h2{
    margin:0;
    color:var(--gold);
    font:600 14px/1 "IBM Plex Mono",monospace;
    letter-spacing:.15em;
    text-transform:uppercase;
  }
  .close{
    color:var(--text);
    background:transparent;
    border:1px solid rgba(200,216,190,.22);
    padding:7px 10px;
    cursor:pointer;
  }
  #overview-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px;
    padding:20px;
  }
  .overview-card{
    min-height:126px;
    padding:16px;
    text-align:left;
    background:linear-gradient(145deg,#224b3c,#17362c);
    border:1px solid rgba(200,216,190,.16);
    border-radius:1rem 0 1rem 0;
    color:var(--text);
    cursor:pointer;
  }
  .overview-card:hover,.overview-card.current{
    border-color:var(--sage);
    box-shadow:0 8px 24px rgba(0,0,0,.18);
  }
  .overview-card .num{
    display:block;
    margin-bottom:12px;
    color:var(--gold);
    font:500 11px/1.3 "IBM Plex Mono",monospace;
  }
  .overview-card .label{font:600 22px/1.1 "Cormorant Garamond",Georgia,serif}
  #notes-body{
    max-width:1000px;
    padding:28px 34px;
    white-space:pre-wrap;
    color:var(--text);
    font:400 18px/1.62 Inter,sans-serif;
  }
  @media (max-width:760px){
    .slide{padding:9vh 8vw 10vh}
    .slide.top{padding-top:9.5vh}
    .slide-inner,.slide.duo .slide-inner{width:84vw}
    .cover .slide-inner,.section .slide-inner,.question .slide-inner,.diagnostic .slide-inner,.quote .slide-inner{padding:1.45rem 1.4rem 1.25rem}
    .duo-grid{grid-template-columns:1fr;gap:1.5rem}
    .duo-col{min-height:0}
    .head-item{grid-template-columns:1fr;gap:.45rem}
    .content .body{font-size:calc(clamp(22px,5.6vw,30px)*var(--fit))}
    .content .body p{margin-bottom:.75em;padding:.25em .7em .25em 1rem}
    .content .title,.head .title,.duo .title{margin-bottom:1rem}
    .question .context{margin-top:.9rem}
    .question .prompt::after,.diagnostic .prompt::after{margin-top:1.1rem}
    .duo-col p{font-size:calc(clamp(22px,5.3vw,29px)*var(--fit))}
    #nav-hint{display:none}
    #fullscreen{top:12px;right:12px}
  }
</style>
<link rel="stylesheet" href="presentation-polish.css">
<script src="presentation-polish.js" defer></script>
</head>
<body>
<div id="deck" aria-live="polite"></div>
<div id="progress" aria-hidden="true"></div>
<div id="nav-hint">ARROWS / SPACE · O OVERVIEW · N NOTES · F FULLSCREEN</div>
<div id="counter" aria-live="polite">1 / 1</div>
<button id="fullscreen" type="button" aria-label="Toggle fullscreen">Fullscreen</button>

<section id="overview" class="panel" aria-label="Slide overview">
  <div class="panel-head"><h2>Overview</h2><button class="close" type="button" data-close="overview">Close</button></div>
  <div id="overview-grid"></div>
</section>
<aside id="notes" class="panel" aria-label="Speaker notes">
  <div class="panel-head"><h2>Speaker notes</h2><button class="close" type="button" data-close="notes">Close</button></div>
  <div id="notes-body"></div>
</aside>

<script>
const slides=[];
const src=(pages,extra)=>"[Sources]\nSource material, “Rousseau and the State of Nature,” assigned PDF, pp. "+pages+"."+((extra)?("\n"+extra):"")+"\n[/Sources]";
const add=s=>slides.push(s);
const cover=(title,work,course,notes)=>add({type:"cover",title,work,course,notes});
const section=(roman,title,notes,pages)=>add({type:"section",eyebrow:roman+". "+title.toUpperCase(),title,notes:notes+"\n\n"+src(pages)});
const question=(eyebrow,prompt,context,notes,pages)=>add({type:"question",eyebrow,prompt,context,notes:notes+"\n\n"+src(pages)});
const quote=(text,cite,notes,pages,extra)=>add({type:"quote",text,cite,notes:notes+"\n\n"+src(pages,extra)});
const duo=(title,left,right,notes,pages)=>add({type:"duo",title,left,right,notes:notes+"\n\n"+src(pages)});
const head=(title,items,notes,pages)=>add({type:"head",title,items,notes:notes+"\n\n"+src(pages)});
const diagnostic=(prompt,notes,pages)=>add({type:"diagnostic",eyebrow:"The Rousseau test",prompt,notes:notes+"\n\n"+src(pages)});
const refs=(items,notes,pages)=>add({type:"refs",title:"References",items,notes:notes+"\n\n"+src(pages)});
function build(id,title,paragraphs,notes,pages){
  paragraphs.forEach((_,i)=>{
    add({
      type:"content",
      title,
      paragraphs:paragraphs.slice(0,i+1),
      buildGroup:id,
      notes:notes+(i<paragraphs.length-1?"\n\nPause before revealing the next step.":"")+"\n\n"+src(pages)
    });
  });
}

cover(
  "The State of Nature",
  "Rousseau on freedom, pity, perfectibility, and the origins of inequality",
  "Political Philosophy",
  "Rousseau’s reversal sets the arc: war and domination are not simply what society restrains. They are also outcomes society can produce.\n\n"+src("1-23")
);

section("I","Inequality needs a history","Start with Rousseau’s distinction between natural difference and socially organized domination.","1-2");
build("central-history","Rousseau asks how difference becomes domination",[
  "The question behind the Second Discourse is not whether people differ. It is how modest differences in strength, health, or skill become durable differences in wealth, honor, authority, and power.",
  "Rousseau calls the first kind natural or physical inequality. He calls the second moral or political inequality, because society recognizes some people as entitled to command while others must obey.",
  "The central problem follows: how did possession become property, temporary cooperation become dependence, and force acquire the appearance of right?",
  "A stronger person may overpower a weaker person once, but strength alone cannot create a permanent right to rule. Stable domination requires a social history of property, obedience, expectations, and law."
],"Keep the opening distinction precise. Rousseau does not deny bodily differences; he asks how society turns them into durable hierarchy.","1-2");
duo("Two kinds of inequality",
  {label:"Natural or physical",text:"People differ in age, health, strength, intelligence, agility, and endurance. These differences can affect what someone can do on a particular occasion."},
  {label:"Moral or political",text:"People differ in wealth, honor, rank, authority, and power. These differences last because institutions and expectations make them socially binding."},
  "This comparison separates facts about bodies from social relationships that claim authority.","1-2");
question("Where could “right” come from?","A temporary victory explains who wins now. It does not explain why others should continue to obey later.","Rousseau has separated force from durable authority. The next section asks what kind of history can expose the missing link.","Use this question to move from the problem of inequality to Rousseau’s method.","1-2");

section("II","Nature is a critical baseline","Explain why Rousseau’s state of nature is a philosophical construction rather than a literal history.","2-3");
build("conjectural-method","The state of nature is a method, not a report",[
  "Rousseau says we should begin by “setting aside all the facts” because reliable knowledge of the earliest human condition was unavailable to him and his contemporaries.",
  "He constructs a conjectural history, meaning a hypothetical sequence that asks what human beings must have been like before particular social capacities developed.",
  "The method starts with the complicated person found in civilized society and removes what society may have added: language, abstract reasoning, property, law, permanent families, reputation, and the desire for distinction.",
  "The resulting story is not scientific prehistory. It is a counterfactual model that asks whether inequality, possessiveness, and status competition are historically conditioned rather than natural, necessary, or legitimate. Rousseau’s European and colonial categories still limit the model, so real peoples must not be treated as examples of Europe’s past."
],"Keep “conjectural” concrete. Rousseau is building a model for comparison, not claiming to have observed the first human beings.","2-3");
quote("setting aside all the facts","Rousseau, Second Discourse, Preface, as quoted in the assigned reading","Let the phrase sit briefly. The point is methodological limits, not permission to ignore evidence.","2","Primary work quoted in the argument: Jean-Jacques Rousseau, Discourse on the Origin and Foundations of Inequality Among Men.");
head("What Rousseau refuses to assume",[
  ["No backward projection","People outside government do not automatically understand property, contracts, justice, or long-term competition."],
  ["No naturalized hierarchy","The fact that inequality is widespread does not prove that it is natural, necessary, or legitimate."],
  ["No ethnographic shortcut","The pure natural human is a philosophical abstraction, not a portrait of any living Indigenous society."]
],"These cautions keep the model from becoming a claim about actual peoples.","2-3");
question("What is the model for?","Rousseau has stripped away familiar traits without claiming that any actual community lived this way.","The next comparison asks whether Hobbes and Locke have removed government while leaving social motives, rights, and expectations already in place.","The question marks the transition from method to philosophical opposition.","2-4");

section("III","Rousseau starts before Hobbes and Locke","Set Rousseau’s account against the state-of-nature theories he thinks begin too late.","3-4");
build("traditions-and-war","Hobbes and Locke already have social people",[
  "Hobbes’s people desire scarce goods, fear one another, care about reputation, and compete for safety and glory. Without a common power, those motives generate a condition of war.",
  "Locke’s people are more peaceful, but they already possess reason, natural rights, duties, family relationships, labor practices, property claims, and promises before government exists.",
  "Rousseau’s objection is methodological: both theories remove government while leaving many products of social development in place. Aggressive rivalry also needs continuing interaction, useful obedience, and desires that reach beyond immediate survival.",
  "Rousseau allows occasional violence under threat, injury, or immediate scarcity, but denies that it is a permanent condition of mutual hostility. Instead of rational knowledge of moral duties, he begins with self-preservation and reluctance to witness another sentient being’s suffering. Natural humans do not consciously formulate a law of nature."
],"Keep the comparison fair. Rousseau’s criticism is about what each theory assumes, not a claim that Hobbes and Locke offer identical politics.","3-4");
duo("Two theories Rousseau thinks begin too late",
  {label:"Hobbes",text:"People already compare, distrust, fear future loss, and compete for reputation. War follows from those developed motives when no common power restrains them."},
  {label:"Locke",text:"People already understand rights, duties, property, labor, family, and promises. Peace exists, but it is already morally and socially structured."},
  "Use the matched structure to make Rousseau’s methodological objection visible.","3-4");

section("IV","The natural human is independent","Describe the embodied, solitary, pre-moral human and the two natural passions that shape conduct.","5-7");
build("pure-human","The first human is embodied and largely solitary",[
  "Rousseau begins with hunger, thirst, fatigue, sexual desire, pain, fear, and the need for rest. Natural needs are limited, and the environment generally supplies ways to meet them, though injury, illness, old age, and death remain.",
  "Natural humans are physically adaptable because they do not rely on specialized tools, institutions, or other people’s labor. Their lives require versatility more than organized expertise.",
  "Solitude means that continuing association is unnecessary for basic survival. Encounters can occur, and a mother cares for a dependent child, but permanent households, inherited positions, and settled divisions of labor have not yet formed.",
  "Natural self-love, or amour de soi, seeks preservation without comparison. Pity is a natural repugnance at another sentient being’s suffering, so self-concern can be restrained before moral reasoning begins."
],"The natural human is not invulnerable. Independence means that basic survival does not depend on a continuing relation of command and obedience.","5-7");
duo("Solitude is not hatred",
  {label:"What Rousseau means",text:"People do not initially need continuing association to meet basic needs, so no one has a standing claim on another person’s labor."},
  {label:"What he does not mean",text:"Natural humans do not actively hate company or live without any contact. Solitude is a condition of dependence, not an instinct against others."},
  "This distinction prevents a peaceful condition from becoming a story about natural antisocial hatred.","5-6");
question("Does pity need reason?","The reading presents a tension: pity appears as immediate in the Second Discourse, yet fuller compassion seems to require imagination.","The next section distinguishes natural openness from moral agency and explains why the same human capacities can support both freedom and servitude.","Use the question as an unresolved interpretive step, not as a general invitation to discussion.","5-7");

section("V","Human freedom opens a dangerous future","Show how freedom and perfectibility make development possible without guaranteeing improvement.","6-9");
build("freedom-perfectibility","Freedom is openness, not yet autonomy",[
  "Humans differ from other animals because they can resist instinct and depart from a fixed pattern of behavior. Rousseau calls this natural freedom an openness to more than one response.",
  "Perfectibility names the capacity to learn, adapt, preserve acquired abilities, and develop new faculties. It does not mean that history steadily moves toward moral improvement.",
  "Freedom and perfectibility explain both achievement and corruption. The same openness that permits tools, language, morality, and political freedom also permits artificial needs, exploitation, and servitude.",
  "Physical inequality exists in the pure state of nature, but it rarely becomes durable political inequality. Someone who can leave and survive independently is difficult to keep enslaved, because domination needs the person being dominated to remain, work, and obey."
],"Define perfectibility as plasticity. It is a condition of human history, not a promise that history will end well.","6-8");
duo("Natural goodness is not virtue",
  {label:"Natural goodness",text:"A being with few needs, no desire to outrank others, little opportunity to dominate, and a spontaneous aversion to suffering is innocent rather than vicious."},
  {label:"Moral virtue",text:"Virtue requires knowledge, reflective choice, and responsibility. Those capacities emerge later, so natural humans can be good without already being moral agents."},
  "This distinction resolves the apparent contradiction between natural goodness and the absence of morality.","7");
question("How does humanity leave nature?","Rousseau has described a peaceful but thin condition. Perfectibility now turns accidental pressures into a sequence of new capacities and new dependencies.","The next section follows tools, cooperation, language, families, and convenience as linked stages.","This question marks the move from anthropology to conjectural development.","8-10");

section("VI","Social life begins through convenience","Trace the accidental, cumulative path from adaptation to language, families, and the intermediate “youth of the world.”","8-11");
build("development","Accidents activate a cumulative history",[
  "No original sin or innate drive to dominate forces humanity out of nature. Population changes, climate, disasters, migration, local scarcity, and chance discoveries create problems that old habits cannot solve.",
  "Perfectibility lets people improvise. They make tools, alter hunting practices, construct shelters, and sometimes cooperate. Later generations imitate and transmit these solutions.",
  "The process is not teleological. Each successful adaptation changes human capacities and creates new vulnerabilities, so development is not identical with moral progress.",
  "Environmental obstacles and temporary cooperation develop the mind. Gestures, cries, passion, and repeated encounters gradually gain shared meaning, expanding memory and coordination. Huts and families then make attachment, leisure, and convenience possible. A convenience can become a need, while the “youth of the world” remains an intermediate stage before entrenched inequality."
],"The sequence is conjectural and open-ended. Tools, cooperation, language, and early family life develop together rather than appearing in a single founding act.","8-11");
quote("The genuine youth of the World","Rousseau, Second Discourse, Part II, as quoted in the assigned reading","Let the intermediate stage remain distinct from the pure state of nature. Rousseau praises developed social life before property hardens dependence.","11","Primary work quoted in the argument: Jean-Jacques Rousseau, Discourse on the Origin and Foundations of Inequality Among Men.");
question("What changes when others become witnesses?","Stable contact has made affection and cooperation possible, but it has also made comparison possible.","The next section follows the new desire for recognition and asks whether it must become rivalry.","Use the question to pivot from material convenience to social psychology.","10-12");

section("VII","Recognition becomes rivalry","Explain amour-propre as the social passion that makes esteem, shame, and comparison politically important.","11-12");
build("amour-propre","Amour-propre turns the self into a social question",[
  "Amour-propre is self-esteem shaped by other people’s judgments. It makes a person care about rank, respect, admiration, and comparative worth, not only about whether basic needs are met.",
  "Comparison makes esteem scarce. Everyone can have enough food, but not everyone can be superior. Another person’s success can therefore feel like one’s own diminishment.",
  "When expected recognition fails, shame, resentment, humiliation, anger, envy, and revenge become possible. An injury can now signal contempt, not only physical harm."
],"Define the term by contrast with amour de soi. The first asks whether one has enough; the second asks where one stands.","11-12");
duo("Two forms of amour-propre",
  {label:"Inflamed comparison",text:"The person seeks to be preferred. Recognition becomes a competition in which another person’s success threatens the self."},
  {label:"Equal recognition",text:"The person seeks respect as someone of equal worth. Social self-consciousness remains, but it need not demand another person’s inferiority."},
  "Rousseau’s later political and educational projects depend on redirecting social recognition rather than pretending it can disappear.","11-12");

section("VIII","Property manufactures the war it fears","Show how agriculture, metallurgy, specialization, and recognized property amplify small differences.","12-13");
build("property-origins","Agriculture and metallurgy destroy easy independence",[
  "Agriculture requires land to be occupied over time, future harvests to be anticipated, boundaries to be recognized, and labor to be coordinated. Metallurgy supplies tools that make cultivation more productive.",
  "Specialization increases collective power, but it also makes each producer dependent on other people’s work. Someone who controls more tools, land, or stored goods can secure further advantages.",
  "Poverty changes as well. It becomes dependence inside a social structure where other people control access to the resources needed for survival. Natural differences now accumulate through institutions.",
  "Holding or occupying an object is temporary possession. Property is a recognized claim respected even when the owner is absent. The enclosure story dramatizes the shift: “This is mine” works only after people understand ownership, boundaries, obligation, and exclusion, and it becomes troubling when property controls resources needed for survival."
],"Connect economic development to political power. The issue is not technology by itself, but the dependence created when access to necessities becomes unequal.","12-13");
quote("This is mine","Rousseau, Second Discourse, Part II, as quoted in the assigned reading","The phrase is effective because property requires other people to accept or enforce the claim.","13","Primary work quoted in the argument: Jean-Jacques Rousseau, Discourse on the Origin and Foundations of Inequality Among Men.");
question("What happens when property has no impartial authority?","Property has created valuable and unequal stakes, but no common power yet settles disputes.","The next section follows those stakes into a late state of war and the political proposal that claims to end it.","This is the bridge from material inequality to the fraudulent contract.","13-15");

section("IX","Law can pacify and entrench inequality","Trace the late state of war, the fraudulent contract, and the stages by which institutions fix hierarchy.","13-15");
build("fraudulent-contract","The state of war arrives late",[
  "When property exists without an effective common authority, the wealthy have much to lose and the propertyless may see little reason to respect an order that excludes them from vital resources.",
  "Robbery, retaliation, insecurity, and calculated aggression now resemble Hobbes’s state of war. Rousseau places this condition after property, social comparison, expanded desires, and economic interdependence have developed.",
  "The rich propose common rules, courts, and public power in the language of peace and protection. The practical effect is to place collective force behind the existing distribution of resources.",
  "People with little property accept because they urgently want security, but the agreement is formally common and substantively unequal. The poor surrender independence and gain obligations, while the rich gain enforceable property rights. Rousseau therefore separates peace from justice: public law can replace private violence while stabilizing the unequal relationships that produced the crisis."
],"Rousseau’s reversal is now complete: war is a late social product, not the original condition.","13-14");
duo("Two contracts in Rousseau’s story",
  {label:"The fraudulent contract",text:"The Second Discourse explains how a deceptive pact can give unequal possession the appearance of legal right."},
  {label:"The legitimate contract",text:"The Social Contract asks what principles could make political authority legitimate among free and equal citizens."},
  "Do not collapse Rousseau’s diagnosis of unjust states into his later normative project.","14");
head("Three stages of political inequality",[
  ["Rich and poor","Property and law fix the distinction between those who possess and those who depend."],
  ["Powerful and weak","Government and magistrates fix the distinction between those who command through office and those who must submit."],
  ["Master and slave","When government becomes arbitrary rule, everyone’s security depends on a ruler’s will."]
],"The sequence shows how a human convention can acquire the appearance of natural necessity.","15");
question("Did law end domination?","The state has made conflict more predictable, but predictability may serve the people who already hold the most.","The next section asks what this order does to freedom, selfhood, and the balance between needs and powers.","Let the political achievement and the political failure remain together.","13-16");

section("X","Freedom must survive society","Explain freedom as nondependence, the divided social self, and Rousseau’s civic alternative.","15-18");
build("lost-freedom","The deepest loss is freedom as nondependence",[
  "Civilized people may possess more goods and technical power while having less control over their lives. Employers, patrons, landlords, officials, and social observers can become gatekeepers.",
  "Economic inequality becomes political power when one person controls resources another needs and sets the terms of access. Power over things grows alongside subjection to persons.",
  "Rousseau’s concern is therefore not only how much people have. Natural humans live close to their needs and powers, while social humans perform identities for others. Luxury and comparison can make desire outrun capacity.",
  "A literal return to nature would abandon love, conscience, reason, virtue, and citizenship. The political task is civil and moral freedom under general laws that express the common interest of equals, with material limits against one person purchasing another."
],"The essential test is discretion. Dependence becomes oppressive when another person can decide whether your necessities are available.","15-16");
duo("More power over things, less freedom among persons",
  {label:"Material gain",text:"Property, specialization, and law can increase production, storage, security, and technical power."},
  {label:"Personal subjection",text:"The same system can make survival depend on pleasing people who control work, resources, status, or access."},
  "Use the comparison to keep Rousseau’s criticism from becoming a simple complaint about wealth.","15-16");
quote("No citizen should be wealthy enough to purchase another, and no citizen should be poor enough to be forced to sell himself","Rousseau, The Social Contract, II.11, as quoted in the assigned reading","This is the material condition Rousseau places beneath legal equality.","18","Primary work quoted in the argument: Jean-Jacques Rousseau, The Social Contract.");
question("What would freedom look like after nature?","Rousseau has rejected both isolation and ordinary dependence.","The proposed answer is a social form of freedom, but it now faces the problem of forming people who can live it without treating others as masters or servants.","Use this as the transition to education and the limits of Rousseau’s own reconstruction.","17-19");

section("XI","Education tests nonservile development","Show how Emile applies the genealogy to individual formation and exposes unresolved tensions.","18-21");
build("emile","Emile tries to rebuild independence inside society",[
  "Emile translates Rousseau’s history of the species into an individual life. A child begins with sensation, vulnerability, self-love, and developing powers, then gradually becomes aware of other people’s judgments.",
  "Education should keep wants near capacities and ground learning in consequences tied to things rather than arbitrary personal commands. Dependence on physical necessity is impersonal.",
  "Dependence on another person’s will encourages servility or tyranny. Education cannot make a child natural again, but it can cultivate pity, reason, conscience, and recognition that do not require treating other people as masters or servants.",
  "The project remains unfinished. The pure state of nature works best as a counterfactual model rather than scientific prehistory, and Rousseau’s own tensions about pity, amour-propre, colonial categories, and gendered dependence make his method turn back on itself."
],"The educational project preserves functional independence rather than attempting a literal escape from society.","18-19");
duo("Two kinds of dependence",
  {label:"Dependence on things",text:"A physical obstacle can frustrate a plan, but it does not flatter, humiliate, or intentionally dominate."},
  {label:"Dependence on persons",text:"When another person controls what you need, the relationship can turn into servility, manipulation, or tyranny."},
  "This distinction carries the state-of-nature baseline into social education.","19");
head("What remains unresolved",[
  ["History and model","The model can clarify a philosophical contrast without replacing empirical evidence."],
  ["Natural feeling and reason","Elementary aversion to distress may precede reflective compassion, but Rousseau does not always separate them."],
  ["Equal recognition","A free social order depends on whether esteem can avoid turning into a contest for superiority."]
],"These tensions are part of the reading’s conclusion, not loose ends to hide.","19-21");
question("Can a social person remain free?","Education gives one answer, but the answer stays provisional because the same capacities that make moral agency possible also expose people to dependence, comparison, and power.","The final section states what Rousseau’s genealogy changes in political philosophy and why nature remains a standard of critique.","Hold the question open until the diagnostic ending.","18-23");

section("XII","Nature is a standard, not a destination","Close with the philosophical stakes, the conclusion of the genealogy, and the burden Rousseau places on political justification.","22-23");
build("stakes-conclusion","Rousseau changes what political philosophy must ask",[
  "Instead of treating preferences as fixed, Rousseau asks how institutions produce desires. Instead of measuring inequality only in wealth, he studies status, dependence, vulnerability, recognition, and power.",
  "Domination can emerge without a single designer. Property rules, divisions of labor, competitive standards, and inherited advantages can combine into an oppressive structure while each person responds to immediate circumstances.",
  "Rousseau’s conclusion is not that society should become pre-social. Institutions can also cultivate compassion, equal respect, civic agency, and freedom, so anyone who calls inequality natural or inevitable carries the burden of justification."
],"Make the final move explicit: nature is a critical standard, not a political destination.","22-23");
diagnostic("Can human beings become social without becoming dependent on one another’s private wills?","Return to the whole arc. Rousseau begins with independence, pity, and perfectibility, then asks whether social development can preserve freedom while making common life possible.","1-23");
refs([
  ["Assigned reading","“Rousseau and the State of Nature,” course PDF, pp. 1-23."],
  ["Primary work quoted and discussed","Jean-Jacques Rousseau, Discourse on the Origin and Foundations of Inequality Among Men (Second Discourse, 1755)."],
  ["Primary work quoted and discussed","Jean-Jacques Rousseau, The Social Contract (1762), especially I.6-8, II.1-4, and II.11."],
  ["Primary work discussed","Jean-Jacques Rousseau, Emile (1762), Book II."]
],"The deck uses only the assigned reading and the primary works it explicitly quotes or discusses.","1-23");

const deck=document.getElementById("deck");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
function renderSlide(s,i){
  const article=document.createElement("article");
  article.className="slide "+s.type+((s.type==="content"||s.type==="head")?" top":"");
  article.dataset.index=i;
  article.setAttribute("aria-hidden",i===0?"false":"true");
  if(s.buildGroup) article.dataset.buildGroup=s.buildGroup;
  let html="<div class=\"slide-inner\">";
  if(s.type==="cover") html+="<h1 class=\"title\">"+esc(s.title)+"</h1><p class=\"work\">"+esc(s.work)+"</p><div class=\"course\">"+esc(s.course)+"</div>";
  if(s.type==="section") html+="<div class=\"eyebrow\">"+esc(s.eyebrow)+"</div><h2 class=\"title\">"+esc(s.title)+"</h2><div class=\"rule\" aria-hidden=\"true\"></div>";
  if(s.type==="content") html+="<h2 class=\"title\">"+esc(s.title)+"</h2><div class=\"body\">"+s.paragraphs.map((p,j)=>"<p class=\""+(j===s.paragraphs.length-1?"fresh":"")+"\">"+esc(p)+"</p>").join("")+"</div>";
  if(s.type==="question"||s.type==="diagnostic") html+="<div class=\"eyebrow\">"+esc(s.eyebrow)+"</div><p class=\"prompt\">"+esc(s.prompt)+"</p>"+(s.context?"<p class=\"context\">"+esc(s.context)+"</p>":"");
  if(s.type==="quote") html+="<blockquote>"+esc(s.text)+"</blockquote><cite>"+esc(s.cite)+"</cite>";
  if(s.type==="duo") html+="<h2 class=\"title\">"+esc(s.title)+"</h2><div class=\"duo-grid\">"+[s.left,s.right].map(x=>"<div class=\"duo-col\"><h3>"+esc(x.label)+"</h3><p>"+esc(x.text)+"</p></div>").join("")+"</div>";
  if(s.type==="head") html+="<h2 class=\"title\">"+esc(s.title)+"</h2><div class=\"head-list\">"+s.items.map(x=>"<div class=\"head-item\"><b>"+esc(x[0])+"</b><span>"+esc(x[1])+"</span></div>").join("")+"</div>";
  if(s.type==="refs") html+="<h2 class=\"title\">"+esc(s.title)+"</h2><div class=\"refs-list\">"+s.items.map(x=>"<div class=\"ref\"><strong>"+esc(x[0])+".</strong> "+esc(x[1])+"</div>").join("")+"</div>";
  article.innerHTML=html+"</div>";
  deck.appendChild(article);
  return article;
}
const nodes=slides.map(renderSlide);
let current=0;
const counter=document.getElementById("counter");
const progress=document.getElementById("progress");
const notes=document.getElementById("notes");
const notesBody=document.getElementById("notes-body");
const overview=document.getElementById("overview");
const overviewGrid=document.getElementById("overview-grid");
const labelFor=s=>s.title||s.prompt||s.text||"Slide";
slides.forEach((s,i)=>{
  const b=document.createElement("button");
  b.type="button";
  b.className="overview-card";
  b.setAttribute("aria-label","Go to slide "+(i+1)+": "+labelFor(s));
  b.innerHTML="<span class=\"num\">"+String(i+1).padStart(2,"0")+" / "+slides.length+"</span><span class=\"label\">"+esc(labelFor(s))+"</span>";
  b.addEventListener("click",()=>{closePanels();show(i)});
  overviewGrid.appendChild(b);
});
const cards=[...overviewGrid.children];
function show(i){
  current=Math.max(0,Math.min(slides.length-1,i));
  nodes.forEach((n,j)=>{
    const active=j===current;
    n.classList.toggle("active",active);
    n.setAttribute("aria-hidden",active?"false":"true");
  });
  cards.forEach((n,j)=>n.classList.toggle("current",j===current));
  counter.textContent=(current+1)+" / "+slides.length;
  progress.style.width=(((current+1)/slides.length)*100)+"%";
  notesBody.textContent=slides[current].notes||"No notes for this slide.";
  document.title=(current+1)+"/"+slides.length+" · Rousseau - The State of Nature";
}
function openPanel(panel){closePanels();panel.classList.add("open")}
function closePanels(){overview.classList.remove("open");notes.classList.remove("open")}
function togglePanel(panel){panel.classList.contains("open")?closePanels():openPanel(panel)}
function toggleFullscreen(){
  if(document.fullscreenElement){document.exitFullscreen()}
  else{document.documentElement.requestFullscreen().catch(()=>{})}
}
document.getElementById("fullscreen").addEventListener("click",toggleFullscreen);
document.querySelectorAll(".close").forEach(b=>b.addEventListener("click",closePanels));
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closePanels();return}
  if(overview.classList.contains("open")||notes.classList.contains("open")) return;
  if(["ArrowRight","ArrowDown"," ","PageDown"].includes(e.key)){e.preventDefault();show(current+1)}
  else if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();show(current-1)}
  else if(e.key.toLowerCase()==="o") togglePanel(overview);
  else if(e.key.toLowerCase()==="n") togglePanel(notes);
  else if(e.key.toLowerCase()==="f") toggleFullscreen();
});
let touchX=0,touchY=0;
document.addEventListener("touchstart",e=>{touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY},{passive:true});
document.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].screenX-touchX;
  const dy=e.changedTouches[0].screenY-touchY;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)) show(current+(dx<0?1:-1));
},{passive:true});
function fits(node){
  const inner=node.querySelector(".slide-inner");
  return inner&&inner.scrollHeight<=node.clientHeight*.82&&inner.scrollWidth<=node.clientWidth*.92;
}
function fitNode(node,start){
  let f=start||1;
  node.classList.add("measuring");
  node.style.setProperty("--fit",f);
  while(f>.72&&!fits(node)){
    f=Math.max(.72,f-.01);
    node.style.setProperty("--fit",f.toFixed(3));
  }
  node.classList.remove("measuring");
  return f;
}
function fitAll(){
  nodes.forEach(n=>n.style.setProperty("--fit",1));
  const groups={};
  nodes.forEach(n=>{if(n.dataset.buildGroup)(groups[n.dataset.buildGroup]||(groups[n.dataset.buildGroup]=[])).push(n)});
  const grouped=new Set(Object.values(groups).flat());
  Object.values(groups).forEach(group=>{
    const f=fitNode(group[group.length-1],1);
    group.forEach(n=>n.style.setProperty("--fit",f));
  });
  nodes.filter(n=>!grouped.has(n)).forEach(n=>fitNode(n,1));
  show(current);
}
let resizeTimer;
window.addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fitAll,160)});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitAll); else fitAll();
show(0);
</script>
