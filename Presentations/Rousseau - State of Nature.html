<script>
const slides=[];
const src=(pages,extra="")=>"[Sources]\nSource material, “Rousseau,” source PDF, pp. "+pages+"."+(extra?"\n"+extra:"")+"\n[/Sources]";
const add=s=>slides.push(s);
const cover=(title,work,course,notes)=>add({type:"cover",title,work,course,notes});
const section=(roman,title,notes)=>add({type:"section",eyebrow:roman+". "+title.toUpperCase(),title,notes});
const question=(eyebrow,prompt,context,notes)=>add({type:"question",eyebrow,prompt,context,notes});
const quote=(text,cite,notes)=>add({type:"quote",text,cite,notes});
const duo=(title,left,right,notes)=>add({type:"duo",title,left,right,notes});
const head=(title,items,notes)=>add({type:"head",title,items,notes});
const diagnostic=(prompt,notes)=>add({type:"diagnostic",eyebrow:"The Rousseau test",prompt,notes});
const refs=(items,notes)=>add({type:"refs",title:"References",items,notes});
function build(id,title,paragraphs,notes,pages){
  paragraphs.forEach((_,i)=>add({type:"content",title,paragraphs:paragraphs.slice(0,i+1),buildGroup:id,notes:notes+(i<paragraphs.length-1?"\n\nPause before revealing the next step.":"")+"\n\n"+src(pages)}));
}

cover("The State of Nature","Rousseau and the social invention of conflict","Political Philosophy","Begin with Rousseau’s reversal: war is not what civilization saves us from; it is something social development helps create.\n\n"+src("1-7"));

section("I","Who put civil man into the forest?","Introduce Rousseau’s methodological criticism before presenting his alternative picture.\n\n"+src("1"));
build("projection","Rousseau changes the starting point",[
  "Earlier state-of-nature theories describe people without government, but often leave familiar social desires - greed, pride, domination, and status - intact.",
  "Rousseau argues that this projects civil man backward. Traits formed inside society are treated as if they belonged to human nature itself.",
  "His state of nature is therefore a “probable conjecture”: a reasoned reconstruction that separates basic human capacities from motives produced by social life."
],"Keep the method clear. Rousseau is not reporting an observed prehistoric society; he is testing which motives must be natural and which may be social products.","1");
question("The starting question","If pride, rivalry, long-term ambition, and the need for approval are learned, what remains before society teaches them?","Rousseau must identify motives simple enough to be natural and strong enough to explain how solitary people behave.","Use the question to shift from methodological criticism to Rousseau’s two natural drives.\n\n"+src("1"));

section("II","Pity restrains before morality commands","Present self-preservation and pity as independent natural motives, then distinguish pity from moral duty.\n\n"+src("1-3"));
build("two-drives","Natural human beings have two basic drives",[
  "Like Hobbes and Locke, Rousseau begins with self-preservation: living creatures naturally avoid hunger, pain, and death.",
  "But self-preservation is not the whole story. Human beings also have pity, an immediate aversion to seeing another creature suffer.",
  "Pity does not require calculation. It can move someone to help before that person weighs a rule, a duty, or a future reward.",
  "Because another’s pain disturbs us, pity restrains attacks that self-interest alone might permit."
],"Do not describe Rousseau as assuming unlimited benevolence. Pity is a restraint on harm, not a standing desire to serve everyone.","1-2");
quote("It is pity that carries us without reflection to the assistance of those who we see suffer.","Rousseau, Discourse on the Origin of Inequality, p. 154","Let the phrase “without reflection” carry the distinction between feeling and moral judgment.\n\n"+src("2","Discourse on the Origin of Inequality, p. 154, as quoted in the source material."));
build("pity-not-rights","Compassion is not a theory of rights",[
  "Locke thinks people can recognize moral rights before government. Rousseau does not make that claim.",
  "In the earliest state of nature, ideas such as law, right, virtue, and moral obligation have not yet developed.",
  "Natural people avoid much harm because suffering repels them, not because they judge that harming another person violates a moral rule."
],"Keep motive and morality separate. The action may look kind even though it is not guided by a concept of duty.","2-3");
question("A limit appears","Can pity prevent war when helping another person threatens one’s own survival?","Rousseau has given natural human beings two motives. Scarcity can force self-preservation and compassion to pull in opposite directions.","The objection arises directly from the two-drive account and must be answered before the peaceful state of nature is credible.\n\n"+src("3"));

section("III","What happens when survival and pity collide?","State the scarcity objection at full strength before presenting Rousseau’s response.\n\n"+src("2-3"));
build("scarcity","Compassion has a survival condition",[
  "Rousseau says pity discourages a strong person from taking food from someone weak when food can be found somewhere else.",
  "The qualification matters. Under grave scarcity, sparing another person may mean going hungry oneself.",
  "Few creatures would place a stranger’s survival ahead of their own, so pity may fade precisely when conflict becomes most dangerous.",
  "If scarcity becomes severe, natural people could enter war and also suffer from the pain they cause. Compassion alone does not guarantee peace."
],"Present this as the argument’s strongest objection to pity as a sufficient restraint.","2-3");
build("last-loaf","Constructed illustration: the last loaf",[
  "After a storm, two isolated travelers find one loaf. Each believes it is the only food available before rescue.",
  "Pity gives each a reason not to injure the other, while self-preservation gives each a reason not to surrender the loaf.",
  "The case shows why Rousseau needs more than kindness. He must explain why such direct collisions would be unusual in the original condition."
],"This is a constructed illustration, not an episode from Rousseau. It isolates the conflict between pity and self-preservation.","3");
question("Rousseau’s escape route","What if natural people rarely meet, want very little, and can usually survive without taking from anyone else?","Rousseau reduces conflict by changing the social setting around desire: solitude and limited needs make competition exceptional.","The next section presents the structural reply, not a claim that pity becomes infinitely strong.\n\n"+src("3-4"));

section("IV","Solitude disarms Hobbes’s motives","Explain how rare contact, few desires, and little foresight remove the pressures that drive Hobbesian conflict.\n\n"+src("3-4"));
build("solitary","The natural human being can survive alone",[
  "Rousseau imagines the earliest human as solitary, with only occasional contact with others and no permanent family bond.",
  "Nature equips this person for independent survival: strength, mobility, and simple habits reduce dependence on organized cooperation.",
  "Natural desires are limited to food, sexual satisfaction, and sleep; natural fears center on hunger and pain.",
  "When desires are few and encounters are rare, hunting or gathering is usually easier than fighting another person for goods."
],"The point is not abundance in the abstract. Limited desire relative to available means lowers the frequency of collisions.","3-4");
head("Social motives have not yet formed",[
  ["No reputation","Without stable groups or developed language, other people’s opinions have little power over behavior."],
  ["No accumulated power","Little foresight means no continuing project of collecting resources to satisfy distant future desires."],
  ["No settled domination","Independent people who barely need one another have little reason or opportunity to establish lasting rule."]
],"Each missing motive depends on social relationships or developed foresight that Rousseau refuses to assume at the beginning.\n\n"+src("4"));
build("hobbes-defused","Hobbes’s three motives lose their force",[
  "Gain is less attractive because natural people want little and can usually obtain what they need directly.",
  "Safety creates less suspicion because solitary people rarely face one another and do not accumulate threatening stores of power.",
  "Reputation cannot motivate attack when there is no settled public whose admiration or contempt shapes a person’s standing."
],"Tie Rousseau’s anthropology directly to Hobbes’s motives for war: gain, safety, and reputation are defused or absent.","4");
question("A peaceful emptiness","If natural people have no language, family, reputation, long-term plans, or moral ideas, what makes this life distinctively human?","Rousseau has explained peace by stripping away much of social life. The success of that answer creates a new problem: how could civilization ever begin?","Allow the unease to remain. The next section separates peace from human development.\n\n"+src("4-5"));

section("V","Peace is not yet a human achievement","Confront the animal-like character of Rousseau’s natural human and the problem of transition.\n\n"+src("4-5"));
duo("Rousseau’s first condition is both attractive and thin",
  {label:"What it avoids",text:"There is no settled war, domination, status anxiety, corrupt dependence, or systematic desire to harm."},
  {label:"What it lacks",text:"There is no language, durable family, industry, moral life, shared culture, or developed intelligence."},
  "Do not romanticize the earliest state. Rousseau treats it as peaceful, but not as a fully realized human community.\n\n"+src("4-5"));
build("change-problem","The peaceful condition seems unable to move",[
  "A solitary person with few needs has little reason to invent institutions, seek recognition, or transform the world.",
  "Rousseau admits that the transition is conjectural and could have occurred in many ways. The argument also notes tensions among his different descriptions.",
  "His answer depends on two distinctively human capacities: free will and perfectibility, the open-ended ability to change and develop."
],"Define perfectibility immediately. It does not mean inevitable moral improvement; it means a capacity for self-transformation.","5");
question("The dangerous capacity","How can the ability to improve life become the source of both progress and misery?","Perfectibility lets people solve new problems, but each solution can alter their desires, relationships, and dependence on others.","This question introduces the causal sequence from tools to society.\n\n"+src("5"));

section("VI","Perfectibility starts the trouble","Trace the first steps from environmental pressure to tools, intelligence, and cooperation.\n\n"+src("5-6"));
build("perfectibility","A capacity becomes active under pressure",[
  "Rousseau calls the earliest person “infant man”: wandering without industry, speech, settled home, war, or lasting ties.",
  "Population growth can make simple subsistence harder, creating a practical problem that old habits no longer solve.",
  "Instead of treating competition as the first response to scarcity, Rousseau emphasizes innovation: people devise tools that make work easier.",
  "Tool-making awakens intelligence and pride because people begin to recognize their own skill and power over their surroundings."
],"Keep the contrast with Hobbes explicit: scarcity first stimulates invention rather than immediate predation.","5");
build("cooperation","Useful coordination creates new relationships",[
  "Some tasks work better when several people coordinate, as in a temporary hunting party.",
  "Cooperation begins from mutual interest: each person participates because acting together makes a shared task easier.",
  "Repeated cooperation reveals the advantages of common shelters and more stable group living.",
  "A solution to scarcity therefore changes the social world. People who once needed no one begin to organize their lives around one another."
],"The argument turns when practical coordination becomes a durable habit rather than a temporary convenience.","5-6");
question("The hidden cost of success","What happens when cooperation produces more than survival requires?","Tools and group living can conquer immediate scarcity. Their success creates leisure, convenience, and new forms of dependence.","The next section shows how abundance of conveniences creates a different kind of need.\n\n"+src("5-6"));

section("VII","Convenience becomes a chain","Explain the move from group life and affection to luxury, dependence, and corrupted needs.\n\n"+src("5-6"));
build("family-feeling","Stable living changes emotion",[
  "Common huts and repeated contact make durable households possible, and habits of shared life give rise to conjugal and parental love.",
  "Compassion alone did not create the family. New living arrangements create the repeated relationships in which stronger attachments develop."
],"The sequence matters: social conditions reshape feeling; the feelings are not simply carried intact from the first state of nature.","5-6");
build("corrupted-needs","A luxury can become a need",[
  "Cooperation and tools create leisure, allowing people to produce conveniences beyond food, shelter, and immediate safety.",
  "At first, a convenience gives genuine pleasure because it makes life easier or more comfortable.",
  "Once it becomes habitual, the pleasure fades while dependence remains. Losing the convenience now feels devastating.",
  "Rousseau calls these corrupted needs: society trains people to experience deprivation where natural life once contained no lack."
],"Define corruption as transformed dependence, not simply moral wickedness.\n\nConstructed analogy: a device may begin as optional, then become necessary for navigation, work, and social contact.","6");
quote("This was the first yoke which, without thinking of it, they imposed on themselves.","Rousseau, Discourse on the Origin of Inequality, p. 164","Emphasize that the chain is self-imposed and initially appears as improvement.\n\n"+src("6","Discourse on the Origin of Inequality, p. 164, as quoted in the source material."));
question("A new kind of scarcity","If losing a learned convenience feels unbearable, has progress reduced need - or multiplied it?","Rousseau’s next step is interpersonal. Once people live together, they do not only want objects; they begin to want standing in one another’s eyes.","Move from dependence on things to dependence on recognition.\n\n"+src("6"));

section("VIII","Comparison teaches us to wound","Show how language and public comparison convert ordinary injury into status conflict and revenge.\n\n"+src("6"));
build("comparison","Living together makes status public",[
  "As language and society develop, people can compare beauty, strength, skill, possessions, and talent.",
  "Comparison creates pride when a person feels superior, shame when that person feels inferior, and envy when another receives admiration.",
  "An injury now communicates more than physical damage. It can be interpreted as contempt - a public judgment that one person matters less.",
  "Because status depends on others’ opinions, revenge becomes a way to answer humiliation and restore standing."
],"Make the new causal mechanism explicit: stable social attention creates reputational stakes that did not exist in solitude.","6");
quote("The genuine youth of the World.","Rousseau, Discourse on the Origin of Inequality, p. 167","Rousseau calls this intermediate stage the happiest and most stable: beyond animal simplicity but not yet consumed by property and inflamed pride.\n\n"+src("6","Discourse on the Origin of Inequality, p. 167, as quoted in the source material."));
question("Why the happiest stage cannot last","Can a society organized around comparison remain equal once some people control more productive resources than others?","Status rivalry creates friction, but agriculture, metallurgy, and private property turn differences into durable dependence and power.","The next section identifies the material transformation that produces full-scale war.\n\n"+src("6"));

section("IX","Property manufactures a state of war","Trace the sequence from productive specialization to inequality, dependence, and violent conflict.\n\n"+src("6-7"));
build("property","Production reorganizes social power",[
  "Agriculture and metallurgy make settled production more effective, but they also divide work and make people increasingly dependent on one another.",
  "Claims of private property give some people durable control over land, tools, products, and the labor needed to use them.",
  "Unequal holdings create jealousy and insecurity: the rich fear losing what they possess, while the poor depend on resources controlled by others.",
  "Rules of justice emerge alongside property, but the new order is already structured by unequal stakes and unequal power."
],"Do not say that the first natural condition contained property rights. In this account, property and justice appear late in social development.","6");
quote("Nascent society gave way to the most horrible state of war.","Rousseau, Discourse on the Origin of Inequality, pp. 171-172","The location of war is Rousseau’s reversal: it appears after social development, not at the original beginning.\n\n"+src("6-7","Discourse on the Origin of Inequality, pp. 171-172, as quoted in the source material."));
build("war-sequence","War is the result, not the starting point",[
  "Social comparison inflames pride, while property gives people valuable holdings to defend and material inequalities to resent.",
  "The rich can use superior power to preserve their advantages; the poor can turn to seizure or banditry when ordinary dependence becomes intolerable.",
  "Greed, ambition, revenge, and fear now stifle natural pity. Conflict becomes persistent because society has produced both the motives and the stakes of war."
],"Make the causal conclusion explicit. Rousseau does not deny that humans can become violent; he denies that this violence reveals an unchanged original nature.","6-7");
question("The political emergency","When social development creates a war that threatens everyone, who benefits most from the rules that promise peace?","Rousseau’s answer is unsettling: the proposal for equal law arises from the rich, whose property is most exposed to disorder.","This question moves from the origin of war to the political settlement built in response.\n\n"+src("7"));

section("X","The state arrives wearing the mask of peace","Explain how civil society resolves disorder while stabilizing an unequal property order.\n\n"+src("7"));
build("rich-project","Government answers a socially created crisis",[
  "Under pressure from conflict, the rich propose common rules of justice, public laws, and government as a way to end insecurity.",
  "The rules bind everyone in the language of equality, but their benefits are unequal because people with substantial property have the most to secure.",
  "Civil society is therefore born as a response to war or near-war, yet it also protects the unequal arrangements that helped produce the conflict."
],"Keep both functions visible: the state can make peace and can consolidate advantage at the same time.","7");
duo("The same institution can be remedy and inheritance",
  {label:"A remedy for disorder",text:"Common laws restrain fighting, stabilize expectations, and replace private force with a public settlement."},
  {label:"An inheritance of inequality",text:"The settlement secures property created under unequal conditions and makes those advantages harder to challenge."},
  "This tension prepares the diagnostic ending without resolving whether every possible political order must reproduce the first one.\n\n"+src("7"));
diagnostic("Did society cure human violence - or teach us the desires that made violence necessary?","Let the question remain open. It distinguishes Rousseau from theories that treat conflict as the direct expression of fixed human nature.\n\n"+src("1-7"));
refs([
  ["Source material","“Rousseau,” source PDF, pp. 1-7."],

const deck=document.getElementById('deck');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function renderSlide(s,i){
  const article=document.createElement('article');
  article.className=`slide ${s.type}${s.type==='content'||s.type==='head'?' top':''}`;
  article.dataset.index=i;
  if(s.buildGroup) article.dataset.buildGroup=s.buildGroup;
  let html='<div class="slide-inner">';
  if(s.type==='cover') html+=`<h1 class="title">${esc(s.title)}</h1><p class="work">${esc(s.work)}</p><div class="course">${esc(s.course)}</div>`;
  if(s.type==='section') html+=`<div class="eyebrow">${esc(s.eyebrow)}</div><h2 class="title">${esc(s.title)}</h2><div class="rule"></div>`;
  if(s.type==='content') html+=`<h2 class="title">${esc(s.title)}</h2><div class="body">${s.paragraphs.map((p,j)=>`<p class="${j===s.paragraphs.length-1?'fresh':''}">${esc(p)}</p>`).join('')}</div>`;
  if(s.type==='question'||s.type==='diagnostic') html+=`<div class="eyebrow">${esc(s.eyebrow)}</div><p class="prompt">${esc(s.prompt)}</p>${s.context?`<p class="context">${esc(s.context)}</p>`:''}`;
  if(s.type==='quote') html+=`<blockquote>${esc(s.text)}</blockquote><cite>${esc(s.cite)}</cite>`;
  if(s.type==='duo') html+=`<h2 class="title">${esc(s.title)}</h2><div class="duo-grid">${[s.left,s.right].map(x=>`<div class="duo-col"><h3>${esc(x.label)}</h3><p>${esc(x.text)}</p></div>`).join('')}</div>`;
  if(s.type==='head') html+=`<h2 class="title">${esc(s.title)}</h2><div class="head-list">${s.items.map(x=>`<div class="head-item"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div>`;
  if(s.type==='refs') html+=`<h2 class="title">${esc(s.title)}</h2><div class="refs-list">${s.items.map(x=>`<div class="ref"><strong>${esc(x[0])}.</strong> ${esc(x[1])}</div>`).join('')}</div>`;
  article.innerHTML=html+'</div>';
  deck.appendChild(article);
  return article;
}
const nodes=slides.map(renderSlide);
let current=0;
const counter=document.getElementById('counter');
const progress=document.getElementById('progress');
const notes=document.getElementById('notes');
const notesBody=document.getElementById('notes-body');
const overview=document.getElementById('overview');
const overviewGrid=document.getElementById('overview-grid');
function labelFor(s){return s.title||s.prompt||s.text||'Slide';}
slides.forEach((s,i)=>{const b=document.createElement('button');b.className='overview-card';b.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')} / ${slides.length}</span><span class="label">${esc(labelFor(s))}</span>`;b.addEventListener('click',()=>{closePanels();show(i)});overviewGrid.appendChild(b)});
const cards=[...overviewGrid.children];
function show(i){
  current=Math.max(0,Math.min(slides.length-1,i));
  nodes.forEach((n,j)=>n.classList.toggle('active',j===current));
  cards.forEach((n,j)=>n.classList.toggle('current',j===current));
  counter.textContent=`${current+1} / ${slides.length}`;
  progress.style.width=`${((current+1)/slides.length)*100}%`;
  notesBody.textContent=slides[current].notes||'No notes for this slide.';
  document.title=`${current+1}/${slides.length} · Rousseau - The State of Nature`;
}
function openPanel(panel){closePanels();panel.classList.add('open')}
function closePanels(){overview.classList.remove('open');notes.classList.remove('open')}
function togglePanel(panel){panel.classList.contains('open')?closePanels():openPanel(panel)}
function toggleFullscreen(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
document.getElementById('fullscreen').addEventListener('click',toggleFullscreen);
document.querySelectorAll('.close').forEach(b=>b.addEventListener('click',closePanels));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closePanels();return}
  if(overview.classList.contains('open')||notes.classList.contains('open')) return;
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();show(current+1)}
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}
  else if(e.key.toLowerCase()==='o') togglePanel(overview);
  else if(e.key.toLowerCase()==='n') togglePanel(notes);
  else if(e.key.toLowerCase()==='f') toggleFullscreen();
});
let touchX=0,touchY=0;
document.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))show(current+(dx<0?1:-1))},{passive:true});
function fits(node){const inner=node.querySelector('.slide-inner');return inner.scrollHeight<=node.clientHeight*.82&&inner.scrollWidth<=node.clientWidth*.92}
function fitNode(node,start=1){let f=start;node.classList.add('measuring');node.style.setProperty('--fit',f);while(f>.72&&!fits(node)){f-=.02;node.style.setProperty('--fit',f)}node.classList.remove('measuring');return f}
function fitAll(){
  nodes.forEach(n=>n.style.setProperty('--fit',1));
  const groups={};nodes.forEach(n=>{if(n.dataset.buildGroup)(groups[n.dataset.buildGroup]??=[]).push(n)});
  const grouped=new Set(Object.values(groups).flat());
  Object.values(groups).forEach(group=>{const final=group[group.length-1];const f=fitNode(final);group.forEach(n=>n.style.setProperty('--fit',f))});
  nodes.filter(n=>!grouped.has(n)).forEach(n=>fitNode(n));
  show(current);
}
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fitAll,120)});
if(document.fonts?.ready)document.fonts.ready.then(fitAll);else fitAll();
show(0);
</script>
