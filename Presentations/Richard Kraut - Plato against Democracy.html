<script>
const slides=[];const src=(pages,extra='')=>`[Sources]\nRichard Kraut, “Plato against Democracy: A Defense,” pp. ${pages}.${extra?`\n${extra}`:''}\n[/Sources]`;const add=s=>{if(s.type==="quote"||s.type==="question")return;slides.push(s);};const cover=(title,work,course,notes)=>add({type:'cover',title,work,course,notes});const section=(roman,title,notes)=>add({type:'section',eyebrow:`${roman}. ${title.toUpperCase()}`,title,notes});const question=(eyebrow,prompt,context,notes)=>add({type:'question',eyebrow,prompt,context,notes});const duo=(title,left,right,notes)=>add({type:'duo',title,left,right,notes});const head=(title,items,notes)=>add({type:'head',title,items,notes});const diagnostic=(prompt,notes)=>add({type:'diagnostic',eyebrow:'The Plato test',prompt,notes});const refs=(items,notes)=>add({type:'refs',title:'References',items,notes});function build(id,title,paragraphs,notes,pages){paragraphs.forEach((_,i)=>add({type:'content',title,paragraphs:paragraphs.slice(0,i+1),buildGroup:id,notes:`${notes}${i<paragraphs.length-1?'\n\nPause before revealing the next step.':''}\n\n${src(pages)}`}))}

cover('Plato against Democracy','Richard Kraut’s defense of Plato’s challenge','Political Philosophy',`Open with the tension between political equality and political competence.\n\n${src('1-11')}`);
section('I','Does equal political power require equal competence?',`Begin with a familiar democratic commitment before introducing Plato’s challenge.\n\n${src('1-2')}`);
question('An illustration','Should every adult have the same final say about a bridge’s safety, even if only some have studied the relevant evidence?','This constructed case isolates the question that drives Kraut’s essay: when a decision affects everyone, is equal power more important than unequal expertise?',`Do not treat the bridge as Kraut’s example. It is an illustration of the issue his argument raises.\n\n${src('1-2')}`);
build('athens','Plato criticized an ancient democracy, not ours',["Plato attacked Athenian dēmokratia, a system in which male citizens could speak and vote directly in the assembly.","Many Athenian offices were filled by lottery, and the word dēmos could also suggest the non-elite majority rather than every citizen as such.","Modern democracies usually elect representatives, and they include institutions that Athens did not have.","Those differences matter, but Kraut argues that they do not settle whether Plato’s deeper criticism can still apply."],`Keep the historical distinction clear before transferring any criticism to modern democracy.`,'1');
build('question','The hard question survives the historical difference',["Kraut asks whether even a perfectly functioning democracy might retain the defect Plato identified in Athens.","The relevant issue is not whether current democracies have mistakes that could be repaired.","It is whether a system that gives political power without requiring qualification is defective in principle.","To answer that question, Kraut reconstructs the argument that lies underneath Plato’s criticism."],`Emphasize that this is an argument about the conditions for good rule, not a claim that every actual democracy is identical.`,'1-2');
question('The first philosophical task','What would make a person qualified to rule rather than merely entitled to rule?','The next slides separate a legal right to participate from the knowledge and judgment needed to make decisions well.',`This question motivates Plato’s principle of specialization.\n\n${src('2-3')}`);

section('II','Why should ruling be treated as a skilled role?',`Build Plato’s argument from specialization and identify its controversial premise.\n\n${src('2-4')}`);
build('specialization','A city needs people who can do their jobs well',["Plato begins from a principle of specialization: each person should perform the social task for which that person is best suited and trained.","Farmers, cooks, doctors, artisans, and soldiers each contribute to the common good by doing a role that requires preparation.","Ruling also serves the common good. Political decisions shape laws, offices, courts, and the direction of a whole community.","If ruling is one important role among others, Plato concludes that it too should be performed by people qualified to do it well."],`The analogy does not yet establish who is qualified. It establishes why that question cannot be avoided.`,'2');
head('Kraut’s reconstruction of Plato’s argument',[["1","Every community needs roles that serve the common good."],["2","Those roles should be filled by people qualified to perform them."],["3","Ruling is one of those roles."],["4","Therefore, the unqualified should not rule."]],`The fourth claim is the contested bridge to Plato’s anti-democratic conclusion.\n\n${src('2-3')}`);
question('The crucial premise','Are most citizens actually unqualified to make political decisions?','Everything now turns on what political qualification means and why a democracy might fail to require it.',`Pause on the difference between proving that a skill matters and proving that most people lack it.\n\n${src('3-4')}`);
build('qualification','Kraut makes the hidden premise explicit',["Good political decision-making requires qualifications: relevant knowledge, political understanding, practical judgment, and the ability to serve the common good.","Kraut’s reconstruction says that most citizens lack these qualifications, not because they are inferior people, but because democracies usually do not require them before voting or holding office.","When political participation is a right that needs no training, citizens have little institutional incentive to acquire difficult political skills.","Kraut adds a modest empirical thought: difficult activities are usually performed well by relatively few people, especially when preparation is optional."],`Do not overstate the claim. Kraut treats it as a plausible generalization that needs support, not as a proof about every individual.`,'3-4');
duo('The analogy that challenges democracy',{label:'Other public roles',text:'We expect doctors, pilots, accountants, and police officers to acquire special preparation before taking responsibility for others.'},{label:'Political participation',text:'Democracies normally give every adult an equal legal right to vote even when no comparable preparation has been required.'},`Kraut asks democrats to explain this difference rather than simply assume it is justified.\n\n${src('4')}`);
question('The democratic reply begins here','Why should voting be treated differently from practicing medicine or flying a plane?','Kraut thinks this question cannot be dismissed by calling democracy fair; the special status of political equality must itself be explained.',`This is the pivot from the qualification argument to possible defenses of equality.\n\n${src('4')}`);

section('III','Why are hierarchies acceptable almost everywhere else?',`Extend the analogy from occupations to institutions, then test its limits.\n\n${src('4-5')}`);
build('hierarchy','Most institutions do not distribute authority equally',["Businesses, churches, universities, hospitals, orchestras, and armies commonly assign different authority to different members.","These hierarchies are not automatically unjust simply because some people decide and others do not.","They are often defended by pointing to competence, responsibility, and the need to coordinate difficult work.","Kraut’s challenge is that democratic theorists must explain why the nation-state alone cannot use a similar structure."],`The analogy does not prove that the state should be hierarchical. It shifts the burden to anyone who says political equality is uniquely required.`,'4-5');
build('state','The nation-state may seem importantly different',["A possible reply is that membership in a state is usually not voluntary: people are born into it and cannot easily leave.","A person dissatisfied with a university or church can often choose another association, but citizenship is much harder to escape without serious costs.","That fact gives political authority a special weight, because state decisions bind people who did not choose the arrangement.","Kraut replies that involuntary membership alone cannot rule out hierarchy, since children also do not choose their parents and yet parents may have legitimate authority."],`Treat this as an objection and reply, not as a conclusive refutation of democratic equality.\n\n${src('5')}`);
duo('What the hierarchy analogy does and does not show',{label:'It supports',text:'Unequal authority can be legitimate when it is tied to a role, a purpose, and genuine qualification.'},{label:'It does not settle',text:'Whether political power is so different from other authority that every citizen must share it equally.'},`Use this distinction to prevent the institutional examples from doing more work than they can.\n\n${src('4-5')}`);
question('A sharper test','Could a political system restrict power by competence without becoming an arbitrary rule by the privileged?','Kraut answers with a thought experiment designed to remove familiar barriers of wealth, birth, and inherited status.',`The following case tests whether qualification rather than social rank could determine political authority.\n\n${src('5-6')}`);

section('IV','What if political power had to be earned?',`Introduce Kraut’s hypothetical “New Kallipolis” one component at a time.\n\n${src('5-7')}`);
build('franchise','Kraut imagines a restricted franchise',["Imagine a community that does not allow citizens to vote immediately after childhood.","In this community, political participation begins at age fifty and ends at age sixty, a period Kraut chooses to represent mature but not declining adulthood.","During those ten years, only citizens who have completed a demanding public program may vote or hold office.","The franchise is restricted, but Kraut stipulates that the required education is available to every citizen and paid for by the state."],`Flag the age limits as part of the thought experiment, not a proposal that Kraut establishes from evidence.\n\n${src('5-6')}`);
build('education','The training is meant to create political judgment',["The program aims to improve cognitive ability, moral maturity, and political understanding rather than merely teach technical facts.","Its participants learn to recognize cognitive bias and to consider moral and political questions from an impartial perspective.","They study history, economics, the sciences, literature, and philosophy, while learning to listen seriously to disagreement.","Kraut insists this is not a technocratic elite: qualified rulers must know how to seek technical advice without becoming narrow specialists."],`Pause over the difference between expert knowledge and broad political judgment.\n\n${src('6')}`);
head('The imagined safeguards',[["Access","Every citizen may undertake the training; wealth and legal status are not barriers."],["Selection","Political authority depends on demonstrated competence, not family background or raw power."],["Checks","Legislative, executive, and judicial offices remain, with rulers accountable to other qualified citizens."]],`Kraut deliberately gives the imagined regime safeguards that Plato’s ideal city lacks.\n\n${src('6')}`);
question('The case-study question','If every citizen could become qualified, would restricting political power still be unfair?','The thought experiment separates unequal outcomes from unequal opportunity. It asks whether fairness requires equal power or an equal chance to earn it.',`Do not answer the question yet. The next section tests which political label fits the arrangement.\n\n${src('6-7')}`);

section('V','Is a qualified electorate still a democracy?',`Clarify why Kraut thinks the label matters less than the principle.\n\n${src('6-8')}`);
build('label','Open access does not make the regime democratic',["One might call the imagined system democratic because every citizen may pursue the training and eventually join the political class.","But only a small age group, and only those who have completed the program, exercise political power at any given time.","Kraut therefore calls it an aristocracy in the literal sense: rule by those best qualified for political activity.","The point is not that a small number is good by itself. The point is that qualification, not sheer number, is what matters."],`Stress the distinction between an elite of status and an elite of demonstrated political competence.\n\n${src('6-8')}`);
build('plato','The core of Plato’s criticism is rule by the unqualified',["Plato’s ideal city gives advanced political education only to those judged to have the relevant natural ability.","Kraut’s imagined society differs because it offers the opportunity for qualification to everyone.","Yet Kraut says the shared core remains: political authority should belong to those who are qualified to use it well.","If a society accepted that principle and restricted voting to the qualified, it would accept the central pressure of Plato’s critique even if it kept the word democracy."],`The conclusion is conditional: it follows if the qualified regime would actually govern better.\n\n${src('7-8')}`);
question('The principle beneath the label','Is the real democratic ideal “everyone rules,” or “everyone may become qualified to rule”?','Kraut thinks this is where Plato’s challenge becomes most direct: equal legal rights and equal political competence may pull apart.',`Use the question to transition from conceptual labels to practical feasibility.\n\n${src('7-8')}`);

section('VI','Is the qualified regime only a utopian fantasy?',`Present the comparative defense of democracy, then Kraut’s response about education.\n\n${src('8-9')}`);
build('comparative','Democracy is often defended as the least bad option',["A defender of democracy may concede that democratic decisions are sometimes poor while insisting that every alternative is worse.","On this view, democracy need not be perfect; it is justified if it is the least defective form of government that can actually exist.","Kraut grants that this comparative argument matters in practical politics.","But it fails if a more qualified and non-arbitrary form of rule is both possible and better governed than any democracy."],`This is a conditional challenge, not a claim that Kraut has already shown the alternative exists.\n\n${src('8')}`);
build('utopia','Kraut calls the alternative a realistic hope',["The imagined regime is not impossible merely because it is not currently real. People sometimes do acquire the wisdom needed for political judgment.","Kraut argues that political virtue cannot be mass-produced like an item in a factory, because it requires reflection and understanding.","Still, education in history, literature, philosophy, and related subjects can help people become more impartial and more alert to bias.","The aim is not to make perfect rulers after fifty years of education, but to make many people significantly better at political judgment than they otherwise would be."],`Kraut’s reply rests on an educational possibility claim: good teaching can improve political competence, even if it cannot guarantee virtue.\n\n${src('8-9')}`);
question('The feasibility test','How much improvement in political judgment would be enough to justify excluding those who did not pursue it?','Kraut’s argument needs more than the claim that education helps. It needs a judgment about whether the gain in decision quality can outweigh lost political equality.',`This question brings the argument to its most important democratic objection.\n\n${src('8-9')}`);

section('VII','Does fairness require political equality?',`Give the strongest fairness-based defense of democracy before presenting Kraut’s answer.\n\n${src('9-11')}`);
build('fairness','Democracy protects people against domination',["A democratic defender can agree that political competence matters while claiming that fairness matters more than the quality of particular decisions.","Without democratic institutions, ordinary people can be dominated by kings, wealthy elites, corporations, armies, churches, or other powerful groups.","Democracy lets people with little individual power combine their votes and become a political force able to resist domination.","For this defender, equal political power is valuable even when it sometimes produces less expert collective decisions."],`Let the fairness objection have its full force. Kraut agrees that democracy has this major merit.\n\n${src('9-10')}`);
build('reply','Kraut separates fairness from equal voting rights',["Kraut agrees that a system ruled by wealth, military force, or inherited social power is unfair because those features do not qualify anyone to rule.","But he argues that a qualified political class would be different if every citizen had a genuine opportunity to obtain the required education.","In New Kallipolis, some citizens rule because they chose and completed the path to political competence, while others choose to leave the task to them.","Kraut therefore denies that fairness always requires equal political power; it may require fair access to qualification instead."],`This is the essay’s decisive normative claim. Identify it clearly as Kraut’s reply to the democratic fairness argument.\n\n${src('10')}`);
head('Kraut’s final pressure on modern democracy',[["Existing limits","Modern democracies already limit direct public power through representation, constitutions, and infrequent elections."],["Why limits exist","Those limits are commonly defended by appeal to better collective decision-making, not as unfair exclusions."],["One further step","New Kallipolis would extend the same logic: power belongs only to those qualified to exercise it."]],`Kraut’s claim is not that modern democracies are pure rule by the people; they already mix democratic and anti-democratic elements.\n\n${src('10-11')}`);
diagnostic('When political equality and political competence conflict, which one should decide who rules?',`Do not resolve this question on the slide. It captures Kraut’s claim that Plato poses a serious challenge rather than an easily dismissed mistake.\n\n${src('1-11')}`);
refs([["Source material","Richard Kraut, “Plato against Democracy: A Defense.”"],["Primary work discussed","Plato, Republic, especially Books II, VI, VIII, and IX, as discussed by Kraut."],["Political comparison","Winston Churchill’s remark on democracy, quoted by Kraut as a familiar comparative defense."]],`The deck uses only the source material and the works explicitly discussed within it.\n\n${src('1-11')}`);

const deck=document.getElementById('deck');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function renderSlide(s,i){const article=document.createElement('article');article.className=`slide ${s.type}${s.type==='content'||s.type==='head'?' top':''}`;article.dataset.index=i;if(s.buildGroup)article.dataset.buildGroup=s.buildGroup;let html='<div class="slide-inner">';if(s.type==='cover')html+=`<h1 class="title">${esc(s.title)}</h1><p class="work">${esc(s.work)}</p><div class="course">${esc(s.course)}</div>`;if(s.type==='section')html+=`<div class="eyebrow">${esc(s.eyebrow)}</div><h2 class="title">${esc(s.title)}</h2><div class="rule"></div>`;if(s.type==='content')html+=`<h2 class="title">${esc(s.title)}</h2><div class="body">${s.paragraphs.map((p,j)=>`<p class="${j===s.paragraphs.length-1?'fresh':''}">${esc(p)}</p>`).join('')}</div>`;if(s.type==='question'||s.type==='diagnostic')html+=`<div class="eyebrow">${esc(s.eyebrow)}</div><p class="prompt">${esc(s.prompt)}</p>${s.context?`<p class="context">${esc(s.context)}</p>`:''}`;if(s.type==='duo')html+=`<h2 class="title">${esc(s.title)}</h2><div class="duo-grid">${[s.left,s.right].map(x=>`<div class="duo-col"><h3>${esc(x.label)}</h3><p>${esc(x.text)}</p></div>`).join('')}</div>`;if(s.type==='head')html+=`<h2 class="title">${esc(s.title)}</h2><div class="head-list">${s.items.map(x=>`<div class="head-item"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div>`;if(s.type==='refs')html+=`<h2 class="title">${esc(s.title)}</h2><div class="refs-list">${s.items.map(x=>`<div class="ref"><strong>${esc(x[0])}.</strong> ${esc(x[1])}</div>`).join('')}</div>`;article.innerHTML=html+'</div>';deck.appendChild(article);return article}
