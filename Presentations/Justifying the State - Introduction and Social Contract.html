  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body {

  #deck {

  .slide {

    content: attr(data-slide-number);

    right: 2.5vw;
    bottom: 2.2vh;

  .sequence-list { display: grid; gap: 0; margin-top: 2rem; border-top: 1px solid var(--line-strong); }

  .sequence-item .num { color: var(--paper); background: var(--red); width: 2.3rem; height: 2.3rem; display: grid; place-items: center; font: 600 0.75rem/1 "JetBrains Mono", monospace; }

  .sequence-item p { margin: 0; color: var(--muted); font-size: calc(clamp(1.3rem, 1.65vw, 1.8rem) * var(--fit)); line-height: 1.28; }

  .synthesis .slide-inner { width: min(1460px, 88vw); }
  .synthesis-band {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    margin-top: 2rem;
    border-top: 1px solid var(--line-strong);

  .synthesis-step { min-height: 18rem; padding: 1.5rem 1.35rem 1.6rem 0; border-right: 1px solid var(--line); }
  .synthesis-step + .synthesis-step { padding-left: 1.35rem; }
  .synthesis-step:last-child { border-right: 0; }
  .synthesis-step .num { color: var(--red); font: 600 0.77rem/1 "JetBrains Mono", monospace; }
  .synthesis-step h3 { margin: 1.1rem 0 0.9rem; font: 400 calc(clamp(1.55rem, 1.95vw, 2.15rem) * var(--fit))/1.1 "DM Serif Display", Georgia, serif; }
  .synthesis-step p { margin: 0; color: var(--muted); font-size: calc(clamp(1.12rem, 1.4vw, 1.55rem) * var(--fit)); line-height: 1.34; }

  .refs .slide-inner { width: min(1320px, 86vw); }

  @media (min-width: 2000px) {
    .standard .title, .compare .title, .rows .title, .image-copy .title, .sequence .title, .synthesis .title, .refs .title {
      font-size: calc(clamp(3.2rem, 6.5vw, 10rem) * var(--fit)) !important;
      line-height: 0.92 !important;
    }
    .bottom-line { font-size: calc(clamp(1.4rem, 2.4vw, 2.7rem) * var(--fit)); }
    .section .title { font-size: calc(clamp(4.8rem, 9vw, 12rem) * var(--fit)) !important; line-height: 0.88 !important; }
    .section .section-lead { font-size: calc(clamp(1.3rem, 2.15vw, 2.6rem) * var(--fit)); line-height: 1.38; }
    .compare-grid { margin-top: clamp(2rem, 2.4vw, 3rem); }
    .compare-col { padding-top: clamp(1.4rem, 2vw, 2.4rem); }
    .compare-col h3 { font-size: calc(clamp(2.2rem, 3.6vw, 4.4rem) * var(--fit)); }
    .compare-col p { font-size: calc(clamp(1.3rem, 1.85vw, 2.5rem) * var(--fit)); line-height: 1.34; }
    .compare-col .result { margin-top: clamp(1.4rem, 1.8vw, 2.2rem); padding-top: clamp(1.15rem, 1.6vw, 2rem); }
    .row p { font-size: calc(clamp(1.3rem, 1.85vw, 2.5rem) * var(--fit)); line-height: 1.26; }
    .rows .row-list { margin-top: clamp(2rem, 2.5vw, 3rem); }
    .rows .row { padding: clamp(1.6rem, 2.3vw, 2.3rem) 0; }
    .rows .row h3 { font-size: calc(clamp(1.8rem, 3vw, 3.2rem) * var(--fit)); line-height: 1.04; }
    .image-frame { height: min(72vh, 920px); }
    .image-copy .copy p { margin-top: clamp(1.4rem, 2vw, 2.2rem); font-size: calc(clamp(1.25rem, 1.85vw, 2.25rem) * var(--fit)); line-height: 1.28; }
    .sequence-list { margin-top: clamp(2rem, 2.5vw, 3rem); }
    .sequence-item { padding: clamp(1.4rem, 2.2vw, 2.5rem) 0; }
    .sequence-item h3 { font-size: calc(clamp(1.8rem, 3vw, 3.2rem) * var(--fit)); line-height: 1.04; }

    .synthesis-band { margin-top: clamp(2rem, 2.5vw, 3rem); }
    .synthesis-step { min-height: clamp(18rem, 25vh, 24rem); padding: clamp(1.5rem, 2vw, 2rem) 1.35rem clamp(1.6rem, 2.2vw, 2.2rem) 0; }
    .synthesis-step h3 { font-size: calc(clamp(1.8rem, 2.8vw, 3rem) * var(--fit)); line-height: 1.04; }
    .synthesis-step p { font-size: calc(clamp(1.3rem, 1.8vw, 2.25rem) * var(--fit)); line-height: 1.26; }

    .ref { padding: clamp(1.2rem, 1.8vw, 2rem) 0; }

  }

  #progress { position: fixed; left: 0; top: 0; z-index: 40; width: 0; height: 4px; background: var(--red); }

<script>
const source = (pages, extra = "") =>
  `[Sources]\nSource material, “01a Justifying the State - Intro,” source PDF, pp. ${pages}.` +
  (extra ? `\n${extra}` : "") + `\n[/Sources]`;

const slides = [
  {
    type: "cover",
    eyebrow: "Political Philosophy · Unit 2",
    title: "Justifying the State",
    work: "Political obligation and the social contract",
    course: "From a reason to want order to a reason to obey",
    image: "assets/justifying-state-cover.png",
    notes: `Introduce the unit’s change in focus. Earlier state-of-nature arguments asked what political society solves. This reading asks what could give a state the moral right to rule.\n\n${source("1–20", "Cover visual: original editorial illustration generated for this presentation.")}`
  },
  {
    type: "section",
    eyebrow: "Introduction",
    title: "The question after the state of nature",
    lead: "The earlier thought experiments supplied a baseline. This unit asks what could give political power moral authority.",
    notes: `Keep the transition explicit. The state of nature remains useful, but it now supports a different inquiry about legitimacy and political obligation.\n\n${source("1–3, 14", "Course context: State of Nature Wrapup presentation.")}`
  },
  {
    type: "compare",
    eyebrow: "Two methods",
    title: "State of nature and state justification",
    columns: [
      {
        label: "State of nature",
        heading: "A counterfactual baseline",
        text: "Remove political authority, and sometimes developed society, to identify the problems that appear and the rights that remain.",
        result: "Result: a standard for judging what political society secures or costs."
      },
      {
        label: "Justifying the state",
        heading: "A claim to moral authority",
        text: "Begin with an institution that legislates, taxes, punishes, and claims the right to direct everyone within its territory.",
        result: "Result: a reason for obedience and an account of when legitimacy can fail."
      }
    ],
    bottom: "A state may be necessary or beneficial without yet having a right to rule.",
    notes: `State-of-nature reasoning evaluates the alternative to government. State justification evaluates the authority of government. Locke connects the questions but does not treat them as identical.\n\n${source("1–2, 9, 14")}`
  },
  {
    type: "statement",
    eyebrow: "The central distinction",
    title: "Need and legitimacy answer different questions",
    statement: "Life without a state may be intolerable. Political authority still needs a <em>moral title</em> to rule each person.",

const esc = value => String(value ?? "").replace(/[&<>"']/g, character => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
}[character]));

const deck = document.getElementById("deck");
const overview = document.getElementById("overview");
const notes = document.getElementById("notes");
const overviewGrid = document.getElementById("overview-grid");
const notesBody = document.getElementById("notes-body");
const counter = document.getElementById("counter");
const progress = document.getElementById("progress");

const header = slide => `
  <p class="kicker">${esc(slide.eyebrow)}</p>
  <h2 class="title">${esc(slide.title)}</h2>
  <div class="title-rule"></div>`;

function renderSlide(slide, index) {
  const node = document.createElement("section");
  node.className = `slide ${slide.type}${slide.reverse ? " reverse" : ""}`;
  node.dataset.index = String(index);
  node.dataset.slideNumber = String(index + 1).padStart(2, "0");
  node.setAttribute("aria-label", slide.title || "Untitled slide");
  let html = `<div class="slide-inner">`;

  if (slide.type === "cover") {
    html += `<img class="cover-image" src="${esc(slide.image)}" alt="Editorial illustration of a citizen approaching a monumental civic building">
      <div class="cover-copy">
        <p class="eyebrow">${esc(slide.eyebrow)}</p>
        <h1 class="title">${esc(slide.title)}</h1>
        <p class="work">${esc(slide.work)}</p>
        <p class="course">${esc(slide.course)}</p>
      </div>`;
  }

  if (slide.type === "section") {
    html += `<p class="eyebrow">${esc(slide.eyebrow)}</p><h2 class="title">${esc(slide.title)}</h2><p class="section-lead">${esc(slide.lead)}</p>`;
  }

  if (slide.type === "compare") {
    html += header(slide);
    html += `<div class="compare-grid">
      <article class="compare-col"><span class="label">${esc(slide.columns[0].label)}</span><h3>${esc(slide.columns[0].heading)}</h3><p>${esc(slide.columns[0].text)}</p><p class="result">${esc(slide.columns[0].result)}</p></article>
      <div class="compare-divider"></div>
      <article class="compare-col"><span class="label">${esc(slide.columns[1].label)}</span><h3>${esc(slide.columns[1].heading)}</h3><p>${esc(slide.columns[1].text)}</p><p class="result">${esc(slide.columns[1].result)}</p></article>
    </div>`;
    if (slide.bottom) html += `<p class="bottom-line">${esc(slide.bottom)}</p>`;
  }

  if (slide.type === "statement") {
    html += `<div class="statement-layout"><div>${header(slide)}<p class="statement">${slide.statement}</p></div><aside class="side-note"><span class="label">${esc(slide.sideLabel)}</span><p>${esc(slide.sideText)}</p></aside></div>`;
  }

  if (slide.type === "rows") {
    html += header(slide);
    if (slide.lead) html += `<p class="lead">${esc(slide.lead)}</p>`;
    html += `<div class="row-list">${slide.rows.map((row, i) => `<div class="row"><span class="num">${String(i + 1).padStart(2, "0")}</span><h3>${esc(row[0])}</h3><p>${esc(row[1])}</p></div>`).join("")}</div>`;
  }

  if (slide.type === "image-copy") {
    html += `<div class="image-copy-grid">`;
    if (!slide.reverse) html += `<div class="copy">${header(slide)}${slide.paragraphs.map(text => `<p>${esc(text)}</p>`).join("")}<p class="bottom-line">${esc(slide.bottom)}</p></div><figure class="image-frame"><img src="${esc(slide.image)}" alt="Editorial illustration supporting ${esc(slide.title)}"></figure>`;
    else html += `<figure class="image-frame"><img src="${esc(slide.image)}" alt="Editorial illustration supporting ${esc(slide.title)}"></figure><div class="copy">${header(slide)}${slide.paragraphs.map(text => `<p>${esc(text)}</p>`).join("")}<p class="bottom-line">${esc(slide.bottom)}</p></div>`;
    html += `</div>`;
  }

  if (slide.type === "sequence") {
    html += header(slide);
    html += `<div class="sequence-list">${slide.items.map((item, i) => `<div class="sequence-item"><span class="num">${String(i + 1).padStart(2, "0")}</span><h3>${esc(item[0])}</h3><p>${esc(item[1])}</p></div>`).join("")}</div>`;
    if (slide.bottom) html += `<p class="bottom-line">${esc(slide.bottom)}</p>`;
  }

  if (slide.type === "synthesis") {
    html += header(slide);
    html += `<div class="synthesis-band">${slide.steps.map((step, i) => `<article class="synthesis-step"><span class="num">${String(i + 1).padStart(2, "0")}</span><h3>${esc(step[0])}</h3><p>${esc(step[1])}</p></article>`).join("")}</div><p class="bottom-line">${esc(slide.bottom)}</p>`;
  }

  if (slide.type === "refs") {
    html += header(slide);
    html += `<div class="refs-list">${slide.items.map(item => `<div class="ref"><strong>${esc(item[0])}</strong><span>${esc(item[1])}</span></div>`).join("")}</div>`;
  }

  html += `</div>`;
  node.innerHTML = html;
  deck.appendChild(node);
  return node;
}

const nodes = slides.map(renderSlide);
let current = 0;

function labelFor(slide) { return slide.title || slide.work || slide.eyebrow || "Slide"; }

slides.forEach((slide, index) => {
  const button = document.createElement("button");
  button.className = "overview-card";
  button.type = "button";
  button.innerHTML = `<span class="num">${String(index + 1).padStart(2, "0")} / ${slides.length}</span><span class="label">${esc(labelFor(slide))}</span>`;
  button.addEventListener("click", () => { closePanels(); show(index); });
  overviewGrid.appendChild(button);
});

const overviewCards = [...overviewGrid.children];

function show(index) {
  current = Math.max(0, Math.min(slides.length - 1, index));
  nodes.forEach((node, i) => node.classList.toggle("active", i === current));
  overviewCards.forEach((card, i) => card.classList.toggle("current", i === current));
  counter.textContent = `${current + 1} / ${slides.length}`;
  progress.style.width = `${((current + 1) / slides.length) * 100}%`;
  notesBody.textContent = slides[current].notes || "No notes for this slide.";
  document.title = `${current + 1}/${slides.length} · Justifying the State`;
}

window.go = show;
function closePanels() { overview.classList.remove("open"); notes.classList.remove("open"); }
function togglePanel(panel) { const open = !panel.classList.contains("open"); closePanels(); if (open) panel.classList.add("open"); }
document.querySelectorAll(".close").forEach(button => button.addEventListener("click", closePanels));
document.getElementById("fullscreen").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => {});
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") { closePanels(); return; }
  if (overview.classList.contains("open") || notes.classList.contains("open")) return;
  if (["ArrowRight", "ArrowDown", " ", "PageDown"].includes(event.key)) { event.preventDefault(); show(current + 1); }
  else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(event.key)) { event.preventDefault(); show(current - 1); }
  else if (event.key.toLowerCase() === "o") togglePanel(overview);
  else if (event.key.toLowerCase() === "n") togglePanel(notes);
  else if (event.key.toLowerCase() === "f") document.getElementById("fullscreen").click();
});

let touchX = 0;
document.addEventListener("touchstart", event => { touchX = event.changedTouches[0].screenX; }, { passive: true });
document.addEventListener("touchend", event => {
  const dx = event.changedTouches[0].screenX - touchX;
  if (Math.abs(dx) > 60) show(current + (dx < 0 ? 1 : -1));
}, { passive: true });

function fits(node) {
  const inner = node.querySelector(".slide-inner");
  return inner && inner.scrollHeight <= node.clientHeight * 0.84 && inner.scrollWidth <= node.clientWidth * 0.94;
}
function fitNode(node) {
  let fit = 1;
  node.classList.add("measuring");
  node.style.setProperty("--fit", fit);
  while (fit > 0.74 && !fits(node)) {
    fit -= 0.01;
    node.style.setProperty("--fit", fit.toFixed(3));
  }
  node.classList.remove("measuring");
}
function fitAll() { nodes.forEach(node => { node.style.setProperty("--fit", 1); fitNode(node); }); show(current); }
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitAll, 150); });
if (document.fonts?.ready) document.fonts.ready.then(fitAll); else fitAll();
show(0);
</script>
