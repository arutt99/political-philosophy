<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A lecture presentation on utilitarianism as a justification of the state, including indirect utilitarianism, the scapegoat objection, and the problem of rights.">
  <link rel="icon" href="data:,">
  <title>Justifying the State: Utilitarianism</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="presentation-polish.css">
  <script src="presentation-polish.js" defer></script>
  <style>
    :root {
      --bg: #151918;
      --bg-deep: #0e1211;
      --surface: #202624;
      --paper: #f0eadc;
      --ink: #18201e;
      --muted: #aeb8ad;
      --muted-dark: #6f7c73;
      --lime: #d8ef79;
      --ember: #ce7756;
      --line: rgba(240, 234, 220, .17);
      --line-strong: rgba(216, 239, 121, .55);
      --fit: 1;
      --text: var(--paper);
      --preflight-bg: var(--bg);
      --preflight-text: var(--paper);
      --preflight-muted: var(--muted);
      --preflight-accent: var(--lime);
      --preflight-bright: var(--paper);
      --preflight-line: var(--line);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--paper);
    }

    body {
      font-family: "Space Grotesk", Inter, system-ui, sans-serif;
    }

    button { font: inherit; }

    #deck {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 92% 4%, rgba(216, 239, 121, .09), transparent 25%),
        radial-gradient(circle at 5% 96%, rgba(206, 119, 86, .10), transparent 28%),
        var(--bg);
    }

    #deck::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .38;
      background:
        linear-gradient(90deg, rgba(240, 234, 220, .05) 1px, transparent 1px),
        linear-gradient(rgba(240, 234, 220, .035) 1px, transparent 1px);
      background-size: 8vw 8vw;
      mask-image: linear-gradient(135deg, black, transparent 70%);
    }

    #deck::after {
      content: "";
      position: absolute;
      right: -13vw;
      bottom: -19vw;
      width: 45vw;
      height: 45vw;
      border: 1px solid rgba(216, 239, 121, .22);
      border-radius: 50%;
      box-shadow: 0 0 0 5vw rgba(216, 239, 121, .035), 0 0 0 10vw rgba(206, 119, 86, .025);
      pointer-events: none;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 7.2vh 7.4vw 8.8vh;
      overflow: hidden;
      text-align: left;
    }

    .slide.active,
    .slide.measuring { display: flex; }

    .slide.measuring {
      visibility: hidden;
      pointer-events: none;
    }

    .slide.top {
      align-items: flex-start;
      padding-top: 7.8vh;
    }

    .slide-inner {
      position: relative;
      z-index: 1;
      width: min(1180px, 88vw);
      max-height: 82vh;
      margin: auto;
      transform-origin: top center;
    }

    .eyebrow,
    .course,
    .slide-meta,
    .section-index,
    .column-label,
    .list-number,
    .timeline-year,
    #nav-hint,
    #counter,
    #presentation-controls button,
    .panel-head button {
      font-family: "IBM Plex Mono", Consolas, monospace;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 calc(1rem * var(--fit));
      color: var(--lime);
      font-size: calc(clamp(12px, .9vw, 16px) * var(--fit));
      font-weight: 600;
      line-height: 1.25;
    }

    .title {
      margin: 0;
      color: var(--paper);
      font-family: "DM Serif Display", Georgia, serif;
      font-size: calc(clamp(42px, 4.5vw, 72px) * var(--fit));
      font-weight: 400;
      letter-spacing: -.035em;
      line-height: 1.03;
    }

    .cover {
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      background:
        linear-gradient(90deg, rgba(14, 18, 17, .98) 0 53%, rgba(14, 18, 17, .67) 74%, rgba(14, 18, 17, .2)),
        radial-gradient(circle at 82% 42%, rgba(216, 239, 121, .18), transparent 18%),
        var(--bg-deep);
    }

    .cover .slide-inner {
      width: 100vw;
      max-width: none;
      height: 80vh;
      max-height: 80vh;
      margin: 0;
      padding: 13vh 11vw 10vh 12vw;
    }

    .cover .slide-inner::before {
      content: "02 / JUSTIFYING THE STATE";
      position: absolute;
      top: 6.5vh;
      left: 12vw;
      color: var(--lime);
      font: 600 clamp(11px, .8vw, 15px)/1.2 "IBM Plex Mono", monospace;
      letter-spacing: .14em;
    }

    .cover-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(260px, .95fr);
      gap: 5vw;
      align-items: center;
      height: 100%;
    }

    .cover-copy { max-width: 760px; }

    .cover .eyebrow { color: var(--ember); }

    .cover .title {
      max-width: 9.5ch;
      font-size: calc(clamp(60px, 8.1vw, 124px) * var(--fit));
      line-height: .91;
    }

    .cover .work {
      max-width: 27ch;
      margin: calc(1.5rem * var(--fit)) 0 0;
      color: var(--muted);
      font-size: calc(clamp(20px, 1.9vw, 30px) * var(--fit));
      line-height: 1.24;
    }

    .cover .course {
      display: inline-block;
      margin-top: calc(2.5rem * var(--fit));
      padding: .6rem .75rem;
      border: 1px solid rgba(216, 239, 121, .45);
      color: var(--lime);
      font-size: calc(clamp(11px, .78vw, 14px) * var(--fit));
      line-height: 1.25;
    }

    .cover-mark {
      display: grid;
      min-height: 46vh;
      place-items: center;
      border-left: 1px solid rgba(216, 239, 121, .4);
      color: var(--lime);
      font-family: "DM Serif Display", Georgia, serif;
      font-size: calc(clamp(170px, 27vw, 420px) * var(--fit));
      line-height: .7;
      opacity: .92;
    }

    .cover-mark span {
      display: block;
      margin-top: .25em;
      color: var(--muted);
      font: 600 calc(clamp(11px, .85vw, 15px) * var(--fit))/1.4 "IBM Plex Mono", monospace;
      letter-spacing: .14em;
      text-align: center;
    }

    .section .slide-inner {
      width: min(1020px, 88vw);
      padding: 1.2rem 0 1.4rem 2.3rem;
      border-left: 4px solid var(--lime);
    }

    .section-index {
      margin: 0 0 1.2rem;
      color: var(--ember);
      font-size: calc(clamp(14px, 1vw, 17px) * var(--fit));
      line-height: 1.2;
    }

    .section .title {
      max-width: 13ch;
      font-size: calc(clamp(54px, 6.4vw, 94px) * var(--fit));
      line-height: .96;
    }

    .section-rule {
      width: 8rem;
      height: 3px;
      margin-top: 1.9rem;
      background: linear-gradient(90deg, var(--lime), transparent);
    }

    .content .slide-inner,
    .statement .slide-inner,
    .split .slide-inner,
    .list .slide-inner,
    .argument .slide-inner,
    .timeline-slide .slide-inner,
    .closing .slide-inner,
    .refs .slide-inner {
      width: min(1140px, 88vw);
      padding: .9rem 0 1.2rem;
    }

    .content .title,
    .statement .title,
    .split .title,
    .list .title,
    .argument .title,
    .timeline-slide .title,
    .closing .title,
    .refs .title {
      max-width: 19ch;
      padding-bottom: .75rem;
      border-bottom: 1px solid var(--line);
    }

    .lead {
      max-width: 36ch;
      margin: 1.4rem 0 0;
      color: var(--paper);
      font-family: "DM Serif Display", Georgia, serif;
      font-size: calc(clamp(28px, 2.75vw, 42px) * var(--fit));
      line-height: 1.18;
    }

    .support {
      max-width: 62ch;
      margin: 1.25rem 0 0;
      color: var(--muted);
      font-size: calc(clamp(16px, 1.35vw, 21px) * var(--fit));
      line-height: 1.48;
    }

    .source-line {
      margin: 1.5rem 0 0;
      color: var(--muted-dark);
      font: 500 calc(clamp(11px, .78vw, 14px) * var(--fit))/1.4 "IBM Plex Mono", monospace;
      letter-spacing: .04em;
    }

    .statement .statement-band {
      max-width: 900px;
      margin-top: 2rem;
      padding: 1.35rem 1.5rem 1.45rem;
      border-left: 3px solid var(--lime);
      background: linear-gradient(90deg, rgba(216, 239, 121, .11), transparent 80%);
    }

    .statement-band p {
      margin: 0;
      color: var(--paper);
      font-size: calc(clamp(20px, 1.75vw, 28px) * var(--fit));
      line-height: 1.36;
    }

    .statement-band p + p {
      margin-top: .75rem;
      color: var(--muted);
      font-size: calc(clamp(15px, 1.15vw, 18px) * var(--fit));
    }

    .split-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4.2rem;
      margin-top: 2rem;
    }

    .split-col {
      min-width: 0;
      padding-top: 1rem;
      border-top: 3px solid var(--lime);
    }

    .split-col:nth-child(2) { border-top-color: var(--ember); }

    .column-label {
      display: block;
      margin-bottom: .8rem;
      color: var(--lime);
      font-size: calc(clamp(12px, .82vw, 15px) * var(--fit));
      line-height: 1.2;
    }

    .split-col:nth-child(2) .column-label { color: var(--ember); }

    .split-col h3 {
      margin: 0;
      color: var(--paper);
      font-family: "DM Serif Display", Georgia, serif;
      font-size: calc(clamp(28px, 2.7vw, 42px) * var(--fit));
      font-weight: 400;
      line-height: 1.06;
    }

    .split-col p {
      margin: 1rem 0 0;
      color: var(--muted);
      font-size: calc(clamp(17px, 1.45vw, 22px) * var(--fit));
      line-height: 1.42;
    }

    .split-col .quote {
      color: var(--paper);
      font-family: "DM Serif Display", Georgia, serif;
      font-size: calc(clamp(23px, 2.1vw, 32px) * var(--fit));
      line-height: 1.25;
    }

    .plain-list {
      display: grid;
      gap: 0;
      max-width: 1020px;
      margin: 1.65rem 0 0;
    }

    .plain-list li {
      display: grid;
      grid-template-columns: 3.1rem minmax(0, 1fr);
      gap: 1rem;
      align-items: start;
      padding: 1rem 0;
      border-top: 1px solid var(--line);
      list-style: none;
    }

    .plain-list li:last-child { border-bottom: 1px solid var(--line); }

    .list-number {
      color: var(--lime);
      font-size: calc(clamp(13px, .85vw, 16px) * var(--fit));
      line-height: 1.35;
    }

    .list-copy strong {
      display: block;
      color: var(--paper);
      font-family: "DM Serif Display", Georgia, serif;
      font-size: calc(clamp(25px, 2.1vw, 33px) * var(--fit));
      font-weight: 400;
      line-height: 1.12;
    }

    .list-copy span {
      display: block;
      margin-top: .35rem;
      color: var(--muted);
      font-size: calc(clamp(16px, 1.3vw, 20px) * var(--fit));
      line-height: 1.42;
    }

    .argument .plain-list li {
      grid-template-columns: 3.6rem minmax(0, 1fr);
      padding: .9rem 0;
    }

    .argument .plain-list li:last-child {
      border-top: 2px solid var(--lime);
      border-bottom: 0;
    }

    .argument .plain-list li:last-child .list-number { color: var(--ember); }

    .argument .plain-list li:last-child .list-copy strong { color: var(--lime); }

    .chain {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.6rem;
      margin-top: 2.4rem;
    }

    .chain-step {
      position: relative;
      min-height: 9.5rem;
      padding: 1.1rem 1.1rem 1.2rem;
      border: 1px solid var(--line);
      border-top: 3px solid var(--lime);
      background: rgba(32, 38, 36, .72);
    }

    .chain-step:not(:last-child)::after {
      content: "+";
      position: absolute;
      top: 2.3rem;
      right: -1.4rem;
      color: var(--ember);
      font: 400 1.5rem/1 "IBM Plex Mono", monospace;
    }

    .chain-step .step-number {
      color: var(--ember);
      font: 600 calc(clamp(12px, .75vw, 14px) * var(--fit))/1.2 "IBM Plex Mono", monospace;
      letter-spacing: .12em;
    }

    .chain-step h3 {
      margin: .8rem 0 0;
      color: var(--paper);
      font-family: "DM Serif Display", Georgia, serif;
      font-size: calc(clamp(23px, 2vw, 31px) * var(--fit));
      font-weight: 400;
      line-height: 1.1;
    }

    .chain-step p {
      margin: .55rem 0 0;
      color: var(--muted);
      font-size: calc(clamp(15px, 1.15vw, 18px) * var(--fit));
      line-height: 1.4;
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.3rem;
      margin-top: 2rem;
      border-top: 1px solid var(--line);
    }

    .timeline-item {
      min-height: 10rem;
      padding: 1.1rem 1rem 0 0;
      border-top: 3px solid var(--ember);
      margin-top: -1px;
    }

    .timeline-year {
      color: var(--lime);
      font-size: calc(clamp(13px, .9vw, 16px) * var(--fit));
      line-height: 1.2;
    }

    .timeline-item h3 {
      margin: .75rem 0 0;
      color: var(--paper);
      font-family: "DM Serif Display", Georgia, serif;
      font-size: calc(clamp(26px, 2.3vw, 35px) * var(--fit));
      font-weight: 400;
      line-height: 1.05;
    }

    .timeline-item p {
      margin: .55rem 0 0;
      color: var(--muted);
      font-size: calc(clamp(15px, 1.18vw, 19px) * var(--fit));
      line-height: 1.4;
    }

    .closing .slide-inner {
      padding: 1.6rem 2.2rem 1.9rem;
      border-left: 4px solid var(--lime);
      background: linear-gradient(90deg, rgba(216, 239, 121, .12), transparent 76%);
    }

    .closing .title { max-width: 15ch; }

    .closing .closing-lines {
      display: grid;
      gap: .75rem;
      max-width: 820px;
      margin-top: 1.7rem;
    }

    .closing-lines p {
      margin: 0;
      padding: .75rem 0 .8rem 1rem;
      border-left: 1px solid var(--line-strong);
      color: var(--muted);
      font-size: calc(clamp(18px, 1.55vw, 24px) * var(--fit));
      line-height: 1.38;
    }

    .closing-lines p strong { color: var(--paper); }

    .refs-list {
      display: grid;
      gap: 0;
      max-width: 1000px;
      margin-top: 1.6rem;
    }

    .reference {
      padding: .9rem 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: calc(clamp(15px, 1.15vw, 18px) * var(--fit));
      line-height: 1.4;
    }

    .reference strong {
      color: var(--paper);
      font-weight: 600;
    }

    .arc .slide-inner {
      width: min(1140px, 88vw);
      padding: .9rem 0 1.2rem;
    }

    .arc .title {
      max-width: 18ch;
      padding-bottom: .75rem;
      border-bottom: 1px solid var(--line);
    }

    .slide[data-build-group="comparison"] .title { max-width: 26ch; }

    .arc-list {
      display: grid;
      gap: 0;
      max-width: 1050px;
      margin-top: 1.4rem;
    }

    .arc-row {
      display: grid;
      grid-template-columns: 7.5rem minmax(0, 1fr);
      gap: 1.35rem;
      align-items: start;
      min-height: 6.2rem;
      padding: .9rem 0 1rem;
      border-top: 1px solid var(--line);
      opacity: 0;
      visibility: hidden;
    }

    .arc-row:last-child { border-bottom: 1px solid var(--line); }

    .arc-row.is-visible {
      opacity: 1;
      visibility: visible;
    }

    .arc-label {
      color: var(--lime);
      font: 600 calc(clamp(11px, .8vw, 14px) * var(--fit))/1.25 "IBM Plex Mono", monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .arc-row:nth-child(4n) .arc-label { color: var(--ember); }

    .arc-row h3 {
      margin: 0;
      color: var(--paper);
      font-family: "DM Serif Display", Georgia, serif;
      font-size: calc(clamp(25px, 2.15vw, 34px) * var(--fit));
      font-weight: 400;
      line-height: 1.08;
    }

    .arc-row p {
      max-width: 68ch;
      margin: .35rem 0 0;
      color: var(--muted);
      font-size: calc(clamp(16px, 1.25vw, 20px) * var(--fit));
      line-height: 1.38;
    }

    #progress {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 30;
      width: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--lime), var(--ember));
    }

    #nav-hint,
    #counter {
      position: fixed;
      bottom: 18px;
      z-index: 30;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
    }

    #nav-hint { left: 24px; }
    #counter { right: 24px; }

    #presentation-controls {
      position: fixed;
      top: 18px;
      right: 22px;
      z-index: 30;
      display: flex;
      gap: .45rem;
    }

    #presentation-controls button {
      padding: 8px 10px;
      border: 1px solid rgba(240, 234, 220, .24);
      border-radius: 2px;
      color: var(--paper);
      background: rgba(21, 25, 24, .7);
      cursor: pointer;
      font-size: 10px;
      line-height: 1;
    }

    #presentation-controls button:hover,
    #presentation-controls button:focus-visible {
      border-color: var(--lime);
      color: var(--lime);
      outline: none;
    }

    .panel {
      position: fixed;
      inset: 4vh 4vw;
      z-index: 60;
      display: none;
      overflow: auto;
      border: 1px solid rgba(240, 234, 220, .2);
      background: rgba(21, 25, 24, .985);
    }

    .panel.open { display: block; }

    .panel-head {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 22px;
      border-bottom: 1px solid var(--line);
      background: #202624;
    }

    .panel-head h2 {
      margin: 0;
      color: var(--lime);
      font: 600 13px/1 "IBM Plex Mono", monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .panel-head button {
      padding: 7px 10px;
      border: 1px solid rgba(240, 234, 220, .2);
      color: var(--paper);
      background: transparent;
      cursor: pointer;
      font-size: 10px;
    }

    .panel-head button:hover,
    .panel-head button:focus-visible {
      border-color: var(--lime);
      color: var(--lime);
      outline: none;
    }

    #overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 11px;
      padding: 20px;
    }

    .overview-card {
      min-height: 118px;
      padding: 15px;
      border: 1px solid var(--line);
      color: var(--paper);
      background: rgba(32, 38, 36, .8);
      cursor: pointer;
      text-align: left;
    }

    .overview-card:hover,
    .overview-card.current {
      border-color: var(--lime);
      box-shadow: 4px 4px 0 rgba(206, 119, 86, .16);
    }

    .overview-card .num {
      display: block;
      margin-bottom: 11px;
      color: var(--lime);
      font: 500 10px/1.3 "IBM Plex Mono", monospace;
    }

    .overview-card .label {
      font: 400 20px/1.1 "DM Serif Display", Georgia, serif;
    }

    #notes-body {
      max-width: 900px;
      padding: 28px 34px;
      white-space: pre-wrap;
      color: var(--paper);
      font: 400 17px/1.62 "Space Grotesk", Inter, sans-serif;
    }

    @media (max-width: 760px) {
      .slide { padding: 9vh 8vw 10vh; }
      .slide.top { padding-top: 8.8vh; }
      .slide.arc { padding-top: 5.6vh; padding-bottom: 7vh; }
      .slide-inner { width: 84vw; }
      .cover .slide-inner { padding: 13vh 8vw 10vh; }
      .cover .slide-inner::before { left: 8vw; }
      .cover-grid { grid-template-columns: 1fr; gap: 2rem; }
      .cover .title { max-width: 11ch; }
      .cover-mark { display: none; }
      .split-grid,
      .chain,
      .timeline { grid-template-columns: 1fr; gap: 1.35rem; }
      .chain-step { min-height: auto; }
      .timeline-item { min-height: auto; padding-top: .85rem; }
      .arc .slide-inner { width: 84vw; padding: .2rem 0 .5rem; }
      .arc .eyebrow { margin-bottom: .45rem; }
      .arc .title { max-width: 15ch; padding-bottom: .45rem; font-size: calc(clamp(30px, 8vw, 44px) * var(--fit)); line-height: .98; }
      .slide[data-build-group="comparison"] .title { max-width: 15ch; }
      .arc-list { margin-top: .65rem; }
      .arc-row { grid-template-columns: 1fr; gap: .25rem; min-height: 3.25rem; padding: .48rem 0 .55rem; }
      .arc-label { font-size: calc(clamp(9px, 2.4vw, 11px) * var(--fit)); }
      .arc-row h3 { font-size: calc(clamp(20px, 5.5vw, 25px) * var(--fit)); line-height: 1.05; }
      .arc-row p { margin-top: .18rem; font-size: calc(clamp(13px, 3.75vw, 16px) * var(--fit)); line-height: 1.24; }
      .chain-step:not(:last-child)::after { display: none; }
      .split-col p { max-width: 55ch; }
      #nav-hint { display: none; }
      #presentation-controls { top: 12px; right: 12px; }
      #presentation-controls button { padding: 7px 8px; }
      .section .slide-inner,
      .closing .slide-inner { padding-left: 1.35rem; }
    }
  </style>
</head>
<body data-library-view="political-philosophy">
  <div id="deck" aria-live="polite"></div>
  <div id="progress"></div>
  <div id="nav-hint">Arrows / Space · O overview · N notes · F fullscreen</div>
  <div id="counter">1 / 1</div>

  <div id="presentation-controls" aria-label="Presentation controls">
    <button id="overview-button" type="button">Overview</button>
    <button id="notes-button" type="button">Notes</button>
    <button id="fullscreen-button" type="button">Fullscreen</button>
  </div>

  <section id="overview" class="panel" aria-label="Slide overview">
    <div class="panel-head"><h2>Overview</h2><button class="close" type="button">Close</button></div>
    <div id="overview-grid"></div>
  </section>

  <aside id="notes" class="panel" aria-label="Speaker notes">
    <div class="panel-head"><h2>Speaker notes</h2><button class="close" type="button">Close</button></div>
    <div id="notes-body"></div>
  </aside>

  <script>
    const slides = [];
    const sourceNote = (pages, extra = '') => '[Sources]\n"Justifying the State - Utilitarianism," pp. ' + pages + (extra ? '\n' + extra : '') + '\n[/Sources]';
    const note = (text, pages, extra = '') => text + '\n\n' + sourceNote(pages, extra);
    const add = slide => slides.push(slide);

    const cover = (title, work, course, notes) => add({ type: 'cover', title, work, course, notes });
    const section = (index, title, notes) => add({ type: 'section', index, title, notes });
    const arc = (group, index, title, rows, teachingNote, pages, extra = '') => {
      rows.forEach((row, visible) => {
        add({
          type: 'arc',
          buildGroup: group,
          index,
          title,
          rows,
          visible: visible + 1,
          notes: note(
            teachingNote + '\n\nStage ' + (visible + 1) + ' of ' + rows.length + ': ' + row.label + '. Reveal only this next row, then pause.',
            pages,
            extra
          )
        });
      });
    };
    const refs = (items, notes) => add({ type: 'refs', title: 'References', items, notes });

    cover(
      'Justifying the State: Utilitarianism',
      'Happiness, rules, and the limits of political obligation',
      'Political Philosophy · Module 2',
      note(
        'Open with the conditional test for political authority. The state is justified only when obedience produces better consequences than the available alternatives.',
        '1'
      )
    );

    section(
      'I / THE STANDARD',
      'Utility and political obligation',
      note(
        'This section establishes the standard before applying it to laws and institutions.',
        '1'
      )
    );

    arc(
      'utility',
      'I / THE STANDARD',
      'Utility is a rule for choosing among outcomes',
      [
        { label: 'WHAT IT IS', title: 'Maximize total utility', body: 'The morally correct action creates the highest possible total sum of utility.' },
        { label: 'WHAT IT ESTABLISHES', title: 'Consequences do the judging', body: 'Compare what each available action would produce. Motive and inherited labels do not settle the moral question.' },
        { label: 'STRONGEST RATIONALE', title: 'Happiness supplies a common target', body: 'Utility can mean happiness, pleasure, or desire satisfaction. Happiness provides a clear shorthand for comparing outcomes.' },
        { label: 'OBJECTION', title: 'The test needs a scale', body: 'Maximization requires comparisons across outcomes, people, and the size of their differences.' }
      ],
      'Establish the basic moral standard, then leave the measurement problem visible. The next arc explains why comparison is difficult without treating that difficulty as a reason to skip the theory.',
      '1'
    );

    arc(
      'comparison',
      'I / THE STANDARD',
      'Interpersonal comparison is the theory\'s measurement problem',
      [
        { label: 'WHAT IT IS', title: 'Compare people and differences', body: 'The theory must compare one person\'s happiness with another\'s and judge how much more or less happiness each has.' },
        { label: 'WHAT IT ESTABLISHES', title: 'A ranking needs more than preference', body: 'To choose the best action, a utilitarian needs more than the fact that someone prefers one outcome. The size of the difference matters.' },
        { label: 'STRONGEST RATIONALE', title: 'Everyday comparisons still guide us', body: 'Observation and conversation let us recognize that some people live in misery while others lead wonderfully enjoyable lives.' },
        { label: 'OBJECTION', title: 'No accepted scale closes the gap', body: 'No universally accepted scale settles the problem. The utilitarian still owes an account of how total outcomes can be ranked.' },
        { label: 'CONSEQUENCE', title: 'The verdict becomes method-dependent', body: 'Until comparison is defended, the ranking of outcomes rests on a contested measurement practice rather than a settled moral test.' }
      ],
      'Keep the objection precise. The problem is not that comparison is impossible in every ordinary judgment; it is that utilitarianism needs a defensible method for ranking total outcomes.',
      '1-2'
    );

    section(
      'II / THE INSTITUTION',
      'Direct and rule utilitarianism',
      note(
        'The political test becomes difficult when direct calculation threatens the legal stability that happiness depends on.',
        '2-3'
      )
    );

    arc(
      'political',
      'II / THE INSTITUTION',
      'Political obligation is a comparison of consequences',
      [
        { label: 'WHAT IT IS', title: 'Obedience is conditional', body: 'Bentham says subjects should obey while the probable mischiefs of obedience are less than the probable mischiefs of resistance.' },
        { label: 'WHAT IT ESTABLISHES', title: 'The state must beat resistance', body: 'A state can demand obedience only when obeying it produces more happiness than resisting, disobeying, or living without it.' },
        { label: 'STRONGEST EXAMPLE', title: 'A book theft makes the problem concrete', body: 'If stealing a book makes one person happier and creates no noticeable loss or harm, direct calculation appears to require the theft.' },
        { label: 'OBJECTION', title: 'Direct calculation can authorize law-breaking', body: 'A law becomes a temporary suggestion whenever a local happiness gain seems larger than the immediate cost of obeying it.' },
        { label: 'CONSEQUENCE', title: 'Individual gains can damage the legal order', body: 'If everyone reasons this way, possession becomes insecure and people lose reasons to produce, trust, and cooperate.' }
      ],
      'Use the bookshop case to move from Bentham\'s conditional test to the problem of direct calculation. The point is not that theft is harmless in general; the point is that the immediate balance can make a violation look required.',
      '1-3',
      'Primary work quoted: Jeremy Bentham, A Fragment on Government (1776).'
    );

    arc(
      'rules',
      'II / THE INSTITUTION',
      'Rule utilitarianism makes stability part of the calculation',
      [
        { label: 'WHAT IT IS', title: 'Evaluate rules as systems', body: 'Indirect utilitarianism asks which system of rules would create the greatest happiness if people generally followed it.' },
        { label: 'WHAT IT ESTABLISHES', title: 'Ordinary obedience can maximize happiness', body: 'People follow non-utilitarian rules in everyday cases because stable rules protect the security that happiness requires.' },
        { label: 'STRONGEST RATIONALE', title: 'Security solves the prisoner\'s dilemma', body: 'A shared rule against taking whenever the local gain looks larger protects possession, production, and trust.' },
        { label: 'STRONGEST EXAMPLE', title: 'A direct chase for happiness can defeat itself', body: 'A person may find happiness as a side effect of an ambition, hobby, or friendship rather than by trying to feel happy at every moment.' },
        { label: 'POLITICAL CONSEQUENCE', title: 'Pass, obey, and replace laws', body: 'Pass laws that increase happiness, obey them except to avoid disaster, and repeal laws that fail to serve that function.' }
      ],
      'Keep the levels distinct. Utility still justifies the system, but individual conduct follows the system instead of recalculating every act from scratch.',
      '3-4'
    );

    section(
      'III / THE ARGUMENT',
      'The utilitarian case for the state',
      note(
        'Now state the justification of the state as a formal argument, then identify where its moral vulnerability lies.',
        '4-5'
      )
    );

    arc(
      'state',
      'III / THE ARGUMENT',
      'The state is justified when it beats feasible alternatives',
      [
        { label: 'WHAT IT IS', title: 'A comparative political claim', body: 'The state is justified if and only if it contributes more to human happiness than any feasible competing arrangement.' },
        { label: 'WHAT IT ESTABLISHES', title: 'Law becomes the state\'s political function', body: 'The state provides and enforces the body of rules that makes stable cooperation possible.' },
        { label: 'STRONGEST RATIONALE', title: 'Security and cooperation beat the state of nature', body: 'If a state greatly outperforms the state of nature in security and cooperation, it wins the happiness comparison.' },
        { label: 'FORMAL CONSEQUENCE', title: 'The best society has a state', body: 'If happiness is the standard and the state is the better arrangement, the morally best society is one with a state.' },
        { label: 'OBJECTION', title: 'The conclusion depends on utility', body: 'The inference can be valid while the principle that defines the best society still permits grave injustice.' }
      ],
      'Separate the state comparison from the moral premise. The argument grants the state\'s practical advantage for now and turns the next section toward the consequences of maximizing happiness.',
      '4-5'
    );

    section(
      'IV / THE MORAL RISK',
      'The scapegoat objection',
      note(
        'Test the principle of utility with a case where public reassurance may be purchased by punishing an innocent person.',
        '5-6'
      )
    );

    arc(
      'scapegoat',
      'IV / THE MORAL RISK',
      'The scapegoat objection tests the principle of utility',
      [
        { label: 'WHAT IT IS', title: 'A total balance can excuse grave injustice', body: 'Critics argue that utilitarian morality permits or requires injustice when the injustice increases general happiness.' },
        { label: 'WHAT IT ESTABLISHES', title: 'Public reassurance can outweigh one person\'s suffering', body: 'After a bombing, vengeance, confidence, and relief may count as benefits even when an innocent suspect bears the cost.' },
        { label: 'STRONGEST EXAMPLE', title: 'An innocent suspect can satisfy the demand for vengeance', body: 'If plausible suspects were arrested and sentenced, the public might feel safer even though the suspects were innocent.' },
        { label: 'CONCRETE CASE', title: 'The Birmingham Six exposed the pressure', body: 'A 1975 conviction, Lord Denning\'s 1980 warning about an appalling vista, and the 1991 quashing of the convictions make the institutional temptation concrete.' },
        { label: 'CONSEQUENCE', title: 'A calculation can treat a person as a means', body: 'The innocent person\'s suffering becomes a cost that can be traded against the comfort, confidence, or security of everyone else.' }
      ],
      'Let the objection develop one stage at a time. The historical case illustrates the pressure described by the objection; it does not by itself settle every fact about the episode.',
      '5-7',
      'Judgment discussed: Lord Denning, Court of Appeal judgment (1980).'
    );

    arc(
      'rights',
      'IV / THE MORAL RISK',
      'Rule utilitarianism can defend a right against victimization',
      [
        { label: 'WHAT IT IS', title: 'Protect the innocent through a rule', body: 'A society in which innocent people can be victimized and kept in prison gives everyone reason to fear becoming the next scapegoat.' },
        { label: 'WHAT IT ESTABLISHES', title: 'Public knowledge can make injustice costly', body: 'If people know that the system permits scapegoating, insecurity can depress general happiness even when each individual case appears useful.' },
        { label: 'STRONGEST RATIONALE', title: 'Release can improve long-term security', body: 'Releasing the Birmingham Six may discredit the legal system immediately while producing better confession procedures and greater security over time.' },
        { label: 'OBJECTION', title: 'Secrecy removes the insecurity', body: 'If victimization remains efficient and secret, the public may never experience the fear that makes the rule useful.' },
        { label: 'CONSEQUENCE', title: 'The right still depends on the balance', body: 'A utilitarian right against victimization may disappear whenever violating it appears to maximize happiness.' }
      ],
      'Present the rule-based defense in full before pressing it. The rescue is strongest when rights protect everyone over time, and weakest when secrecy prevents the expected social cost.',
      '7-8'
    );

    section(
      'V / THE LIMIT',
      'Utility, rights, and moral limits',
      note(
        'The final issue is not whether utilitarianism can improve its arithmetic. It is whether a consequence-based theory can explain an unconditional moral protection.',
        '8'
      )
    );

    arc(
      'limit',
      'V / THE LIMIT',
      'Utility-based rights may not be rights',
      [
        { label: 'WHAT IT IS', title: 'Some protections should hold regardless', body: 'Opponents argue that no one should be victimized, whatever the benefits in general happiness.' },
        { label: 'WHAT IT ESTABLISHES', title: 'Release can be required because victimization is wrong', body: 'The Birmingham Six should be released even if release did not maximize happiness, because innocent punishment violates a moral limit.' },
        { label: 'OBJECTION TO THE RESCUE', title: 'A utility-based right can disappear', body: 'If a secret injustice produces the best total balance, the theory has no independent reason to reject it.' },
        { label: 'CONSEQUENCE', title: 'The state defense remains strong, utility remains suspect', body: 'Stable law may justify the state against a state of nature, while utility still fails to explain why some ways of treating people are wrong even when they pay.' }
      ],
      'Close by separating two conclusions. The state may be justified by its effects, but utilitarianism may not provide the moral limit that protects people from being used for those effects.',
      '8'
    );

    refs([
      ['Lecture', '“Justifying the State - Utilitarianism,” source PDF, pp. 1-8.'],
      ['Primary work quoted', 'Jeremy Bentham, A Fragment on Government (1776), quotation reproduced on p. 1.'],
      ['Judgment discussed', 'Lord Denning, Court of Appeal judgment (1980), quotation reproduced on p. 6.'],
      ['Further work mentioned', 'John Stuart Mill, On Liberty, identified on p. 8 as a later discussion of a utilitarian theory of rights.']
    ], note(
      'Use the references slide to identify the supplied lecture PDF and the two primary works named in it.',
      '1-8'
    ));


    const deck = document.getElementById('deck');
    const esc = value => String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    }[character]));

    function renderSlide(slide, index) {
      const article = document.createElement('article');
      const slideClass = slide.type === 'chain' ? 'chain-slide' : slide.type === 'timeline' ? 'timeline-slide' : slide.type;
      article.className = `slide ${slideClass}${['statement', 'split', 'list', 'argument', 'chain', 'timeline', 'arc', 'closing', 'refs'].includes(slide.type) ? ' top' : ''}`;
      article.dataset.index = String(index);
      if (slide.buildGroup) article.dataset.buildGroup = slide.buildGroup;

      let html = '<div class="slide-inner">';
      if (slide.type === 'cover') {
        html += `<div class="cover-grid"><div class="cover-copy"><p class="eyebrow">${esc(slide.course)}</p><h1 class="title">${esc(slide.title)}</h1><p class="work">${esc(slide.work)}</p><div class="course">Lecture presentation</div></div><div class="cover-mark" aria-hidden="true">&Sigma;<span>TOTAL<br>OUTCOME</span></div></div>`;
      }
      if (slide.type === 'section') {
        html += `<p class="section-index">${esc(slide.index)}</p><h2 class="title">${esc(slide.title)}</h2><div class="section-rule"></div>`;
      }
      if (slide.type === 'arc') {
        html += `<p class="eyebrow">${esc(slide.index)}</p><h2 class="title">${esc(slide.title)}</h2><div class="arc-list">${slide.rows.map((row, rowIndex) => `<section class="arc-row ${rowIndex < slide.visible ? 'is-visible' : ''}"${rowIndex >= slide.visible ? ' aria-hidden="true"' : ''}><span class="arc-label">${esc(row.label)}</span><div><h3>${esc(row.title)}</h3><p>${esc(row.body)}</p></div></section>`).join('')}</div>`;
      }
      if (slide.type === 'statement') {
        html += `<p class="eyebrow">Core claim</p><h2 class="title">${esc(slide.title)}</h2><p class="lead">${esc(slide.lead)}</p><p class="support">${esc(slide.support)}</p>`;
        if (slide.band) html += `<div class="statement-band"><p><strong>${esc(slide.band[0])}</strong></p><p>${esc(slide.band[1])}</p></div>`;
      }
      if (slide.type === 'split') {
        html += `<p class="eyebrow">Distinction</p><h2 class="title">${esc(slide.title)}</h2><div class="split-grid">${[slide.left, slide.right].map(column => `<section class="split-col"><span class="column-label">${esc(column.label)}</span><h3>${esc(column.title)}</h3><p class="${column.quote ? 'quote' : ''}">${esc(column.body)}</p></section>`).join('')}</div>`;
      }
      if (slide.type === 'list' || slide.type === 'argument') {
        html += `<p class="eyebrow">${slide.type === 'argument' ? 'Formal structure' : 'Political instructions'}</p><h2 class="title">${esc(slide.title)}</h2><ol class="plain-list">${slide.items.map(item => `<li><span class="list-number">${esc(item[0])}</span><span class="list-copy"><strong>${esc(item[1])}</strong><span>${esc(item[2])}</span></span></li>`).join('')}</ol>`;
      }
      if (slide.type === 'chain') {
        html += `<p class="eyebrow">Institutional comparison</p><h2 class="title">${esc(slide.title)}</h2><div class="chain">${slide.items.map(item => `<section class="chain-step"><span class="step-number">${esc(item[0])}</span><h3>${esc(item[1])}</h3><p>${esc(item[2])}</p></section>`).join('')}</div>`;
      }
      if (slide.type === 'timeline') {
        html += `<p class="eyebrow">Case history</p><h2 class="title">${esc(slide.title)}</h2><div class="timeline">${slide.items.map(item => `<section class="timeline-item"><span class="timeline-year">${esc(item[0])}</span><h3>${esc(item[1])}</h3><p>${esc(item[2])}</p></section>`).join('')}</div>`;
      }
      if (slide.type === 'closing') {
        html += `<p class="eyebrow">Provisional conclusion</p><h2 class="title">${esc(slide.title)}</h2><div class="closing-lines">${slide.lines.map(line => `<p><strong>${esc(line[0])}.</strong> ${esc(line[1])}</p>`).join('')}</div>`;
      }
      if (slide.type === 'refs') {
        html += `<p class="eyebrow">Course materials</p><h2 class="title">${esc(slide.title)}</h2><div class="refs-list">${slide.items.map(item => `<div class="reference"><strong>${esc(item[0])}.</strong> ${esc(item[1])}</div>`).join('')}</div>`;
      }
      article.innerHTML = `${html}</div>`;
      deck.appendChild(article);
      return article;
    }

    const nodes = slides.map(renderSlide);
    const overview = document.getElementById('overview');
    const notes = document.getElementById('notes');
    const overviewGrid = document.getElementById('overview-grid');
    const notesBody = document.getElementById('notes-body');
    const counter = document.getElementById('counter');
    const progress = document.getElementById('progress');
    const overviewCards = [];
    let current = 0;

    const labelFor = slide => slide.type === 'arc' ? `${slide.title} · ${slide.visible}/${slide.rows.length}` : (slide.title || slide.lead || 'Slide');
    slides.forEach((slide, index) => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'overview-card';
      card.innerHTML = `<span class="num">${String(index + 1).padStart(2, '0')} / ${slides.length}</span><span class="label">${esc(labelFor(slide))}</span>`;
      card.addEventListener('click', () => { closePanels(); show(index); });
      overviewGrid.appendChild(card);
      overviewCards.push(card);
    });

    function show(index) {
      current = Math.max(0, Math.min(slides.length - 1, index));
      nodes.forEach((node, nodeIndex) => node.classList.toggle('active', nodeIndex === current));
      overviewCards.forEach((card, cardIndex) => card.classList.toggle('current', cardIndex === current));
      counter.textContent = `${current + 1} / ${slides.length}`;
      progress.style.width = `${((current + 1) / slides.length) * 100}%`;
      notesBody.textContent = slides[current].notes || 'No notes for this slide.';
      document.title = `${current + 1}/${slides.length} · Justifying the State: Utilitarianism`;
    }

    window.show = show;

    function openPanel(panel) {
      closePanels();
      panel.classList.add('open');
    }

    function closePanels() {
      overview.classList.remove('open');
      notes.classList.remove('open');
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    }

    document.getElementById('overview-button').addEventListener('click', () => openPanel(overview));
    document.getElementById('notes-button').addEventListener('click', () => openPanel(notes));
    document.getElementById('fullscreen-button').addEventListener('click', toggleFullscreen);
    document.querySelectorAll('.close').forEach(button => button.addEventListener('click', closePanels));

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') { closePanels(); return; }
      if (overview.classList.contains('open') || notes.classList.contains('open')) return;
      if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(event.key)) { event.preventDefault(); show(current + 1); }
      else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); show(current - 1); }
      else if (event.key.toLowerCase() === 'o') openPanel(overview);
      else if (event.key.toLowerCase() === 'n') openPanel(notes);
      else if (event.key.toLowerCase() === 'f') toggleFullscreen();
    });

    let touchX = 0;
    let touchY = 0;
    document.addEventListener('touchstart', event => {
      touchX = event.changedTouches[0].screenX;
      touchY = event.changedTouches[0].screenY;
    }, { passive: true });
    document.addEventListener('touchend', event => {
      if (overview.classList.contains('open') || notes.classList.contains('open')) return;
      const dx = event.changedTouches[0].screenX - touchX;
      const dy = event.changedTouches[0].screenY - touchY;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) show(current + (dx < 0 ? 1 : -1));
    }, { passive: true });

    function fits(node) {
      const inner = node.querySelector('.slide-inner');
      return inner.scrollHeight <= node.clientHeight * .82 && inner.scrollWidth <= node.clientWidth * .92;
    }

    function fitNode(node) {
      let fit = 1;
      node.classList.add('measuring');
      node.style.setProperty('--fit', fit);
      while (fit > .72 && !fits(node)) {
        fit = Math.max(.72, fit - .01);
        node.style.setProperty('--fit', fit.toFixed(3));
      }
      node.classList.remove('measuring');
    }

    function fitAll() {
      nodes.forEach(node => {
        node.style.setProperty('--fit', 1);
      });
      const groups = {};
      nodes.forEach(node => {
        if (node.dataset.buildGroup) (groups[node.dataset.buildGroup] ??= []).push(node);
      });
      const grouped = new Set(Object.values(groups).flat());
      Object.values(groups).forEach(group => {
        const final = group[group.length - 1];
        fitNode(final);
        const fit = final.style.getPropertyValue('--fit') || '1';
        group.forEach(node => node.style.setProperty('--fit', fit));
      });
      nodes.filter(node => !grouped.has(node)).forEach(fitNode);
      show(current);
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(fitAll, 360);
    });

    if (document.fonts?.ready) document.fonts.ready.then(() => setTimeout(fitAll, 360));
    else fitAll();
    show(0);
  </script>
</body>
</html>
