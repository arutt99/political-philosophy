<style>

  :root{
    --bg:#251f32;
    --bg-deep:#191521;
    --text:#f5f0e9;
    --muted:#c8c0d3;

    --accent-dim:#638d9a;
    --accent-soft:rgba(157,217,208,.15);
    --border:rgba(245,240,233,.15);
    --fit:1;
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg-deep);color:var(--text)}
  body{font-family:Inter,system-ui,sans-serif}
  button{font:inherit}
  #deck{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(ellipse 74% 62% at 50% -12%,rgba(157,217,208,.11),transparent 62%),radial-gradient(circle at 83% 92%,rgba(167,143,202,.12),transparent 35%),var(--bg)}
  #deck::before,#deck::after{content:"";position:absolute;pointer-events:none;border:1px solid rgba(157,217,208,.11);border-radius:50%;filter:blur(.1px)}
  #deck::before{width:min(68vw,880px);height:min(68vw,880px);left:50%;top:50%;transform:translate(-50%,-50%)}
  #deck::after{width:min(52vw,680px);height:min(52vw,680px);left:50%;top:50%;transform:translate(-50%,-50%)}
  .slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:7.2vh 7vw 8vh;text-align:center;overflow:hidden}
  .slide.active,.slide.measuring{display:flex}
  .slide.measuring{visibility:hidden;pointer-events:none}
  .slide.top{align-items:flex-start;padding-top:8.5vh}
  .slide-inner{position:relative;width:min(980px,86vw);max-height:82vh;margin:auto;transform-origin:top center}
  .slide.top .slide-inner{margin:0 auto}
  .slide.duo .slide-inner{width:min(1140px,90vw)}
  .eyebrow{margin:0 0 1.2rem;color:var(--accent);font:600 clamp(12px,1.12vw,17px)/1.3 "IBM Plex Mono",monospace;letter-spacing:.18em;text-transform:uppercase}
  .title{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;letter-spacing:-.018em}
  .cover .title{font-size:calc(clamp(58px,7.6vw,104px)*var(--fit));line-height:.96;max-width:13ch;margin-inline:auto;text-shadow:0 4px 26px rgba(0,0,0,.2)}
  .cover .work{font:500 calc(clamp(20px,2.15vw,31px)*var(--fit))/1.4 "Cormorant Garamond",Georgia,serif;color:var(--muted);margin:1.5rem auto 0;max-width:36ch}
  .cover .course{margin-top:2.4rem;color:var(--accent);font:500 calc(clamp(11px,1vw,15px)*var(--fit))/1.4 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
  .section .slide-inner{width:min(900px,86vw);padding:2rem 2.7rem;border-block:1px solid var(--border);background:linear-gradient(90deg,transparent,rgba(157,217,208,.045),transparent)}
  .section .title{font-size:calc(clamp(48px,6.2vw,84px)*var(--fit));line-height:1.02}
  .section .rule{width:76px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:1.8rem auto 0}
  .content .title,.head .title,.duo .title{font-size:calc(clamp(38px,4.5vw,62px)*var(--fit));line-height:1.05;margin-bottom:1.6rem;max-width:19ch;padding-bottom:.7rem;border-bottom:1px solid var(--border)}
  .content .body{font-family:"Cormorant Garamond",Georgia,serif;font-size:calc(clamp(25px,2.35vw,35px)*var(--fit));line-height:1.34;text-align:left}
  .content .body p{margin:0 0 1.05em -1.25rem;padding:.08em .7em .08em 1rem;border-left:3px solid transparent;color:rgba(200,192,211,.58);font-weight:600;background:linear-gradient(90deg,rgba(157,217,208,0),rgba(157,217,208,0))}
  .content .body p:last-child{margin-bottom:0}
  .content .body p.fresh{color:var(--text);border-left-color:var(--accent);background:linear-gradient(90deg,var(--accent-soft),rgba(157,217,208,0) 78%);text-shadow:0 0 18px rgba(245,240,233,.07)}
  .question .slide-inner,.diagnostic .slide-inner{width:min(900px,86vw);padding:2.7rem 3.5rem;background:rgba(25,21,33,.55);border:1px solid rgba(157,217,208,.24);box-shadow:inset 0 0 0 9px rgba(157,217,208,.025),0 24px 55px rgba(0,0,0,.18)}
  .question .prompt,.diagnostic .prompt{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:calc(clamp(42px,5.2vw,72px)*var(--fit));line-height:1.08;font-weight:600;letter-spacing:-.015em}
  .question .prompt::after,.diagnostic .prompt::after{content:"";display:block;width:7.5rem;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:1.8rem auto 0}
  .question .context{max-width:48ch;margin:1.35rem auto 0;color:var(--muted);font:500 calc(clamp(18px,1.7vw,25px)*var(--fit))/1.4 "Cormorant Garamond",Georgia,serif}
  .quote .slide-inner{padding:1rem 3rem;border-inline:1px solid rgba(157,217,208,.35)}
  .quote blockquote{margin:0 auto;max-width:26ch;font-family:"Cormorant Garamond",Georgia,serif;font-size:calc(clamp(39px,4.45vw,63px)*var(--fit));line-height:1.12;font-weight:500;font-style:italic;text-shadow:0 5px 22px rgba(0,0,0,.25)}
  .quote blockquote::before{content:"“";color:var(--accent);margin-right:.08em}
  .quote blockquote::after{content:"”";color:var(--accent);margin-left:.08em}
  .quote cite{display:block;margin-top:1.6rem;padding-top:1rem;border-top:1px solid var(--border);color:var(--muted);font:500 calc(clamp(12px,1.15vw,17px)*var(--fit))/1.45 "IBM Plex Mono",monospace;font-style:normal}
  .duo-grid{display:grid;grid-template-columns:1fr 1fr;gap:2.4rem;text-align:left;margin-top:1.5rem}
  .duo-col{min-height:15rem;padding:1.5rem 1.6rem;border:1px solid var(--border);border-top:4px solid var(--accent);background:linear-gradient(145deg,rgba(41,34,55,.72),rgba(25,21,33,.54))}
  .duo-col h3{margin:0 0 .85rem;color:var(--accent);font:600 calc(clamp(13px,1.25vw,18px)*var(--fit))/1.3 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
  .duo-col p{margin:0;color:var(--text);font:500 calc(clamp(24px,2.15vw,33px)*var(--fit))/1.34 "Cormorant Garamond",Georgia,serif}
  .head-list{display:grid;gap:1.15rem;text-align:left;margin-top:1.8rem}
  .head-item{display:grid;grid-template-columns:10rem 1fr;gap:1.5rem;align-items:baseline;border-left:2px solid rgba(157,217,208,.55);padding:1rem 0 0 1rem;border-top:1px solid var(--border)}
  .head-item b{color:var(--accent);font:600 calc(clamp(12px,1.1vw,16px)*var(--fit))/1.3 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
  .head-item span{font:500 calc(clamp(23px,2.05vw,31px)*var(--fit))/1.3 "Cormorant Garamond",Georgia,serif}
  .diagnostic .eyebrow{color:var(--muted)}
  .diagnostic .prompt{font-size:calc(clamp(52px,6.6vw,90px)*var(--fit))}
  .refs .slide-inner{width:min(980px,86vw);text-align:left}
  .refs .title{font-size:calc(clamp(40px,4.6vw,64px)*var(--fit));margin-bottom:1.7rem}
  .refs-list{display:grid;gap:1.05rem}
  .ref{padding-top:.95rem;border-top:1px solid var(--border);font:500 calc(clamp(18px,1.65vw,24px)*var(--fit))/1.38 "Cormorant Garamond",Georgia,serif;color:var(--muted)}
  .ref strong{color:var(--text);font-weight:600}
  #progress{position:fixed;z-index:20;left:0;top:0;width:0;height:4px;background:linear-gradient(90deg,#8770a5,var(--accent));transition:width .24s ease}
  #nav-hint,#counter{position:fixed;z-index:20;bottom:2.35vh;color:rgba(200,192,211,.72);font:500 clamp(10px,.86vw,13px)/1.2 "IBM Plex Mono",monospace;letter-spacing:.08em}
  #nav-hint{left:3vw}#counter{right:3vw}
  #fullscreen{position:fixed;z-index:20;right:3vw;top:2.35vh;color:var(--muted);background:rgba(25,21,33,.56);border:1px solid rgba(157,217,208,.45);padding:.55rem .75rem;cursor:pointer;font:500 clamp(10px,.86vw,13px)/1.2 "IBM Plex Mono",monospace;letter-spacing:.06em}
  .panel{position:fixed;z-index:30;inset:0;display:none;overflow:auto;padding:5vh 7vw 8vh;background:rgba(25,21,33,.98)}
  .panel.open{display:block}.panel-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:1rem;margin-bottom:1.5rem}
  .panel-head h2{margin:0;font:600 clamp(28px,3vw,46px)/1 "Cormorant Garamond",Georgia,serif}.close{border:1px solid var(--border);background:transparent;color:var(--text);padding:.55rem .8rem;cursor:pointer;font:500 12px/1 "IBM Plex Mono",monospace}
  #overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}.overview-card{min-height:100px;text-align:left;padding:1rem;background:linear-gradient(145deg,#302944,#1d1928);border:1px solid var(--border);border-left:3px solid transparent;color:var(--text);cursor:pointer}.overview-card:hover,.overview-card.current{border-left-color:var(--accent);border-color:rgba(157,217,208,.42)}.overview-card .num{display:block;color:var(--accent);font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.1em}.overview-card .label{display:block;margin-top:.7rem;font:600 21px/1.12 "Cormorant Garamond",Georgia,serif}
  #notes-body{white-space:pre-wrap;max-width:82ch;color:var(--muted);font:500 clamp(17px,1.45vw,23px)/1.55 "Cormorant Garamond",Georgia,serif}
  @media (max-width:760px){.slide{padding:7vh 6vw 9vh}.slide.top{padding-top:7vh}.slide-inner,.slide.duo .slide-inner{width:min(92vw,980px)}.section .slide-inner,.question .slide-inner,.diagnostic .slide-inner{padding:1.7rem 1.5rem}.quote .slide-inner{padding:1rem 1.4rem}.duo-grid{grid-template-columns:1fr;gap:1rem}.head-item{grid-template-columns:1fr;gap:.45rem}.head-item b{padding-top:0}#nav-hint{display:none}}

/* Justice for Everyone, Everywhere: a structural-inequality visual identity. */
:root{--bg:#172329;--bg-deep:#101a1e;--text:#f3eee5;--muted:#bdcdc9;--accent:#f0ab74;--accent-dim:#a96f51;--accent-soft:rgba(240,171,116,.14);--support:#72c7c0;--border:rgba(214,232,224,.18)}
#deck{background:linear-gradient(112deg,rgba(114,199,192,.055) 0 1px,transparent 1px 100%),repeating-linear-gradient(90deg,rgba(240,171,116,.025) 0 1px,transparent 1px 12vw),radial-gradient(ellipse 84% 68% at 100% -12%,rgba(240,171,116,.13),transparent 60%),radial-gradient(ellipse 72% 62% at -6% 112%,rgba(114,199,192,.13),transparent 58%),var(--bg)}
#deck::before{width:114vw;height:86vh;left:-13vw;top:7vh;transform:none;border-radius:0;border:0;background:repeating-linear-gradient(165deg,transparent 0 4.7rem,rgba(114,199,192,.055) 4.7rem 4.78rem,transparent 4.78rem 9.5rem);opacity:.72}
#deck::after{width:66vw;height:66vw;left:auto;right:-29vw;top:20vh;transform:none;border-radius:50%;border:1px solid rgba(240,171,116,.13);box-shadow:0 0 0 4vw rgba(114,199,192,.018),0 0 0 8vw rgba(240,171,116,.012)}
.section .slide-inner{padding:2.15rem 2.7rem;border-block:1px solid var(--border);background:linear-gradient(90deg,transparent,rgba(240,171,116,.06),transparent)}
.section .rule{background:linear-gradient(90deg,transparent,var(--accent),var(--support),transparent)}
.content .title,.head .title,.duo .title{border-bottom-color:rgba(114,199,192,.27)}
.content .body p{color:rgba(189,205,201,.62);background:linear-gradient(90deg,rgba(240,171,116,0),rgba(240,171,116,0))}
.content .body p.fresh{color:var(--text);border-left-color:var(--accent);background:linear-gradient(90deg,var(--accent-soft),rgba(240,171,116,0) 78%)}
.question .slide-inner,.diagnostic .slide-inner{background:rgba(16,26,30,.62);border-color:rgba(240,171,116,.30);box-shadow:inset 0 0 0 9px rgba(114,199,192,.025),0 24px 55px rgba(0,0,0,.2)}
.question .prompt::after,.diagnostic .prompt::after{background:linear-gradient(90deg,transparent,var(--accent),var(--support),transparent)}
.quote .slide-inner{border-inline-color:rgba(240,171,116,.42)}
.duo-col{border-top-color:var(--accent);background:linear-gradient(145deg,rgba(28,48,52,.78),rgba(15,26,30,.6))}
.head-item{border-left-color:rgba(114,199,192,.72)}
#progress{background:linear-gradient(90deg,var(--support),var(--accent)}
#fullscreen{background:rgba(16,26,30,.6);border-color:rgba(240,171,116,.55)}
.panel{background:rgba(16,26,30,.985)}
.overview-card{background:linear-gradient(145deg,#22383c,#132126)}
.overview-card:hover,.overview-card.current{border-left-color:var(--accent);border-color:rgba(240,171,116,.48)}
</style>

<script>
const slides=[{"type":"cover","title":"Justice for everyone?","work":"Equal rights, structural disadvantage, and the work of changing institutions","course":"JUSTICE FOR EVERYONE, EVERYWHERE","notes":"This account reconstructs the source material’s argument that justice cannot stop at formally equal rights.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 1-30.\n[/Sources]"},{"type":"question","eyebrow":"The opening tension","prompt":"If a rule treats everyone the same, has it treated everyone fairly?","context":"The argument starts from a simple pressure point: a formally neutral rule can operate inside a society whose opportunities were never neutral.","notes":"Let the distinction between equal rights and equal conditions become clear before moving to policy.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 1-3.\n[/Sources]"},{"type":"section","eyebrow":"I. EQUAL RIGHTS ARE NECESSARY, BUT THEY ARE NOT THE WHOLE OF EQUALITY","title":"Equal rights are necessary, but they are not the whole of equality","notes":"The opening move is not to minimize legal equality, but to show why its success can be incomplete.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 1-3.\n[/Sources]"},{"type":"content","title":"Winning formal rights removes one barrier without remaking the whole field","paragraphs":["Women were long denied basic political, legal, and economic standing, including the vote, independent property rights, and equal pay."],"buildGroup":"rights","notes":"The historical examples in the argument establish why equal rights are an achievement, not a trivial starting point.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 1-3.\n[/Sources]"},{"type":"content","title":"Winning formal rights removes one barrier without remaking the whole field","paragraphs":["Women were long denied basic political, legal, and economic standing, including the vote, independent property rights, and equal pay.","Legal reform makes direct discrimination harder to defend and can open education, employment, and civic life to people once excluded from them."],"buildGroup":"rights","notes":"The historical examples in the argument establish why equal rights are an achievement, not a trivial starting point.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 1-3.\n[/Sources]"},{"type":"content","title":"Winning formal rights removes one barrier without remaking the whole field","paragraphs":["Women were long denied basic political, legal, and economic standing, including the vote, independent property rights, and equal pay.","Legal reform makes direct discrimination harder to defend and can open education, employment, and civic life to people once excluded from them.","But the argument insists that a law can be free of discrimination while the society shaped by that law still reproduces discrimination."],"buildGroup":"rights","notes":"The historical examples in the argument establish why equal rights are an achievement, not a trivial starting point.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 1-3.\n[/Sources]"},{"type":"content","title":"A neutral law can leave unequal starting points in place","paragraphs":["An employer may be forbidden to use different pay scales for women and men, yet women can still be concentrated in lower-paid positions."],"buildGroup":"neutral-law","notes":"The argument uses the persistence of the gender pay gap to distinguish legal change from social transformation.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 2-3.\n[/Sources]"},{"type":"content","title":"A neutral law can leave unequal starting points in place","paragraphs":["An employer may be forbidden to use different pay scales for women and men, yet women can still be concentrated in lower-paid positions.","A state cannot realistically supervise every hiring, promotion, or pay decision, so subtle discrimination can persist after overt discrimination becomes illegal."],"buildGroup":"neutral-law","notes":"The argument uses the persistence of the gender pay gap to distinguish legal change from social transformation.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 2-3.\n[/Sources]"},{"type":"content","title":"A neutral law can leave unequal starting points in place","paragraphs":["An employer may be forbidden to use different pay scales for women and men, yet women can still be concentrated in lower-paid positions.","A state cannot realistically supervise every hiring, promotion, or pay decision, so subtle discrimination can persist after overt discrimination becomes illegal.","Justice therefore has to ask not only whether rules are neutral on paper, but also whether people meet those rules with genuinely comparable opportunities."],"buildGroup":"neutral-law","notes":"The argument uses the persistence of the gender pay gap to distinguish legal change from social transformation.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 2-3.\n[/Sources]"},{"type":"question","eyebrow":"The first test","prompt":"When equal treatment rewards uninterrupted careers, what happens to people who were expected to do most of the caring?","context":"This question connects formal equality to the background conditions that make credentials, experience, and time available to some people more easily than to others.","notes":"The next section develops care work as a test case for the limits of equal treatment.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 3-6.\n[/Sources]"},{"type":"section","eyebrow":"II. WHAT LOOKS LIKE MERIT CAN CARRY THE HISTORY OF UNEQUAL OPPORTUNITY","title":"What looks like merit can carry the history of unequal opportunity","notes":"Care work shows how an apparently ordinary selection standard can preserve a gendered pattern of advantage.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 3-6.\n[/Sources]"},{"type":"content","title":"Career history can reflect a social division of care, not simply individual choice","paragraphs":["When one candidate has uninterrupted paid employment and another has left paid work to care for children or older relatives, experience looks like a relevant difference."],"buildGroup":"care","notes":"The argument asks how promotion decisions should treat employment gaps shaped by unequal caring responsibilities.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 3-4.\n[/Sources]"},{"type":"content","title":"Career history can reflect a social division of care, not simply individual choice","paragraphs":["When one candidate has uninterrupted paid employment and another has left paid work to care for children or older relatives, experience looks like a relevant difference.","Yet the opportunity to acquire that experience was not distributed equally if caring responsibilities fell predictably on one gender."],"buildGroup":"care","notes":"The argument asks how promotion decisions should treat employment gaps shaped by unequal caring responsibilities.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 3-4.\n[/Sources]"},{"type":"content","title":"Career history can reflect a social division of care, not simply individual choice","paragraphs":["When one candidate has uninterrupted paid employment and another has left paid work to care for children or older relatives, experience looks like a relevant difference.","Yet the opportunity to acquire that experience was not distributed equally if caring responsibilities fell predictably on one gender.","Treating the record of experience as the whole story can turn a social pattern of unequal opportunity into an apparently fair result."],"buildGroup":"care","notes":"The argument asks how promotion decisions should treat employment gaps shaped by unequal caring responsibilities.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 3-4.\n[/Sources]"},{"type":"content","title":"The distinction between sex and gender makes room to criticize inherited roles","paragraphs":["The argument distinguishes sex, often treated as biological, from gender, understood as a social category shaped by roles and expectations."],"buildGroup":"gender","notes":"The argument notes that contemporary debates make simple claims about sex and gender more contested, while retaining the importance of examining social roles.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 4-5.\n[/Sources]"},{"type":"content","title":"The distinction between sex and gender makes room to criticize inherited roles","paragraphs":["The argument distinguishes sex, often treated as biological, from gender, understood as a social category shaped by roles and expectations.","Even where bodily differences exist, they do not settle which work people should do or which social roles a society should preserve."],"buildGroup":"gender","notes":"The argument notes that contemporary debates make simple claims about sex and gender more contested, while retaining the importance of examining social roles.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 4-5.\n[/Sources]"},{"type":"content","title":"The distinction between sex and gender makes room to criticize inherited roles","paragraphs":["The argument distinguishes sex, often treated as biological, from gender, understood as a social category shaped by roles and expectations.","Even where bodily differences exist, they do not settle which work people should do or which social roles a society should preserve.","Gender roles can look like second nature because they are familiar, but the argument argues that they remain open to evaluation and change."],"buildGroup":"gender","notes":"The argument notes that contemporary debates make simple claims about sex and gender more contested, while retaining the importance of examining social roles.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 4-5.\n[/Sources]"},{"type":"quote","text":"The old assumption of the workplace, still implicit, is that workers have wives at home.","cite":"Susan Moller Okin, Justice, Gender, and the Family, quoted in the source material, p. 5.","notes":"Let the quotation name the hidden model of a worker before the policy discussion resumes.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, p. 5.\n[/Sources]"},{"type":"content","title":"Changing a policy can also challenge the role the policy quietly assumes","paragraphs":["Maternity leave can make paid work more possible for mothers, but it can also leave the assumption that mothers, rather than parents generally, will take primary responsibility for care."],"buildGroup":"parenting","notes":"The argument connects parental leave, the double day of paid and unpaid work, and women’s economic autonomy.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 5-6.\n[/Sources]"},{"type":"content","title":"Changing a policy can also challenge the role the policy quietly assumes","paragraphs":["Maternity leave can make paid work more possible for mothers, but it can also leave the assumption that mothers, rather than parents generally, will take primary responsibility for care.","Parental leave makes the role available to either parent and therefore treats the division of care as something that can be shared and reconstructed."],"buildGroup":"parenting","notes":"The argument connects parental leave, the double day of paid and unpaid work, and women’s economic autonomy.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 5-6.\n[/Sources]"},{"type":"content","title":"Changing a policy can also challenge the role the policy quietly assumes","paragraphs":["Maternity leave can make paid work more possible for mothers, but it can also leave the assumption that mothers, rather than parents generally, will take primary responsibility for care.","Parental leave makes the role available to either parent and therefore treats the division of care as something that can be shared and reconstructed.","The argument links workplace equality to family equality: unequal power and unpaid domestic labor can narrow opportunity long before a promotion decision is made."],"buildGroup":"parenting","notes":"The argument connects parental leave, the double day of paid and unpaid work, and women’s economic autonomy.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 5-6.\n[/Sources]"},{"type":"question","eyebrow":"A difficult remedy","prompt":"Can justice sometimes require a policy that notices group disadvantage rather than ignoring it?","context":"Affirmative action makes this question unavoidable because it deliberately responds to patterns that a strictly individual approach would set aside.","notes":"The next section distinguishes several forms of affirmative action and then tests their justification.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 6-8.\n[/Sources]"},{"type":"section","eyebrow":"III. A TEMPORARY PREFERENCE MAY BE A ROUTE TOWARD A WORLD WHERE PREFERENCES ARE UNNECESSARY","title":"A temporary preference may be a route toward a world where preferences are unnecessary","notes":"The argument treats affirmative action as a serious but contested remedy, not as a simple exception to merit.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 6-10.\n[/Sources]"},{"type":"content","title":"Affirmative action ranges from outreach to preferential selection","paragraphs":["A policy can encourage applications from under-represented groups, advertise where those applicants are more likely to see the opportunity, or recruit actively."],"buildGroup":"forms","notes":"The argument uses examples of hiring in a philosophy department to display the range of affirmative-action policies.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 6-7.\n[/Sources]"},{"type":"content","title":"Affirmative action ranges from outreach to preferential selection","paragraphs":["A policy can encourage applications from under-represented groups, advertise where those applicants are more likely to see the opportunity, or recruit actively.","It can also use group membership as a tiebreaker between equally qualified candidates, view applications more favorably, or impose a quota."],"buildGroup":"forms","notes":"The argument uses examples of hiring in a philosophy department to display the range of affirmative-action policies.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 6-7.\n[/Sources]"},{"type":"content","title":"Affirmative action ranges from outreach to preferential selection","paragraphs":["A policy can encourage applications from under-represented groups, advertise where those applicants are more likely to see the opportunity, or recruit actively.","It can also use group membership as a tiebreaker between equally qualified candidates, view applications more favorably, or impose a quota.","These possibilities differ in force, but they share an aim: to widen occupational choice and redress exclusion from valued positions."],"buildGroup":"forms","notes":"The argument uses examples of hiring in a philosophy department to display the range of affirmative-action policies.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 6-7.\n[/Sources]"},{"type":"head","title":"The dispute is not whether to discriminate, but which distinctions are just","items":[["Merit","Critics say scarce opportunities should go to individuals on relevant qualifications, not group membership."],["Background","Defenders reply that qualifications themselves can record unequal schools, support, networks, and earlier opportunity."],["Stigma","A further worry is that beneficiaries, including those who would have succeeded anyway, may be treated as suspect."],["Aim","The policy must be judged by the kind of equality it can create and by the costs it can impose along the way."]],"notes":"This slide gathers the argument’s central objections before presenting the defences.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 7-8.\n[/Sources]"},{"type":"duo","title":"Two objections identify real risks","left":{"label":"Individual merit","text":"If gender, race, or disability never count as relevant grounds, selecting by group membership can look like replacing one unfair distinction with another."},"right":{"label":"Stigma","text":"If people are assumed to owe a place to a preference, the policy can undermine how their achievement is seen and even harm those who did not benefit from it."},"notes":"Both objections are treated as forceful. The argument does not dismiss either by definition.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 7-8.\n[/Sources]"},{"type":"content","title":"Formal qualifications can be both relevant and historically unequal","paragraphs":["A credential may represent real skill, not merely an inflated signal of privilege, so the claim that every apparent merit is fake is too quick."],"buildGroup":"merit-history","notes":"The argument distinguishes the acquisition of genuine skill from the unequal conditions under which it is acquired.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 8-9.\n[/Sources]"},{"type":"content","title":"Formal qualifications can be both relevant and historically unequal","paragraphs":["A credential may represent real skill, not merely an inflated signal of privilege, so the claim that every apparent merit is fake is too quick.","At the same time, unequal opportunity is cumulative: earlier advantages help people acquire the skills and qualifications that later count as merit."],"buildGroup":"merit-history","notes":"The argument distinguishes the acquisition of genuine skill from the unequal conditions under which it is acquired.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 8-9.\n[/Sources]"},{"type":"content","title":"Formal qualifications can be both relevant and historically unequal","paragraphs":["A credential may represent real skill, not merely an inflated signal of privilege, so the claim that every apparent merit is fake is too quick.","At the same time, unequal opportunity is cumulative: earlier advantages help people acquire the skills and qualifications that later count as merit.","This pushes justice upstream toward equal opportunity in education and caregiving, while leaving open whether later affirmative action may still be needed."],"buildGroup":"merit-history","notes":"The argument distinguishes the acquisition of genuine skill from the unequal conditions under which it is acquired.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 8-9.\n[/Sources]"},{"type":"content","title":"Several defences explain why a limited preference might be justified","paragraphs":["One defence treats affirmative action as compensation for background advantage that has made the credentials of the privileged appear stronger than their underlying potential."],"buildGroup":"defences","notes":"The argument presents these as distinct lines of defence with different strengths and limits.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 9-10.\n[/Sources]"},{"type":"content","title":"Several defences explain why a limited preference might be justified","paragraphs":["One defence treats affirmative action as compensation for background advantage that has made the credentials of the privileged appear stronger than their underlying potential.","A second appeals to social utility: a society may need professionals from many backgrounds, though the argument warns that this argument has limited reach and must not simply accept existing preferences."],"buildGroup":"defences","notes":"The argument presents these as distinct lines of defence with different strengths and limits.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 9-10.\n[/Sources]"},{"type":"content","title":"Several defences explain why a limited preference might be justified","paragraphs":["One defence treats affirmative action as compensation for background advantage that has made the credentials of the privileged appear stronger than their underlying potential.","A second appeals to social utility: a society may need professionals from many backgrounds, though the argument warns that this argument has limited reach and must not simply accept existing preferences.","A third appeals to reparation when present disadvantage is linked to past injustice and present members of dominant groups still benefit from that history."],"buildGroup":"defences","notes":"The argument presents these as distinct lines of defence with different strengths and limits.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 9-10.\n[/Sources]"},{"type":"content","title":"Several defences explain why a limited preference might be justified","paragraphs":["One defence treats affirmative action as compensation for background advantage that has made the credentials of the privileged appear stronger than their underlying potential.","A second appeals to social utility: a society may need professionals from many backgrounds, though the argument warns that this argument has limited reach and must not simply accept existing preferences.","A third appeals to reparation when present disadvantage is linked to past injustice and present members of dominant groups still benefit from that history.","A fourth emphasizes symbolism and role models: opening professions can signal welcome, challenge exclusion, and make previously closed futures visible."],"buildGroup":"defences","notes":"The argument presents these as distinct lines of defence with different strengths and limits.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 9-10.\n[/Sources]"},{"type":"content","title":"The strongest defence treats affirmative action as transitional rather than ideal","paragraphs":["In an ideal world, individuals would be judged on their merits without a policy of group preference."],"buildGroup":"transition","notes":"The argument calls this a route toward a more just world, while recognizing the policy can itself be imperfect.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, p. 10.\n[/Sources]"},{"type":"content","title":"The strongest defence treats affirmative action as transitional rather than ideal","paragraphs":["In an ideal world, individuals would be judged on their merits without a policy of group preference.","But if existing exclusion prevents that world from arriving, refusing any temporary remedy can preserve the conditions that make meritocratic judgment impossible."],"buildGroup":"transition","notes":"The argument calls this a route toward a more just world, while recognizing the policy can itself be imperfect.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, p. 10.\n[/Sources]"},{"type":"content","title":"The strongest defence treats affirmative action as transitional rather than ideal","paragraphs":["In an ideal world, individuals would be judged on their merits without a policy of group preference.","But if existing exclusion prevents that world from arriving, refusing any temporary remedy can preserve the conditions that make meritocratic judgment impossible.","The transitional claim is therefore not that preference is the final shape of justice, but that it may help build the social conditions in which it is no longer needed."],"buildGroup":"transition","notes":"The argument calls this a route toward a more just world, while recognizing the policy can itself be imperfect.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, p. 10.\n[/Sources]"},{"type":"question","eyebrow":"The next obstacle","prompt":"What if the category a society is trying to ignore has already organized its institutions?","context":"The discussion of race asks whether a color-blind rule can be fair when racialization has distributed disadvantage and privilege across generations.","notes":"The next section shifts from direct discrimination to the social construction and continuing effects of race.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 11-15.\n[/Sources]"},{"type":"section","eyebrow":"IV. IGNORING RACE CAN IGNORE THE STRUCTURES RACIALIZATION HAS ALREADY BUILT","title":"Ignoring race can ignore the structures racialization has already built","notes":"The argument distinguishes a biological account of race from the sociological force of racialized institutions.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 11-19.\n[/Sources]"},{"type":"quote","text":"The problem of the twentieth century is the problem of the color line.","cite":"W. E. B. Du Bois, “To the Nations of the World,” quoted in the source material, p. 11.","notes":"The quotation introduces racial justice as a question of access to the opportunities and privileges of modern life.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, p. 11.\n[/Sources]"},{"type":"content","title":"A group generalization cannot settle what an individual deserves","paragraphs":["Racial discrimination is often defended through claims about supposedly different group natures, abilities, habits, or trustworthiness."],"buildGroup":"racial-claims","notes":"The argument uses the example of average height to show why a group average is weak evidence about a particular person.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 12-13.\n[/Sources]"},{"type":"content","title":"A group generalization cannot settle what an individual deserves","paragraphs":["Racial discrimination is often defended through claims about supposedly different group natures, abilities, habits, or trustworthiness.","Even if a generalization had evidence behind it, it would not tell us enough about the particular individual seeking a job, home, or opportunity."],"buildGroup":"racial-claims","notes":"The argument uses the example of average height to show why a group average is weak evidence about a particular person.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 12-13.\n[/Sources]"},{"type":"content","title":"A group generalization cannot settle what an individual deserves","paragraphs":["Racial discrimination is often defended through claims about supposedly different group natures, abilities, habits, or trustworthiness.","Even if a generalization had evidence behind it, it would not tell us enough about the particular individual seeking a job, home, or opportunity.","And even if a characteristic were true of an individual, further argument would still be needed to show that it is relevant to the opportunity being allocated."],"buildGroup":"racial-claims","notes":"The argument uses the example of average height to show why a group average is weak evidence about a particular person.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 12-13.\n[/Sources]"},{"type":"content","title":"Race can lack a biological foundation and still have social force","paragraphs":["The argument reports the argument that familiar racial categories have no deep genetic basis: variation within a racial group can be as large as or larger than variation between groups."],"buildGroup":"racialization","notes":"The argument presents race as a historically recent social category that can have real and harmful effects.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 13-14.\n[/Sources]"},{"type":"content","title":"Race can lack a biological foundation and still have social force","paragraphs":["The argument reports the argument that familiar racial categories have no deep genetic basis: variation within a racial group can be as large as or larger than variation between groups.","But race remains sociologically real when people are classified, treated, and organized through racial categories."],"buildGroup":"racialization","notes":"The argument presents race as a historically recent social category that can have real and harmful effects.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 13-14.\n[/Sources]"},{"type":"content","title":"Race can lack a biological foundation and still have social force","paragraphs":["The argument reports the argument that familiar racial categories have no deep genetic basis: variation within a racial group can be as large as or larger than variation between groups.","But race remains sociologically real when people are classified, treated, and organized through racial categories.","To be racialized is to live with the effects of a category whose social consequences can be enduring even if its biological story is false."],"buildGroup":"racialization","notes":"The argument presents race as a historically recent social category that can have real and harmful effects.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 13-14.\n[/Sources]"},{"type":"content","title":"A rule that refuses to see race may leave racial advantage untouched","paragraphs":["A truly color-blind world could be an inspiring ideal if social institutions no longer distributed advantage and disadvantage along racialized lines."],"buildGroup":"colorblind","notes":"The argument argues that the continuing effects of racialization demand more than an immediate ban on race-conscious policy.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 14-16.\n[/Sources]"},{"type":"content","title":"A rule that refuses to see race may leave racial advantage untouched","paragraphs":["A truly color-blind world could be an inspiring ideal if social institutions no longer distributed advantage and disadvantage along racialized lines.","But a color-blind policy in the world as it is can leave intact the skills, networks, housing patterns, and standards of fitting in that earlier exclusion has already produced."],"buildGroup":"colorblind","notes":"The argument argues that the continuing effects of racialization demand more than an immediate ban on race-conscious policy.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 14-16.\n[/Sources]"},{"type":"content","title":"A rule that refuses to see race may leave racial advantage untouched","paragraphs":["A truly color-blind world could be an inspiring ideal if social institutions no longer distributed advantage and disadvantage along racialized lines.","But a color-blind policy in the world as it is can leave intact the skills, networks, housing patterns, and standards of fitting in that earlier exclusion has already produced.","Justice requires background changes before formal color-blindness can do the work its defenders hope it will do."],"buildGroup":"colorblind","notes":"The argument argues that the continuing effects of racialization demand more than an immediate ban on race-conscious policy.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 14-16.\n[/Sources]"},{"type":"duo","title":"Two responses can both leave the dominant culture unexamined","left":{"label":"Assimilation","text":"Everyone is welcome if they behave like the majority. Difference remains private, and public norms are treated as already neutral."},"right":{"label":"Multiculturalism","text":"Cultural traditions receive public accommodation, yet hard questions remain when a practice conflicts with rights, safety, or the freedom of people within the group."},"notes":"The argument treats both approaches as intelligible responses with important limitations.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 16-18.\n[/Sources]"},{"type":"content","title":"Integration asks the public culture to change as well","paragraphs":["Integration agrees that people should share a public world, but it rejects the assumption that the existing dominant culture has already earned the right to set all of its terms."],"buildGroup":"integration","notes":"The discussion draws on Elizabeth Anderson’s account of integration and its conditions of success.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 18-19.\n[/Sources]"},{"type":"content","title":"Integration asks the public culture to change as well","paragraphs":["Integration agrees that people should share a public world, but it rejects the assumption that the existing dominant culture has already earned the right to set all of its terms.","When ordinary norms create exclusion or dispossession, those norms may need to change so that people from different backgrounds can flourish together."],"buildGroup":"integration","notes":"The discussion draws on Elizabeth Anderson’s account of integration and its conditions of success.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 18-19.\n[/Sources]"},{"type":"content","title":"Integration asks the public culture to change as well","paragraphs":["Integration agrees that people should share a public world, but it rejects the assumption that the existing dominant culture has already earned the right to set all of its terms.","When ordinary norms create exclusion or dispossession, those norms may need to change so that people from different backgrounds can flourish together.","The argument presents integration as difficult, practical work across education, housing, and employment rather than a quick fix."],"buildGroup":"integration","notes":"The discussion draws on Elizabeth Anderson’s account of integration and its conditions of success.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 18-19.\n[/Sources]"},{"type":"question","eyebrow":"A change of frame","prompt":"Does disability lie entirely in a person’s body, or partly in the world built around that body?","context":"The social model of disability relocates the question from individual defect to the material and institutional design of ordinary life.","notes":"The next section uses disability to sharpen the claim that social arrangements can intensify or reduce disadvantage.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 20-23.\n[/Sources]"},{"type":"section","eyebrow":"V. A WORLD DESIGNED FOR SOME BODIES CAN DISABLE OTHERS","title":"A world designed for some bodies can disable others","notes":"The social model of disability treats access, design, technology, and attitudes as matters of justice.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 20-23.\n[/Sources]"},{"type":"content","title":"The same impairment can lead to very different lives in differently designed worlds","paragraphs":["The argument compares people with spinal injuries in urban Sydney and rural Cameroon, where mobility, care, sanitation, buildings, and technology make radically different forms of life possible."],"buildGroup":"social-model","notes":"The Sydney and Cameroon comparison is the argument’s central illustration of the social model.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 20-21.\n[/Sources]"},{"type":"content","title":"The same impairment can lead to very different lives in differently designed worlds","paragraphs":["The argument compares people with spinal injuries in urban Sydney and rural Cameroon, where mobility, care, sanitation, buildings, and technology make radically different forms of life possible.","The comparison does not deny bodily impairment; it shows that how far an impairment limits someone depends substantially on social and material conditions."],"buildGroup":"social-model","notes":"The Sydney and Cameroon comparison is the argument’s central illustration of the social model.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 20-21.\n[/Sources]"},{"type":"content","title":"The same impairment can lead to very different lives in differently designed worlds","paragraphs":["The argument compares people with spinal injuries in urban Sydney and rural Cameroon, where mobility, care, sanitation, buildings, and technology make radically different forms of life possible.","The comparison does not deny bodily impairment; it shows that how far an impairment limits someone depends substantially on social and material conditions.","In this sense, a society can disable people when it organizes roads, buildings, work, and public life around only some kinds of bodies."],"buildGroup":"social-model","notes":"The Sydney and Cameroon comparison is the argument’s central illustration of the social model.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 20-21.\n[/Sources]"},{"type":"content","title":"The social model corrects the medical model without making medicine irrelevant","paragraphs":["The medical model treats disability primarily as a condition to be treated through surgery, therapy, or training."],"buildGroup":"models","notes":"The argument presents the social model as a powerful corrective rather than the entire truth.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 21-22.\n[/Sources]"},{"type":"content","title":"The social model corrects the medical model without making medicine irrelevant","paragraphs":["The medical model treats disability primarily as a condition to be treated through surgery, therapy, or training.","The social model answers that justice often requires changing the world so people can participate as they are, rather than changing every person to fit the world as it is."],"buildGroup":"models","notes":"The argument presents the social model as a powerful corrective rather than the entire truth.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 21-22.\n[/Sources]"},{"type":"content","title":"The social model corrects the medical model without making medicine irrelevant","paragraphs":["The medical model treats disability primarily as a condition to be treated through surgery, therapy, or training.","The social model answers that justice often requires changing the world so people can participate as they are, rather than changing every person to fit the world as it is.","The argument rejects the extreme claim that disability is never a medical matter, especially when treatment can relieve pain or expand a person’s options."],"buildGroup":"models","notes":"The argument presents the social model as a powerful corrective rather than the entire truth.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 21-22.\n[/Sources]"},{"type":"head","title":"Equal respect begins with questions, not one standard answer","items":[["Access","Which ordinary buildings, technologies, and practices exclude people without good reason?"],["Choice","Some people welcome treatment or assistive technology; others value ways of life that a medical intervention may alter."],["Difference","Similar circumstances do not guarantee similar needs, goals, or identities."],["Design","Justice asks what must change so that people can pursue rich and fulfilling lives on equal terms."]],"notes":"The argument discusses mobility, sensory impairments, cognitive disability, Deaf culture, and different attitudes toward treatment.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 22-23.\n[/Sources]"},{"type":"question","eyebrow":"Beyond one case","prompt":"If institutions can make some ways of living appear lesser, what does equal public recognition demand?","context":"The argument turns from disability to sexual orientation and gender identity, where legal rights and social meaning are often inseparable.","notes":"The next section connects equal rights to the public validation carried by legal institutions.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 23-25.\n[/Sources]"},{"type":"section","eyebrow":"VI. PUBLIC INSTITUTIONS CAN WITHHOLD RECOGNITION AS WELL AS MATERIAL BENEFITS","title":"Public institutions can withhold recognition as well as material benefits","notes":"The argument broadens justice beyond access to include equal standing and the critique of tradition.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 23-27.\n[/Sources]"},{"type":"content","title":"Marriage reveals why equal legal status can have symbolic force","paragraphs":["Marriage carries material rights, such as inheritance, but it also publicly recognizes and validates a relationship."],"buildGroup":"recognition","notes":"The argument treats marriage equality as an example of how law expresses public recognition as well as distributes benefits.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 23-24.\n[/Sources]"},{"type":"content","title":"Marriage reveals why equal legal status can have symbolic force","paragraphs":["Marriage carries material rights, such as inheritance, but it also publicly recognizes and validates a relationship.","Offering that institution to some couples while denying it to others marks ways of living as belonging to different moral categories."],"buildGroup":"recognition","notes":"The argument treats marriage equality as an example of how law expresses public recognition as well as distributes benefits.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 23-24.\n[/Sources]"},{"type":"content","title":"Marriage reveals why equal legal status can have symbolic force","paragraphs":["Marriage carries material rights, such as inheritance, but it also publicly recognizes and validates a relationship.","Offering that institution to some couples while denying it to others marks ways of living as belonging to different moral categories.","The argument’s point is not that everyone must marry, but that the choice should not be withheld by law from some people while granted to others."],"buildGroup":"recognition","notes":"The argument treats marriage equality as an example of how law expresses public recognition as well as distributes benefits.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 23-24.\n[/Sources]"},{"type":"question","eyebrow":"A boundary problem","prompt":"Once equality challenges an inherited institution, how should a society decide which extensions or reforms it can justify?","context":"The argument does not supply settled answers to every question about gender identity, relationships, or legal recognition; it insists that rights language does not eliminate the need for difficult practical judgment.","notes":"This question prevents the argument from treating recognition as a formula that automatically resolves every case.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 24-25.\n[/Sources]"},{"type":"content","title":"A conservative objection warns that reform can discard hard-won social wisdom","paragraphs":["Critics of progressive liberalism argue that traditions and institutions can contain knowledge accumulated over generations, even when they cannot be neatly defended by abstract reason."],"buildGroup":"tradition","notes":"The argument introduces Burke and Oakeshott to articulate the case for caution about radical reform.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 25-27.\n[/Sources]"},{"type":"content","title":"A conservative objection warns that reform can discard hard-won social wisdom","paragraphs":["Critics of progressive liberalism argue that traditions and institutions can contain knowledge accumulated over generations, even when they cannot be neatly defended by abstract reason.","On this view, rapid reform can leave people rootless and can destroy practices whose value becomes visible only after they are gone."],"buildGroup":"tradition","notes":"The argument introduces Burke and Oakeshott to articulate the case for caution about radical reform.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 25-27.\n[/Sources]"},{"type":"content","title":"A conservative objection warns that reform can discard hard-won social wisdom","paragraphs":["Critics of progressive liberalism argue that traditions and institutions can contain knowledge accumulated over generations, even when they cannot be neatly defended by abstract reason.","On this view, rapid reform can leave people rootless and can destroy practices whose value becomes visible only after they are gone.","The argument therefore asks justice to face a real tension: some traditions are prejudices that entrench inequality, while others may deserve respect and careful preservation."],"buildGroup":"tradition","notes":"The argument introduces Burke and Oakeshott to articulate the case for caution about radical reform.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 25-27.\n[/Sources]"},{"type":"duo","title":"The disagreement is about what political judgment owes to the past","left":{"label":"Progressive liberalism","text":"Existing arrangements must answer to equal rights, liberty, and fair treatment. Long survival is not a justification for exclusion."},"right":{"label":"Traditionalism","text":"Inherited practices should not be redesigned merely because a theory finds them imperfect. Their history may contain wisdom that current reformers cannot see."},"notes":"The argument finds merit on both sides and concludes that the balance cannot be fixed by a simple rule.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 25-27.\n[/Sources]"},{"type":"section","eyebrow":"VII. OPPRESSION ALSO SHAPES WHOSE KNOWLEDGE IS HEARD","title":"Oppression also shapes whose knowledge is heard","notes":"The final movement deepens the account: injustice can affect identity, testimony, interpretation, and political understanding.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 27-30.\n[/Sources]"},{"type":"content","title":"Oppression is more than a series of isolated unfair acts","paragraphs":["A person can face discrimination in work, housing, or family law and also be treated as lesser, invisible, or out of place in public life."],"buildGroup":"oppression","notes":"The argument treats institutional discrimination as only one part of the lived experience of oppression.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 27-28.\n[/Sources]"},{"type":"content","title":"Oppression is more than a series of isolated unfair acts","paragraphs":["A person can face discrimination in work, housing, or family law and also be treated as lesser, invisible, or out of place in public life.","The argument connects this experience to Iris Marion Young’s five faces of oppression: exploitation, marginalization, powerlessness, cultural imperialism, and violence."],"buildGroup":"oppression","notes":"The argument treats institutional discrimination as only one part of the lived experience of oppression.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 27-28.\n[/Sources]"},{"type":"content","title":"Oppression is more than a series of isolated unfair acts","paragraphs":["A person can face discrimination in work, housing, or family law and also be treated as lesser, invisible, or out of place in public life.","The argument connects this experience to Iris Marion Young’s five faces of oppression: exploitation, marginalization, powerlessness, cultural imperialism, and violence.","These experiences can undermine confidence, participation, and a person’s sense that they have a right to speak and be taken seriously."],"buildGroup":"oppression","notes":"The argument treats institutional discrimination as only one part of the lived experience of oppression.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 27-28.\n[/Sources]"},{"type":"content","title":"Injustice can govern who is believed and whose ideas receive credit","paragraphs":["When some people are routinely ignored, interrupted, diminished, or judged less credible, small episodes can accumulate into marginalization and powerlessness."],"buildGroup":"epistemic","notes":"The argument connects epistemic injustice to recurring micro-aggressions and unequal credibility in institutions of authority.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, p. 28.\n[/Sources]"},{"type":"content","title":"Injustice can govern who is believed and whose ideas receive credit","paragraphs":["When some people are routinely ignored, interrupted, diminished, or judged less credible, small episodes can accumulate into marginalization and powerlessness.","Miranda Fricker calls this epistemic injustice: injustice in practices concerning knowledge, testimony, and who is recognized as a contributor."],"buildGroup":"epistemic","notes":"The argument connects epistemic injustice to recurring micro-aggressions and unequal credibility in institutions of authority.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, p. 28.\n[/Sources]"},{"type":"content","title":"Injustice can govern who is believed and whose ideas receive credit","paragraphs":["When some people are routinely ignored, interrupted, diminished, or judged less credible, small episodes can accumulate into marginalization and powerlessness.","Miranda Fricker calls this epistemic injustice: injustice in practices concerning knowledge, testimony, and who is recognized as a contributor.","The argument compares its operation to air pollution: it often arises from many small actions rather than from a single deliberate conspiracy."],"buildGroup":"epistemic","notes":"The argument connects epistemic injustice to recurring micro-aggressions and unequal credibility in institutions of authority.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, p. 28.\n[/Sources]"},{"type":"content","title":"Disadvantage can reveal structures that privilege tends not to notice","paragraphs":["People who benefit from secure backgrounds, networks, education, and stable institutions may explain success entirely through hard work because the enabling conditions feel ordinary to them."],"buildGroup":"standpoint","notes":"The argument connects Du Bois’s second-sight to standpoint theory and introduces intersectionality through Kimberlé Crenshaw.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 29-30.\n[/Sources]"},{"type":"content","title":"Disadvantage can reveal structures that privilege tends not to notice","paragraphs":["People who benefit from secure backgrounds, networks, education, and stable institutions may explain success entirely through hard work because the enabling conditions feel ordinary to them.","Du Bois’s idea of second-sight and later standpoint theory suggest that those who live under oppression may perceive the myths that justify dominance more clearly."],"buildGroup":"standpoint","notes":"The argument connects Du Bois’s second-sight to standpoint theory and introduces intersectionality through Kimberlé Crenshaw.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 29-30.\n[/Sources]"},{"type":"content","title":"Disadvantage can reveal structures that privilege tends not to notice","paragraphs":["People who benefit from secure backgrounds, networks, education, and stable institutions may explain success entirely through hard work because the enabling conditions feel ordinary to them.","Du Bois’s idea of second-sight and later standpoint theory suggest that those who live under oppression may perceive the myths that justify dominance more clearly.","Intersectionality adds that people facing more than one form of oppression can occupy a standpoint that is not reducible to any one of those positions alone."],"buildGroup":"standpoint","notes":"The argument connects Du Bois’s second-sight to standpoint theory and introduces intersectionality through Kimberlé Crenshaw.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 29-30.\n[/Sources]"},{"type":"diagnostic","eyebrow":"The justice test","prompt":"Would a just institution still look neutral after you asked who had to adapt to it, who it treated as credible, and who it made invisible?","notes":"This final question gathers the argument’s diagnostic method without claiming that every case has one predetermined answer.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 1-30.\n[/Sources]"},{"type":"refs","title":"References","items":[["Source material","“Justice for Everyone, Everywhere - Justice for Everyone.”"],["Works quoted","Simone de Beauvoir, The Second Sex; Susan Moller Okin, Justice, Gender, and the Family; W. E. B. Du Bois, “To the Nations of the World” and The Souls of Black Folk, all as quoted or discussed in the source material."],["Ideas and thinkers discussed","Mary Wollstonecraft; Elizabeth Anderson; Edmund Burke; Michael Oakeshott; Iris Marion Young; Miranda Fricker; Patricia Hill Collins; Audre Lorde; Kimberlé Crenshaw, all as presented in the source material."]],"notes":"Every visible claim, quotation, and example is grounded in the source material. No outside research was used.\n\n[Sources]\nJustice for Everyone, Everywhere - Justice for Everyone, pp. 1-30.\n[/Sources]"}].filter(slide => slide.type !== "quote" && slide.type !== "question");
const deck=document.getElementById('deck');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function renderSlide(s,i){
  const article=document.createElement('article');
  article.className=`slide ${s.type}${s.type==='content'||s.type==='head'?' top':''}`;
  article.dataset.index=i;
  if(s.buildGroup) article.dataset.buildGroup=s.buildGroup;
  let html='<div class="slide-inner">';
  if(s.type==='cover') html+=`<h1 class="title">${esc(s.title)}</h1><p class="work">${esc(s.work)}</p><div class="course">${esc(s.course)}</div>`;
  if(s.type==='section') html+=`<div class="eyebrow">${esc(s.eyebrow)}</div><h2 class="title">${esc(s.title)}</h2><div class="rule"></div>`;
  if(s.type==='content') html+=`<h2 class="title">${esc(s.title)}</h2><div class="body">${s.paragraphs.map((p,j)=>`<p class="${j===s.paragraphs.length-1?'fresh':''}">${esc(p)}</p>`).join('')}</div>`;
  if(s.type==='question'||s.type==='diagnostic') html+=`<div class="eyebrow">${esc(s.eyebrow)}</div><p class="prompt">${esc(s.prompt)}</p>${s.context?`<p class="context">${esc(s.context)}</p>`:''}`;
  if(s.type==='quote') html+=`<blockquote>${esc(s.text)}</blockquote><cite>${esc(s.cite)}</cite>`;
  if(s.type==='duo') html+=`<h2 class="title">${esc(s.title)}</h2><div class="duo-grid">${[s.left,s.right].map(x=>`<div class="duo-col"><h3>${esc(x.label)}</h3><p>${esc(x.text)}</p></div>`).join('')}</div>`;
  if(s.type==='head') html+=`<h2 class="title">${esc(s.title)}</h2><div class="head-list">${s.items.map(x=>`<div class="head-item"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div>`;
  if(s.type==='refs') html+=`<h2 class="title">${esc(s.title)}</h2><div class="refs-list">${s.items.map(x=>`<div class="ref"><strong>${esc(x[0])}.</strong> ${esc(x[1])}</div>`).join('')}</div>`;
  article.innerHTML=html+'</div>';
  deck.appendChild(article);
  return article;
}
const nodes=slides.map(renderSlide);
let current=0;
const counter=document.getElementById('counter');
const progress=document.getElementById('progress');
const notes=document.getElementById('notes');
const notesBody=document.getElementById('notes-body');
const overview=document.getElementById('overview');
const overviewGrid=document.getElementById('overview-grid');
function labelFor(s){return s.title||s.prompt||s.text||'Slide';}
slides.forEach((s,i)=>{const b=document.createElement('button');b.className='overview-card';b.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')} / ${slides.length}</span><span class="label">${esc(labelFor(s))}</span>`;b.addEventListener('click',()=>{closePanels();show(i)});overviewGrid.appendChild(b)});
const cards=[...overviewGrid.children];
function show(i){current=Math.max(0,Math.min(slides.length-1,i));nodes.forEach((n,j)=>n.classList.toggle('active',j===current));cards.forEach((n,j)=>n.classList.toggle('current',j===current));counter.textContent=`${current+1} / ${slides.length}`;progress.style.width=`${((current+1)/slides.length)*100}%`;notesBody.textContent=slides[current].notes||'No notes for this slide.';document.title=`${current+1}/${slides.length} · Justice for Everyone`;}
function openPanel(panel){closePanels();panel.classList.add('open');}
function closePanels(){overview.classList.remove('open');notes.classList.remove('open');}
function togglePanel(panel){panel.classList.contains('open')?closePanels():openPanel(panel);}
function toggleFullscreen(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}
document.getElementById('fullscreen').addEventListener('click',toggleFullscreen);
document.querySelectorAll('.close').forEach(b=>b.addEventListener('click',closePanels));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanels();return;}if(overview.classList.contains('open')||notes.classList.contains('open')) return;if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();show(current+1);}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(current-1);}else if(e.key.toLowerCase()==='o') togglePanel(overview);else if(e.key.toLowerCase()==='n') togglePanel(notes);else if(e.key.toLowerCase()==='f') toggleFullscreen();});
let touchX=0,touchY=0;
document.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY;},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))show(current+(dx<0?1:-1));},{passive:true});
function fits(node){const inner=node.querySelector('.slide-inner');return inner.scrollHeight<=node.clientHeight*.82&&inner.scrollWidth<=node.clientWidth*.92;}
function fitNode(node,start=1){let f=start;node.classList.add('measuring');node.style.setProperty('--fit',f);while(f>.72&&!fits(node)){f-=.02;node.style.setProperty('--fit',f);}node.classList.remove('measuring');return f;}
function fitAll(){nodes.forEach(n=>n.style.setProperty('--fit',1));const groups={};nodes.forEach(n=>{if(n.dataset.buildGroup)(groups[n.dataset.buildGroup]??=[]).push(n);});const grouped=new Set(Object.values(groups).flat());Object.values(groups).forEach(group=>{const final=group[group.length-1];const f=fitNode(final);group.forEach(n=>n.style.setProperty('--fit',f));});nodes.filter(n=>!grouped.has(n)).forEach(n=>fitNode(n));show(current);}
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fitAll,120);});
if(document.fonts?.ready)document.fonts.ready.then(fitAll);else fitAll();
show(0);

</script>
