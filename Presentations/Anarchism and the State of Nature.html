<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anarchism and the State of Nature</title>
  <link rel="stylesheet" href="presentation-polish.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#f4f0e7;
      --paper-deep:#e8ded0;
      --paper-warm:#efe4d5;
      --ink:#202530;
      --muted:#686762;
      --blue:#2848d6;
      --blue-deep:#1f338f;
      --red:#d85d4d;
      --yellow:#d5ab42;
      --line:rgba(32,37,48,.2);
      --soft-blue:rgba(40,72,214,.09);
      --soft-red:rgba(216,93,77,.10);
      --fit:1;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink)}
    body{font-family:"Manrope",system-ui,sans-serif}
    button{font:inherit}
    #deck{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:
        radial-gradient(circle at 93% 6%,rgba(216,93,77,.12),transparent 24%),
        radial-gradient(circle at 6% 96%,rgba(40,72,214,.08),transparent 28%),
        linear-gradient(135deg,var(--paper) 0%,#f7f3eb 56%,#eee3d4 100%);
    }
    #deck::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:.32;
      background-image:
        linear-gradient(90deg,rgba(32,37,48,.05) 1px,transparent 1px),
        linear-gradient(0deg,rgba(32,37,48,.035) 1px,transparent 1px);
      background-size:8vw 8vw;
      mask-image:linear-gradient(90deg,black,transparent 82%);
    }
    #deck::after{
      content:"";
      position:absolute;
      right:-18vw;
      top:-18vw;
      width:48vw;
      height:48vw;
      border:1px solid rgba(40,72,214,.18);
      border-radius:50%;
      box-shadow:0 0 0 7vw rgba(40,72,214,.035),0 0 0 14vw rgba(216,93,77,.03);
      pointer-events:none;
    }
    .slide{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding:7vh 5vw 8vh;
      text-align:left;
      overflow:hidden;
    }
    .slide.active,.slide.measuring{display:flex}
    .slide.measuring{visibility:hidden;pointer-events:none}
    .slide.top{align-items:flex-start;padding-top:8vh}
    .slide-inner{
      position:relative;
      z-index:1;
      width:min(1320px,89vw);
      max-height:82vh;
      margin:auto;
      transform-origin:top center;
    }
    .slide.top .slide-inner{margin:0 auto}
    .eyebrow{
      margin:0 0 1rem;
      color:var(--blue);
      font:500 calc(clamp(11px,1vw,15px)*var(--fit))/1.25 "DM Mono",monospace;
      letter-spacing:.17em;
      text-transform:uppercase;
    }
    .title{
      margin:0;
      color:var(--ink);
      font-family:"Fraunces",Georgia,serif;
      font-weight:600;
      letter-spacing:-.035em;
    }
    .lead{
      max-width:62ch;
      margin:1.2rem 0 0;
      color:var(--muted);
      font:500 calc(clamp(20px,1.7vw,27px)*var(--fit))/1.34 "Manrope",system-ui,sans-serif;
    }
    .footnote{
      margin:1.7rem 0 0;
      max-width:74ch;
      padding:.8rem 0 0 1rem;
      border-left:3px solid var(--yellow);
      color:var(--muted);
      font:600 calc(clamp(14px,1.15vw,18px)*var(--fit))/1.4 "DM Mono",monospace;
    }
    .body-copy{
      color:var(--ink);
      font:500 calc(clamp(20px,1.72vw,28px)*var(--fit))/1.35 "Manrope",system-ui,sans-serif;
    }
    .body-copy p{margin:0 0 1rem}
    .body-copy p:last-child{margin-bottom:0}
    .body-copy strong{color:var(--blue-deep);font-weight:800}

    /* Cover */
    .cover{padding:5vh 5vw 7vh}
    .cover .slide-inner{
      width:min(1380px,90vw);
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(390px,.92fr);
      gap:clamp(3rem,7vw,7rem);
      align-items:center;
    }
    .cover-copy{
      padding:1.8rem 0 2rem clamp(1.5rem,3vw,3.2rem);
      border-left:12px solid var(--blue);
    }
    .cover .title{
      max-width:9ch;
      font-size:calc(clamp(64px,8vw,128px)*var(--fit));
      line-height:.88;
    }
    .cover .work{
      max-width:24ch;
      margin:1.7rem 0 0;
      color:var(--muted);
      font:500 calc(clamp(21px,2vw,30px)*var(--fit))/1.25 "Fraunces",Georgia,serif;
    }
    .cover .course{
      display:inline-block;
      margin-top:2.25rem;
      padding:.48rem .65rem;
      border-top:1px solid var(--ink);
      border-bottom:1px solid var(--ink);
      color:var(--ink);
      font:500 calc(clamp(11px,1vw,14px)*var(--fit))/1.35 "DM Mono",monospace;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .cover-art{
      position:relative;
      margin:0;
      padding:.7rem;
      background:var(--paper-warm);
      border:1px solid rgba(32,37,48,.28);
      border-radius:1rem 4.5rem 1rem 4.5rem;
      box-shadow:15px 16px 0 rgba(216,93,77,.18);
      transform:rotate(1.2deg);
    }
    .cover-art::before{
      content:"";
      position:absolute;
      left:-1.2rem;
      bottom:1.4rem;
      width:2.4rem;
      height:2.4rem;
      background:var(--yellow);
      z-index:-1;
    }
    .cover-art img{
      display:block;
      width:100%;
      aspect-ratio:1.47;
      object-fit:cover;
      border-radius:.45rem 3.6rem .45rem 3.6rem;
    }
    .cover-art figcaption{
      margin:.65rem .25rem .05rem;
      color:var(--muted);
      font:500 calc(clamp(10px,.85vw,13px)*var(--fit))/1.3 "DM Mono",monospace;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    /* Shared slide titles */
    .framing .title,.compare .title,.process .title,.feature .title,.sequence .title,
    .dual .title,.sanctions .title,.authority .title,.scale .title,.table-slide .title,
    .dilemma .title,.spectrum .title,.history .title,.strategies .title,.final .title,
    .refs .title{
      max-width:20ch;
      font-size:calc(clamp(42px,5vw,79px)*var(--fit));
      line-height:.97;
    }
    .framing .slide-inner,.compare .slide-inner,.process .slide-inner,.feature .slide-inner,
    .sequence .slide-inner,.dual .slide-inner,.sanctions .slide-inner,.authority .slide-inner,
    .scale .slide-inner,.table-slide .slide-inner,.dilemma .slide-inner,.spectrum .slide-inner,
    .history .slide-inner,.strategies .slide-inner,.final .slide-inner,.refs .slide-inner{
      padding-bottom:1rem;
    }

    /* Framing and comparisons */
    .framing-grid{
      display:grid;
      grid-template-columns:1.08fr .92fr;
      gap:clamp(2rem,7vw,7rem);
      margin-top:2.4rem;
    }
    .framing-block{
      padding:1.1rem 0 0 1.25rem;
      border-top:2px solid var(--ink);
      border-left:1px solid var(--line);
    }
    .framing-block:nth-child(2){border-top-color:var(--red)}
    .framing-block h3,.compare-label,.process-step h3,.sanction h3,.authority-col h3,
    .dilemma-option h3,.strategy-row h3,.question-label{
      margin:0 0 .65rem;
      color:var(--blue-deep);
      font:800 calc(clamp(13px,1.2vw,18px)*var(--fit))/1.2 "DM Mono",monospace;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .framing-block:nth-child(2) h3,.dilemma-option:nth-child(2) h3{color:var(--red)}
    .framing-block p{margin:0;max-width:30ch;color:var(--ink);font:500 calc(clamp(23px,2vw,31px)*var(--fit))/1.25 "Fraunces",Georgia,serif}
    .compare-rows{margin-top:2rem;border-top:1px solid var(--line)}
    .compare-row{
      display:grid;
      grid-template-columns:minmax(11rem,.55fr) minmax(0,1.35fr);
      gap:2rem;
      align-items:baseline;
      padding:1.05rem 0;
      border-bottom:1px solid var(--line);
    }
    .compare-row p{margin:0;color:var(--ink);font:500 calc(clamp(19px,1.58vw,25px)*var(--fit))/1.3 "Manrope",system-ui,sans-serif}

    /* Steps */
    .process .lead{max-width:56ch}
    .process-list{margin-top:2rem;border-top:1px solid var(--line)}
    .process-step{
      display:grid;
      grid-template-columns:3.8rem minmax(9rem,.48fr) minmax(0,1.25fr);
      gap:1.4rem;
      align-items:baseline;
      padding:1rem 0;
      border-bottom:1px solid var(--line);
    }
    .process-step .number,.sequence-row .number{
      color:var(--red);
      font:800 calc(clamp(28px,2.5vw,39px)*var(--fit))/1 "Fraunces",Georgia,serif;
    }
    .process-step h3{margin:0;color:var(--ink);letter-spacing:0;text-transform:none;font-family:"Fraunces",Georgia,serif;font-size:calc(clamp(22px,1.8vw,29px)*var(--fit));font-weight:600}
    .process-step p{margin:0;color:var(--muted);font:500 calc(clamp(18px,1.4vw,23px)*var(--fit))/1.32 "Manrope",system-ui,sans-serif}

    /* Feature slide */
    .feature-grid{display:grid;grid-template-columns:.72fr 1.28fr;gap:clamp(2rem,8vw,8rem);align-items:end;margin-top:2.5rem}
    .feature-word{color:var(--blue);font:800 calc(clamp(52px,8vw,122px)*var(--fit))/.78 "DM Mono",monospace;letter-spacing:-.1em;overflow-wrap:anywhere}
    .feature-word small{display:block;margin-top:1.1rem;color:var(--red);font:800 calc(clamp(13px,1.1vw,17px)*var(--fit))/1.2 "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
    .feature-copy{padding-top:1.25rem;border-top:2px solid var(--blue)}
    .feature-copy p{margin:0 0 1.2rem;color:var(--ink);font:500 calc(clamp(23px,1.95vw,31px)*var(--fit))/1.25 "Fraunces",Georgia,serif}
    .feature-copy p:last-child{margin-bottom:0}
    .feature-callout{margin-top:1.25rem;padding:.8rem 0 .8rem 1rem;border-left:3px solid var(--yellow);color:var(--muted);font:700 calc(clamp(14px,1.15vw,18px)*var(--fit))/1.35 "DM Mono",monospace}

    /* Sequence and dual slides */
    .sequence .lead{max-width:52ch}
    .sequence-row{display:grid;grid-template-columns:3.8rem minmax(12rem,.5fr) minmax(0,1.15fr);gap:1.4rem;align-items:baseline;padding:1rem 0;border-bottom:1px solid var(--line)}
    .sequence-list{margin-top:2rem;border-top:1px solid var(--line)}
    .sequence-row h3{margin:0;color:var(--ink);font:600 calc(clamp(23px,1.8vw,29px)*var(--fit))/1.2 "Fraunces",Georgia,serif}
    .sequence-row p{margin:0;color:var(--muted);font:500 calc(clamp(18px,1.38vw,22px)*var(--fit))/1.32 "Manrope",system-ui,sans-serif}
    .dual-grid,.authority-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,6vw,6rem);margin-top:2.3rem}
    .dual-col,.authority-col{padding-top:1.15rem;border-top:2px solid var(--blue)}
    .dual-col:nth-child(2),.authority-col:nth-child(2){border-top-color:var(--red)}
    .dual-col h3,.authority-col h3{margin-bottom:.8rem}
    .dual-col p,.authority-col p{margin:0 0 1rem;color:var(--ink);font:500 calc(clamp(22px,1.85vw,30px)*var(--fit))/1.26 "Fraunces",Georgia,serif}
    .dual-col p:last-child,.authority-col p:last-child{margin-bottom:0}
    .dual-callout{grid-column:1/-1;margin-top:-1.1rem;padding:1rem 1.15rem;border-left:5px solid var(--yellow);background:rgba(213,171,66,.1);color:var(--ink);font:700 calc(clamp(15px,1.25vw,20px)*var(--fit))/1.35 "DM Mono",monospace}

    /* Social control */
    .sanctions .lead{max-width:60ch}
    .sanction-list{margin-top:2.1rem;border-top:1px solid var(--line)}
    .sanction{display:grid;grid-template-columns:minmax(12rem,.48fr) minmax(0,1.45fr);gap:2rem;align-items:baseline;padding:1rem 0;border-bottom:1px solid var(--line)}
    .sanction h3{margin:0;color:var(--red)}
    .sanction p{margin:0;color:var(--ink);font:500 calc(clamp(20px,1.62vw,26px)*var(--fit))/1.28 "Fraunces",Georgia,serif}

    /* Scale */
    .scale-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(2rem,7vw,7rem);margin-top:2.2rem;align-items:start}
    .scale-list{display:grid;grid-template-columns:1fr 1fr;column-gap:2rem;border-top:1px solid var(--line)}
    .scale-item{padding:1rem 0;border-bottom:1px solid var(--line)}
    .scale-item b{display:block;color:var(--blue-deep);font:800 calc(clamp(14px,1.1vw,17px)*var(--fit))/1.2 "DM Mono",monospace;letter-spacing:.06em;text-transform:uppercase}
    .scale-item span{display:block;margin-top:.35rem;color:var(--ink);font:500 calc(clamp(20px,1.5vw,24px)*var(--fit))/1.25 "Fraunces",Georgia,serif}
    .war-callout{padding:1.3rem 1.45rem;border:1px solid var(--line);border-left:8px solid var(--red);background:rgba(216,93,77,.08)}
    .war-callout .big{display:block;margin-bottom:.75rem;color:var(--red);font:800 calc(clamp(43px,5.5vw,78px)*var(--fit))/.82 "Fraunces",Georgia,serif;letter-spacing:-.06em}
    .war-callout p{margin:0;color:var(--ink);font:600 calc(clamp(16px,1.32vw,21px)*var(--fit))/1.4 "Manrope",system-ui,sans-serif}

    /* Tables */
    .table-lead{margin-top:1.1rem;max-width:62ch;color:var(--muted);font:500 calc(clamp(18px,1.45vw,23px)*var(--fit))/1.32 "Manrope",system-ui,sans-serif}
    .comparison-table{width:100%;margin-top:1.65rem;border-collapse:collapse;font-size:calc(clamp(15px,1.22vw,19px)*var(--fit));line-height:1.32}
    .comparison-table th,.comparison-table td{padding:.85rem .9rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
    .comparison-table thead th{color:var(--blue-deep);border-top:2px solid var(--ink);font:800 calc(clamp(12px,1.02vw,15px)*var(--fit))/1.2 "DM Mono",monospace;letter-spacing:.06em;text-transform:uppercase}
    .comparison-table tbody th{width:23%;color:var(--ink);font:800 calc(clamp(15px,1.22vw,19px)*var(--fit))/1.25 "Manrope",system-ui,sans-serif}
    .comparison-table tbody td{color:var(--ink);font:500 calc(clamp(15px,1.22vw,19px)*var(--fit))/1.32 "Manrope",system-ui,sans-serif}
    .comparison-table tbody tr:nth-child(even){background:rgba(40,72,214,.045)}

    /* Dilemma and spectrum */
    .dilemma .lead{max-width:65ch}
    .dilemma-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,6vw,6rem);margin-top:2.1rem}
    .dilemma-option{padding:1.25rem 1.4rem 1.3rem;border-top:7px solid var(--blue);background:rgba(40,72,214,.07)}
    .dilemma-option:nth-child(2){border-top-color:var(--red);background:rgba(216,93,77,.075)}
    .dilemma-option h3{margin-bottom:.85rem}
    .dilemma-option p{margin:0;color:var(--ink);font:500 calc(clamp(21px,1.72vw,28px)*var(--fit))/1.27 "Fraunces",Georgia,serif}
    .dilemma-result{margin-top:1.6rem;padding:.9rem 1.1rem;border-bottom:1px solid var(--ink);border-top:1px solid var(--ink);color:var(--ink);font:700 calc(clamp(15px,1.25vw,20px)*var(--fit))/1.35 "DM Mono",monospace}
    .spectrum .lead{max-width:65ch}
    .spectrum-wrap{margin-top:2.2rem;padding:1.3rem 0 0}
    .spectrum-line{position:relative;height:2px;background:var(--ink);margin:2.1rem 6% 0}
    .spectrum-stop{position:absolute;top:0;transform:translate(-50%,-50%);width:1.2rem;height:1.2rem;border-radius:50%;background:var(--paper);border:4px solid var(--blue)}
    .spectrum-stop:nth-child(2){left:50%;border-color:var(--yellow)}
    .spectrum-stop:nth-child(3){left:100%;border-color:var(--red)}
    .spectrum-labels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2rem;margin-top:1.2rem}
    .spectrum-label{padding-top:.8rem;border-top:1px solid var(--line)}
    .spectrum-label:nth-child(2){text-align:center}
    .spectrum-label:nth-child(3){text-align:right}
    .spectrum-label b{display:block;color:var(--ink);font:800 calc(clamp(14px,1.18vw,18px)*var(--fit))/1.2 "DM Mono",monospace;letter-spacing:.05em;text-transform:uppercase}
    .spectrum-label span{display:block;margin-top:.4rem;color:var(--muted);font:500 calc(clamp(17px,1.35vw,22px)*var(--fit))/1.28 "Fraunces",Georgia,serif}
    .spectrum-note{margin-top:2rem;max-width:68ch;color:var(--muted);font:600 calc(clamp(14px,1.18vw,18px)*var(--fit))/1.4 "DM Mono",monospace}

    /* History */
    .history-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.95fr);gap:clamp(2.5rem,7vw,7rem);align-items:center;margin-top:1.5rem}
    .history-copy .body-copy{max-width:52ch}
    .history-points{margin-top:1.45rem;border-top:1px solid var(--line)}
    .history-point{padding:.85rem 0;border-bottom:1px solid var(--line);color:var(--ink);font:600 calc(clamp(16px,1.32vw,21px)*var(--fit))/1.35 "Manrope",system-ui,sans-serif}
    .history-point b{color:var(--blue-deep)}
    .history-art{margin:0;padding:.65rem;background:var(--paper-warm);border:1px solid var(--line);border-radius:3.5rem .8rem 3.5rem .8rem;box-shadow:-12px 13px 0 rgba(40,72,214,.13);transform:rotate(-1deg)}
    .history-art img{display:block;width:100%;aspect-ratio:1.3;object-fit:cover;border-radius:2.8rem .35rem 2.8rem .35rem}
    .history-art figcaption{margin:.6rem .25rem .1rem;color:var(--muted);font:500 calc(clamp(10px,.85vw,13px)*var(--fit))/1.3 "DM Mono",monospace;letter-spacing:.04em;text-transform:uppercase}

    /* Strategies and final */
    .strategy-list{margin-top:2rem;border-top:2px solid var(--ink)}
    .strategy-row{display:grid;grid-template-columns:minmax(12rem,.75fr) minmax(11rem,.8fr) minmax(0,1.2fr);gap:1.6rem;padding:1rem 0;border-bottom:1px solid var(--line);align-items:start}
    .strategy-row h3{margin:0;color:var(--ink);font:600 calc(clamp(21px,1.65vw,27px)*var(--fit))/1.18 "Fraunces",Georgia,serif;letter-spacing:0;text-transform:none}
    .strategy-row p{margin:0;color:var(--muted);font:500 calc(clamp(16px,1.3vw,21px)*var(--fit))/1.35 "Manrope",system-ui,sans-serif}
    .strategy-row .strength{color:var(--blue-deep)}
    .strategy-row .problem{color:var(--red)}
    .final-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,6vw,6rem);margin-top:2.3rem}
    .question-block{padding-top:1.1rem;border-top:2px solid var(--blue)}
    .question-block:nth-child(2){border-top-color:var(--red)}
    .question-label{margin-bottom:.7rem}
    .question-block p{margin:0;color:var(--ink);font:500 calc(clamp(23px,1.92vw,31px)*var(--fit))/1.25 "Fraunces",Georgia,serif}
    .final-takeaway{margin-top:2rem;padding:1rem 1.2rem;border-left:8px solid var(--yellow);background:rgba(213,171,66,.11);color:var(--ink);font:800 calc(clamp(17px,1.42vw,23px)*var(--fit))/1.35 "Manrope",system-ui,sans-serif}
    .tension-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,7vw,7rem);margin-top:2.4rem}
    .tension-col{padding-top:1rem;border-top:5px solid var(--blue)}
    .tension-col:nth-child(2){border-top-color:var(--red)}
    .tension-col h3{margin:0 0 .7rem;color:var(--ink);font:800 calc(clamp(14px,1.18vw,18px)*var(--fit))/1.2 "DM Mono",monospace;letter-spacing:.06em;text-transform:uppercase}
    .tension-col p{margin:0;color:var(--ink);font:500 calc(clamp(25px,2.05vw,34px)*var(--fit))/1.2 "Fraunces",Georgia,serif}
    .central-question{margin-top:2.1rem;max-width:29ch;color:var(--blue-deep);font:600 calc(clamp(28px,3vw,46px)*var(--fit))/1.08 "Fraunces",Georgia,serif}
    .final-note{margin-top:1.3rem;color:var(--muted);font:600 calc(clamp(14px,1.12vw,18px)*var(--fit))/1.38 "DM Mono",monospace}
    .refs .title{max-width:none}
    .refs-list{margin-top:1.8rem;border-top:1px solid var(--line)}
    .ref{padding:1rem 0;border-bottom:1px solid var(--line);color:var(--ink);font:500 calc(clamp(19px,1.5vw,24px)*var(--fit))/1.35 "Manrope",system-ui,sans-serif}
    .ref strong{color:var(--blue-deep);font-weight:800}

    #progress{position:fixed;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,var(--blue),var(--red));z-index:30}
    #nav-hint,#counter{position:fixed;bottom:18px;z-index:30;color:var(--muted);font:500 11px/1.3 "DM Mono",monospace;letter-spacing:.08em}
    #nav-hint{left:24px}#counter{right:24px}

    .panel.open{display:block}

    #overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;padding:20px}
    .overview-card{min-height:126px;padding:16px;text-align:left;background:rgba(232,222,208,.56);border:1px solid var(--line);color:var(--ink);cursor:pointer}
    .overview-card:hover,.overview-card.current{border-color:var(--blue);box-shadow:inset 5px 0 var(--blue)}
    .overview-card .num{display:block;color:var(--red);font:500 11px/1.3 "DM Mono",monospace;margin-bottom:12px}
    .overview-card .label{display:block;font:600 22px/1.1 "Fraunces",Georgia,serif}
    #notes-body{padding:28px 34px;white-space:pre-wrap;color:var(--ink);font:400 17px/1.62 "Manrope",system-ui,sans-serif;max-width:900px}
    @media (max-width:760px){
      .slide{padding:9vh 8vw 10vh}.slide.top{padding-top:9.5vh}.slide-inner{width:84vw}
      .cover .slide-inner,.framing-grid,.feature-grid,.scale-grid,.history-grid{grid-template-columns:1fr;gap:1.9rem}
      .cover-copy{padding-left:1.2rem;border-left-width:8px}.cover .title{max-width:10ch}.cover-art{max-width:620px;margin:0 auto}
      .framing-grid,.dual-grid,.authority-grid,.dilemma-grid,.final-grid,.tension-grid{gap:1.5rem}
      .process-step,.sequence-row,.sanction,.compare-row,.strategy-row{grid-template-columns:2.5rem 1fr;gap:.8rem}
      .process-step p,.sequence-row p,.sanction p,.compare-row p,.strategy-row p{grid-column:2}
      .process-step h3,.sequence-row h3,.sanction h3,.compare-label,.strategy-row h3{grid-column:2}
      .scale-list{grid-template-columns:1fr}.spectrum-labels{gap:.8rem}.spectrum-label span{font-size:calc(15px*var(--fit))}
      .comparison-table{font-size:calc(13px*var(--fit))}.comparison-table th,.comparison-table td{padding:.65rem .45rem}
      #nav-hint{display:none}#fullscreen{top:12px;right:12px}.cover-art figcaption,.history-art figcaption{font-size:calc(10px*var(--fit))}
    }

  <script>
    const sourceBasis = 'Provided notes: “Anarchism and the State of Nature — Comprehensive Notes.”';
    const note = (section, body='', visual='') => `${body}${body && visual ? '\n\n' : ''}${visual}${body || visual ? '\n\n' : ''}[Sources]\n${sourceBasis}\nSection: ${section}.\n[/Sources]`;

    const slides = [
      {
        type:'cover',
        title:'Anarchism and the State of Nature',

        course:'Political Philosophy · Module 1',

      },
      {
        type:'framing',
        eyebrow:'The question',
        title:'Anarchism challenges the traditional state-of-nature conclusion',

      {

      },
      {
        type:'process',

        title:'Godwin locates the stateless ideal in the future',

        steps:[

          {number:'02',title:'Greater cooperation',text:'More rational people can recognize that shared life does not require domination.'},
          {number:'03',title:'Less need for coercion',text:'As cooperation becomes reliable, formal political restraint loses its purpose.'},
          {number:'04',title:'A future without the state',text:'Godwin imagines stateless society as an achievement still ahead of humanity.'}

      },
      {
        type:'feature',
        eyebrow:'Strategy 1',
        title:'Kropotkin treats mutual aid as a source of fitness',
        word:'MUTUAL AID',
        wordNote:'Cooperation can be adaptive',
        paragraphs:[
          'Peter Kropotkin argues that cooperation appears throughout the animal world and can improve a group’s chances of survival.',

        callout:'Kropotkin’s move: the “fittest” can be a group that coordinates effectively, not only an individual that defeats its rivals.',

      },
      {
        type:'sequence',
        eyebrow:'Cooperation without virtue',
        title:'Cooperation can emerge from self-interest',
        lead:'Anarchism does not have to assume that every person is morally perfect. Repeated interaction can make cooperation rational for people who still pursue their own interests.',

          {number:'02',title:'Conflict becomes costly',text:'Fighting and theft invite retaliation and make everyone less secure.'},
          {number:'03',title:'Agreements become useful',text:'Keeping promises makes behavior more predictable and makes long-term projects possible.'},
          {number:'04',title:'Reciprocity can stabilize trust',text:'Helping others can encourage help in return, even without altruistic motives.'}

        foot:'This is one of the strongest anarchist arguments because it does not depend entirely on idealized human goodness.',

      },
      {

          {label:'Defense',text:'Respond to threats from outside the community.'},

          content = `<p class="eyebrow">${esc(slide.eyebrow)}</p><h2 class="title">${esc(slide.title)}</h2><p class="table-lead">${esc(slide.lead)}</p><table class="comparison-table"><thead><tr>${slide.headers.map(header => `<th scope="col">${esc(header)}</th>`).join('')}</tr></thead><tbody>${slide.rows.map(row => `<tr><th scope="row">${esc(row[0])}</th><td>${esc(row[1])}</td></tr>`).join('')}</tbody></table>`;
        } else {
          content = `<p class="eyebrow">${esc(slide.eyebrow)}</p><h2 class="title">${esc(slide.title)}</h2><p class="table-lead">${esc(slide.lead)}</p><table class="comparison-table"><thead><tr>${slide.headers.map(header => `<th scope="col">${esc(header)}</th>`).join('')}</tr></thead><tbody>${slide.rows.map(row => `<tr>${row.map((cell,cellIndex) => cellIndex === 0 ? `<th scope="row">${esc(cell)}</th>` : `<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
        }
      }
      if(slide.type === 'dilemma'){
        content = `<p class="eyebrow">${esc(slide.eyebrow)}</p><h2 class="title">${esc(slide.title)}</h2><p class="lead">${esc(slide.lead)}</p><div class="dilemma-grid">${slide.options.map(option => `<div class="dilemma-option"><h3>${esc(option.label)}</h3><p>${esc(option.text)}</p></div>`).join('')}</div><div class="dilemma-result">${esc(slide.result)}</div>`;
      }
      if(slide.type === 'spectrum'){
        content = `<p class="eyebrow">${esc(slide.eyebrow)}</p><h2 class="title">${esc(slide.title)}</h2><p class="lead">${esc(slide.lead)}</p><div class="spectrum-wrap"><div class="spectrum-line"><span class="spectrum-stop" style="left:0"></span><span class="spectrum-stop"></span><span class="spectrum-stop"></span></div><div class="spectrum-labels">${slide.labels.map(label => `<div class="spectrum-label"><b>${esc(label.label)}</b><span>${esc(label.text)}</span></div>`).join('')}</div><p class="spectrum-note">${esc(slide.noteText)}</p></div>`;
      }
      if(slide.type === 'history'){
        content = `<p class="eyebrow">${esc(slide.eyebrow)}</p><h2 class="title">${esc(slide.title)}</h2><div class="history-grid"><div class="history-copy"><p class="lead">${esc(slide.lead)}</p><div class="history-points">${slide.points.map(point => `<div class="history-point"><b>${esc(point.label)}:</b> ${esc(point.text)}</div>`).join('')}</div></div><figure class="history-art"><img src="${esc(slide.image)}" alt="${esc(slide.alt)}"><figcaption>Large-scale coordination without one command center</figcaption></figure></div>`;
      }
      if(slide.type === 'strategies'){
        content = `<p class="eyebrow">${esc(slide.eyebrow)}</p><h2 class="title">${esc(slide.title)}</h2><div class="strategy-list">${slide.rows.map(row => `<div class="strategy-row"><h3>${esc(row.title)}</h3><p class="strength">${esc(row.strength)}</p><p class="problem">${esc(row.problem)}</p></div>`).join('')}</div><p class="footnote">${esc(slide.foot)}</p>`;
      }
      if(slide.type === 'final'){
        if(slide.questions){
          content = `<p class="eyebrow">${esc(slide.eyebrow)}</p><h2 class="title">${esc(slide.title)}</h2><p class="lead">${esc(slide.lead)}</p><div class="final-grid">${slide.questions.map(question => `<div class="question-block"><div class="question-label">${esc(question.label)}</div><p>${esc(question.text)}</p></div>`).join('')}</div><div class="final-takeaway">${esc(slide.takeaway)}</div>`;
        } else {
          content = `<p class="eyebrow">${esc(slide.eyebrow)}</p><h2 class="title">${esc(slide.title)}</h2><div class="tension-grid">${slide.tensions.map(tension => `<div class="tension-col"><h3>${esc(tension.label)}</h3><p>${esc(tension.text)}</p></div>`).join('')}</div><div class="central-question">${esc(slide.central)}</div><p class="final-note">${esc(slide.finalNote)}</p>`;
        }
      }
      if(slide.type === 'refs'){
        content = `<p class="eyebrow">${esc(slide.eyebrow)}</p><h2 class="title">${esc(slide.title)}</h2><div class="refs-list">${slide.items.map(item => `<div class="ref"><strong>${esc(item.label)}.</strong> ${esc(item.text)}</div>`).join('')}</div>`;
      }

      article.innerHTML = `<div class="slide-inner">${content}</div>`;
      deck.appendChild(article);
      return article;
    }

    const nodes = slides.map(renderSlide);
    const counter = document.getElementById('counter');
    const progress = document.getElementById('progress');
    const notesPanel = document.getElementById('notes');
    const notesBody = document.getElementById('notes-body');
    const overview = document.getElementById('overview');
    const overviewGrid = document.getElementById('overview-grid');
    const cards = slides.map((slide,index) => {
      const button = document.createElement('button');
      button.className = 'overview-card';
      button.innerHTML = `<span class="num">${String(index+1).padStart(2,'0')} / ${slides.length}</span><span class="label">${esc(slide.title)}</span>`;
      button.addEventListener('click',()=>{closePanels();show(index)});
      overviewGrid.appendChild(button);
      return button;
    });

    let current = 0;
    function show(index){
      current = Math.max(0,Math.min(slides.length-1,index));
      nodes.forEach((node,nodeIndex)=>node.classList.toggle('active',nodeIndex===current));
      cards.forEach((card,cardIndex)=>card.classList.toggle('current',cardIndex===current));
      counter.textContent = `${current+1} / ${slides.length}`;
      progress.style.width = `${((current+1)/slides.length)*100}%`;
      notesBody.textContent = slides[current].notes || 'No notes for this slide.';
      document.title = `${current+1}/${slides.length} · Anarchism and the State of Nature`;
    }
    window.show = show;
    function closePanels(){overview.classList.remove('open');notesPanel.classList.remove('open')}
    function togglePanel(panel){panel.classList.contains('open') ? closePanels() : (closePanels(),panel.classList.add('open'))}
    function toggleFullscreen(){document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{})}
    document.getElementById('fullscreen').addEventListener('click',toggleFullscreen);
    document.querySelectorAll('.close').forEach(button=>button.addEventListener('click',closePanels));
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'){closePanels();return}
      if(overview.classList.contains('open') || notesPanel.classList.contains('open')) return;
      if(['ArrowRight','ArrowDown',' ','PageDown'].includes(event.key)){event.preventDefault();show(current+1)}
      else if(['ArrowLeft','ArrowUp','PageUp'].includes(event.key)){event.preventDefault();show(current-1)}
      else if(event.key.toLowerCase()==='o') togglePanel(overview)
      else if(event.key.toLowerCase()==='n') togglePanel(notesPanel)
      else if(event.key.toLowerCase()==='f') toggleFullscreen()
    });
    let touchX=0,touchY=0;
    document.addEventListener('touchstart',event=>{touchX=event.changedTouches[0].screenX;touchY=event.changedTouches[0].screenY},{passive:true});
    document.addEventListener('touchend',event=>{const dx=event.changedTouches[0].screenX-touchX,dy=event.changedTouches[0].screenY-touchY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))show(current+(dx<0?1:-1))},{passive:true});
    function fits(node){const inner=node.querySelector('.slide-inner');return inner.scrollHeight<=node.clientHeight*.82&&inner.scrollWidth<=node.clientWidth*.92}
    function fitNode(node,start=1){let fit=start;node.classList.add('measuring');node.style.setProperty('--fit',fit);while(fit>.72&&!fits(node)){fit=Math.max(.72,fit-.02);node.style.setProperty('--fit',fit.toFixed(3))}node.classList.remove('measuring');return fit}
    function fitAll(){nodes.forEach(node=>node.style.setProperty('--fit',1));nodes.forEach(node=>fitNode(node));show(current)}
    let resizeTimer;
    window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fitAll,120)});
    if(document.fonts?.ready) document.fonts.ready.then(fitAll); else fitAll();
    show(0);
  </script>
</body>
</html>
