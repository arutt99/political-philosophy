 6vw 9vh}.slide.top{padding-top:7vh}.slide-inner,.slide.duo .slide-inner{width:min(92vw,980px)}.section .slide-inner,.question .slide-inner,.diagnostic .slide-inner{padding:1.7rem 1.5rem}.quote .slide-inner{padding:1rem 1.4rem}.duo-grid{grid-template-columns:1fr;gap:1rem}.head-item{grid-template-columns:1fr;gap:.45rem}.head-item b{padding-top:0}#nav-hint{display:none}}

<script>
const src=(p)=>`\n\n[Sources]\nJustice for Everyone, Everywhere - Justice Everywhere, ${p}.\n[/Sources]`;
const slides=[
 {type:'cover',title:'Justice everywhere?',work:'Borders, global inequality, and obligations to people not yet born',course:'JUSTICE FOR EVERYONE, EVERYWHERE',notes:'This deck reconstructs the argument’s movement from an interconnected global economy to justice across borders and across time.'+src('pp. 1-15')},
 {type:'question',eyebrow:'The opening tension',prompt:'If the goods we use link us to people everywhere, can justice stop at a border?',context:'The argument begins with ordinary global interdependence: products, materials, and services routinely cross countries before they reach anyone’s hands.',notes:'Pause on the fact that interdependence is ordinary rather than exceptional.'+src('pp. 1-2')},
 {type:'section',eyebrow:'I. THE WORLD WE USE IS ALREADY CONNECTED',title:'The world we use is already connected',notes:'The opening section establishes why a theory focused only on a single state is incomplete.'+src('pp. 1-2')},
 {type:'content',title:'Everyday life quietly crosses national borders',paragraphs:['Materials, components, and services often originate in countries far from where the finished good is bought or used.'],buildGroup:'interdependence',notes:'The argument uses global supply chains and the example of potatoes to make interdependence concrete.'+src('p. 1')},
 {type:'content',title:'Everyday life quietly crosses national borders',paragraphs:['Materials, components, and services often originate in countries far from where the finished good is bought or used.','A person can live inside one state’s legal system while depending every day on labor, resources, and decisions that extend far beyond it.'],buildGroup:'interdependence',notes:'Keep the focus on the contrast between national political institutions and globally connected life.'+src('p. 1')},
 {type:'content',title:'Everyday life quietly crosses national borders',paragraphs:['Materials, components, and services often originate in countries far from where the finished good is bought or used.','A person can live inside one state’s legal system while depending every day on labor, resources, and decisions that extend far beyond it.','That mismatch raises a new political question: which duties of justice, if any, cross the borders that divide states?'],buildGroup:'interdependence',notes:'This is the pivot from description to the argument about global justice.'+src('pp. 1-2')},
 {type:'content',title:'Global inequality makes the question urgent',paragraphs:['The argument points to extraordinary gaps between the wealth of the global super-rich and the circumstances of people living in extreme poverty.'],buildGroup:'poverty',notes:'The source reports Oxfam’s 2021 comparison and then turns to extreme poverty; the claim is presented as reported in the argument.'+src('p. 2')},
 {type:'content',title:'Global inequality makes the question urgent',paragraphs:['The argument points to extraordinary gaps between the wealth of the global super-rich and the circumstances of people living in extreme poverty.','Extreme poverty has fallen substantially over time, but the argument stresses that hundreds of millions of people still face hunger, malnutrition, and preventable deprivation.'],buildGroup:'poverty',notes:'Do not treat declining poverty as a reason to ignore those remaining in it.'+src('p. 2')},
 {type:'content',title:'Global inequality makes the question urgent',paragraphs:['The argument points to extraordinary gaps between the wealth of the global super-rich and the circumstances of people living in extreme poverty.','Extreme poverty has fallen substantially over time, but the argument stresses that hundreds of millions of people still face hunger, malnutrition, and preventable deprivation.','The debate is therefore not whether such suffering matters, but how to describe the wrong and what kind of duty follows from it.'],buildGroup:'poverty',notes:'This sentence frames the next distinction: injustice or charitable need.'+src('pp. 2-3')},
 {type:'question',eyebrow:'A distinction with consequences',prompt:'Is failing to help the global poor a failure of justice, or a failure of charity?',context:'Both answers can recognize a moral reason to help. The argument argues that the label matters because it changes who must act and how strongly.',notes:'The next slides define the disagreement before evaluating it.'+src('pp. 3-4')},
 {type:'section',eyebrow:'II. JUSTICE AND CHARITY DO NOT ASK THE SAME THING',title:'Justice and charity do not ask the same thing',notes:'The argument contrasts cosmopolitan and nationalist accounts of global obligation.'+src('pp. 3-6')},
 {type:'content',title:'Cosmopolitanism gives national borders no fundamental moral weight',paragraphs:['A philosophical cosmopolitan holds that principles of justice apply to all human beings in the same way, wherever they live.'],buildGroup:'cosmopolitan',notes:'Clarify that philosophical cosmopolitanism is a theory of justice, not a lifestyle label.'+src('p. 3')},
 {type:'content',title:'Cosmopolitanism gives national borders no fundamental moral weight',paragraphs:['A philosophical cosmopolitan holds that principles of justice apply to all human beings in the same way, wherever they live.','National borders may remain politically useful or historically important, yet they do not make one person morally more entitled to justice than another.'],buildGroup:'cosmopolitan',notes:'The argument calls this view a “citizen of the world” approach.'+src('p. 3')},
 {type:'content',title:'Cosmopolitanism gives national borders no fundamental moral weight',paragraphs:['A philosophical cosmopolitan holds that principles of justice apply to all human beings in the same way, wherever they live.','National borders may remain politically useful or historically important, yet they do not make one person morally more entitled to justice than another.','So, on this view, rich people and rich countries can owe duties of justice to the very poor wherever they are.'],buildGroup:'cosmopolitan',notes:'This is the source’s core cosmopolitan conclusion.'+src('p. 3')},
 {type:'content',title:'Nationalism locates most duties of justice inside a state',paragraphs:['A philosophical nationalist argues that national borders have moral significance even without requiring passionate loyalty to one’s own country.'],buildGroup:'nationalism',notes:'Distinguish the technical use of “nationalist” from ordinary patriotic or hostile uses.'+src('p. 3')},
 {type:'content',title:'Nationalism locates most duties of justice inside a state',paragraphs:['A philosophical nationalist argues that national borders have moral significance even without requiring passionate loyalty to one’s own country.','Within a state, the wealthy may owe the poor duties of justice; across states, assistance is normally understood as a moral duty of a different kind.'],buildGroup:'nationalism',notes:'The argument allows special circumstances, which later become important in the discussion of rectification.'+src('p. 3')},
 {type:'content',title:'Nationalism locates most duties of justice inside a state',paragraphs:['A philosophical nationalist argues that national borders have moral significance even without requiring passionate loyalty to one’s own country.','Within a state, the wealthy may owe the poor duties of justice; across states, assistance is normally understood as a moral duty of a different kind.','The usual nationalist claim is not that affluent people may ignore global poverty, but that the duty to help is charity rather than enforceable justice.'],buildGroup:'nationalism',notes:'This framing prevents the view from being reduced to indifference.'+src('pp. 3-4')},
 {type:'content',title:'Calling a duty justice changes the kind of action it can require',paragraphs:['Within a state, duties of justice are commonly enforced through institutions such as compulsory taxation.'],buildGroup:'enforceability',notes:'The argument uses taxation and publicly funded support as its example of enforceable justice.'+src('p. 4')},
 {type:'content',title:'Calling a duty justice changes the kind of action it can require',paragraphs:['Within a state, duties of justice are commonly enforced through institutions such as compulsory taxation.','Taxes can fund housing, medical care, education, and income support, and tax evasion can bring penalties because justice is treated as more than an optional gift.'],buildGroup:'enforceability',notes:'Emphasize that this is a contrast in institutional form, not a claim that charity has no value.'+src('p. 4')},
 {type:'content',title:'Calling a duty justice changes the kind of action it can require',paragraphs:['Within a state, duties of justice are commonly enforced through institutions such as compulsory taxation.','Taxes can fund housing, medical care, education, and income support, and tax evasion can bring penalties because justice is treated as more than an optional gift.','If global assistance is only charity, individuals decide whether and how much to give; if it is justice, political institutions may have a stronger role.'],buildGroup:'enforceability',notes:'This explains why the argument treats the terminology as consequential.'+src('p. 4')},
 {type:'duo',title:'The dispute concerns the reach of enforceable obligation',left:{label:'Cosmopolitan',text:'Equal humanity means that justice reaches poor people across national borders; the location of need is not a moral exemption.'},right:{label:'Nationalist',text:'Duties to fellow citizens are especially stringent because political communities have their own institutions, histories, and forms of cooperation.'},notes:'Both positions agree that the global poor deserve assistance; the disagreement is about justice’s scope.'+src('pp. 3-5')},
 {type:'question',eyebrow:'A pressure point',prompt:'Can friendship and fellow citizenship justify giving outsiders a weaker claim?',context:'The nationalist intuition resembles giving special priority to friends and family. The next move tests whether that analogy can carry the weight of global inequality.',notes:'Let the tension stand before turning to the scale of redistribution.'+src('pp. 4-5')},
 {type:'section',eyebrow:'III. HOW MUCH EQUALITY CAN THE WORLD OWE?',title:'How much equality can the world owe?',notes:'The argument considers far-reaching redistribution, limited global duties, and duties of rectification.'+src('pp. 5-6')},
 {type:'content',title:'A fully global Difference Principle would be enormously demanding',paragraphs:['Extending Rawls’s Difference Principle to the whole world would require arranging global institutions so that the world’s worst-off people are as well off as possible.'],buildGroup:'difference-principle',notes:'The argument presents this as a possible cosmopolitan implication, not as a settled conclusion.'+src('p. 5')},
 {type:'content',title:'A fully global Difference Principle would be enormously demanding',paragraphs:['Extending Rawls’s Difference Principle to the whole world would require arranging global institutions so that the world’s worst-off people are as well off as possible.','Given the scale of global inequality, that principle could require very large transfers from prosperous countries to the developing world.'],buildGroup:'difference-principle',notes:'The source notes that even poor people in rich countries are comparatively privileged in global resource terms.'+src('p. 5')},
 {type:'content',title:'A fully global Difference Principle would be enormously demanding',paragraphs:['Extending Rawls’s Difference Principle to the whole world would require arranging global institutions so that the world’s worst-off people are as well off as possible.','Given the scale of global inequality, that principle could require very large transfers from prosperous countries to the developing world.','The question is not merely whether the transfer would be costly, but whether justice requires that cost or leaves it to generosity.'],buildGroup:'difference-principle',notes:'This makes the practical sting of the cosmopolitan position visible.'+src('p. 5')},
 {type:'content',title:'A middle view gives global justice a real but limited reach',paragraphs:['A third position holds that people everywhere have duties of justice to secure basic conditions such as nutrition, sanitation, medical care, and education.'],buildGroup:'middle-view',notes:'The argument gives this as a possible compromise between full global equality and charity alone.'+src('p. 5')},
 {type:'content',title:'A middle view gives global justice a real but limited reach',paragraphs:['A third position holds that people everywhere have duties of justice to secure basic conditions such as nutrition, sanitation, medical care, and education.','This view need not say that one country’s citizens must provide every benefit that another state provides to its own citizens, such as unemployment support.'],buildGroup:'middle-view',notes:'The contrast is about differentiated, not absent, duties.'+src('p. 5')},
 {type:'content',title:'A middle view gives global justice a real but limited reach',paragraphs:['A third position holds that people everywhere have duties of justice to secure basic conditions such as nutrition, sanitation, medical care, and education.','This view need not say that one country’s citizens must provide every benefit that another state provides to its own citizens, such as unemployment support.','It may explain the difference by degrees of interaction: dense cooperation within a state can generate stronger duties than looser global relations.'],buildGroup:'middle-view',notes:'The argument offers the degree of interaction as one way to justify different principles for different circumstances.'+src('pp. 5-6')},
 {type:'content',title:'Past and present wrongdoing can create duties of rectification',paragraphs:['Global disadvantage may be linked to colonial exploitation by countries that later became wealthy.'],buildGroup:'rectification',notes:'The argument connects this approach to corrective justice and Nozick’s justice in rectification.'+src('p. 6')},
 {type:'content',title:'Past and present wrongdoing can create duties of rectification',paragraphs:['Global disadvantage may be linked to colonial exploitation by countries that later became wealthy.','If a country’s prosperity rests partly on damage done to others, compensation can be a duty of justice even for someone otherwise drawn to nationalism.'],buildGroup:'rectification',notes:'This is a point of possible overlap between nationalist and cosmopolitan intuitions.'+src('p. 6')},
 {type:'content',title:'Past and present wrongdoing can create duties of rectification',paragraphs:['Global disadvantage may be linked to colonial exploitation by countries that later became wealthy.','If a country’s prosperity rests partly on damage done to others, compensation can be a duty of justice even for someone otherwise drawn to nationalism.','The same logic can apply to unfair current terms of trade when powerful countries use their bargaining strength to secure favorable conditions.'],buildGroup:'rectification',notes:'The argument says global trade may give even nationalist intuitions a reason to recognize substantial cross-border duties.'+src('p. 6')},
 {type:'question',eyebrow:'Beyond transfers',prompt:'If aid can create dependence, what would it mean to help without taking over?',context:'The argument warns that resource transfers have not always cured poverty as hoped. It now connects global justice to development and national self-determination.',notes:'The next slide is a transition to migration, where life prospects are at stake directly.'+src('p. 6')},
 {type:'section',eyebrow:'IV. A BORDER CAN TRANSFORM A LIFE',title:'A border can transform a life',notes:'The immigration section asks what global inequality means for entry, exit, and collective self-determination.'+src('pp. 7-9')},
 {type:'content',title:'For many people, migration changes life prospects more than aid can',paragraphs:['Transfers and development programs can improve lives, yet leaving a poor country for a wealthy one may offer a single person the greatest transformation in life prospects.'],buildGroup:'migration',notes:'The source begins its immigration discussion by comparing migration’s direct effects with redistribution.'+src('p. 7')},
 {type:'content',title:'For many people, migration changes life prospects more than aid can',paragraphs:['Transfers and development programs can improve lives, yet leaving a poor country for a wealthy one may offer a single person the greatest transformation in life prospects.','States commonly admit asylum seekers under stringent conditions and otherwise restrict entry, often favoring people with sought-after skills.'],buildGroup:'migration',notes:'Do not collapse asylum and other migration into a single category; the argument distinguishes them.'+src('p. 7')},
 {type:'content',title:'For many people, migration changes life prospects more than aid can',paragraphs:['Transfers and development programs can improve lives, yet leaving a poor country for a wealthy one may offer a single person the greatest transformation in life prospects.','States commonly admit asylum seekers under stringent conditions and otherwise restrict entry, often favoring people with sought-after skills.','That raises two linked questions: may wealthy countries control entry, and may poorer countries ever limit exit after investing in scarce professionals?'],buildGroup:'migration',notes:'These are the two questions that organize the remainder of the immigration section.'+src('pp. 7-8')},

function renderSlide(s,i){const a=document.createElement('article');a.className=`slide ${s.type}${s.type==='content'||s.type==='head'?' top':''}`;a.dataset.index=i;if(s.buildGroup)a.dataset.buildGroup=s.buildGroup;let h='<div class="slide-inner">';if(s.type==='cover')h+=`<h1 class="title">${esc(s.title)}</h1><p class="work">${esc(s.work)}</p><div class="course">${esc(s.course)}</div>`;if(s.type==='section')h+=`<div class="eyebrow">${esc(s.eyebrow)}</div><h2 class="title">${esc(s.title)}</h2><div class="rule"></div>`;if(s.type==='content')h+=`<h2 class="title">${esc(s.title)}</h2><div class="body">${s.paragraphs.map((p,j)=>`<p class="${j===s.paragraphs.length-1?'fresh':''}">${esc(p)}</p>`).join('')}</div>`;if(s.type==='question'||s.type==='diagnostic')h+=`<div class="eyebrow">${esc(s.eyebrow)}</div><p class="prompt">${esc(s.prompt)}</p>${s.context?`<p class="context">${esc(s.context)}</p>`:''}`;if(s.type==='quote')h+=`<blockquote>${esc(s.text)}</blockquote><cite>${esc(s.cite)}</cite>`;if(s.type==='duo')h+=`<h2 class="title">${esc(s.title)}</h2><div class="duo-grid">${[s.left,s.right].map(x=>`<div class="duo-col"><h3>${esc(x.label)}</h3><p>${esc(x.text)}</p></div>`).join('')}</div>`;if(s.type==='head')h+=`<h2 class="title">${esc(s.title)}</h2><div class="head-list">${s.items.map(x=>`<div class="head-item"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div>`;if(s.type==='refs')h+=`<h2 class="title">${esc(s.title)}</h2><div class="refs-list">${s.items.map(x=>`<div class="ref"><strong>${esc(x[0])}.</strong> ${esc(x[1])}</div>`).join('')}</div>`;a.innerHTML=h+'</div>';deck.appendChild(a);return a}
const nodes=slides.map(renderSlide);let current=0;const counter=document.getElementById('counter'),progress=document.getElementById('progress'),notes=document.getElementById('notes'),notesBody=document.getElementById('notes-body'),overview=document.getElementById('overview'),overviewGrid=document.getElementById('overview-grid');function labelFor(s){return s.title||s.prompt||s.text||'Slide'}slides.forEach((s,i)=>{const b=document.createElement('button');b.className='overview-card';b.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')} / ${slides.length}</span><span class="label">${esc(labelFor(s))}</span>`;b.addEventListener('click',()=>{closePanels();show(i)});overviewGrid.appendChild(b)});const cards=[...overviewGrid.children];function show(i){current=Math.max(0,Math.min(slides.length-1,i));nodes.forEach((n,j)=>n.classList.toggle('active',j===current));cards.forEach((n,j)=>n.classList.toggle('current',j===current));counter.textContent=`${current+1} / ${slides.length}`;progress.style.width=`${((current+1)/slides.length)*100}%`;notesBody.textContent=slides[current].notes||'No notes for this slide.';document.title=`${current+1}/${slides.length} · Justice Everywhere`}function openPanel(p){closePanels();p.classList.add('open')}function closePanels(){overview.classList.remove('open');notes.classList.remove('open')}function togglePanel(p){p.classList.contains('open')?closePanels():openPanel(p)}function toggleFullscreen(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}document.getElementById('fullscreen').addEventListener('click',toggleFullscreen);document.querySelectorAll('.close').forEach(b=>b.addEventListener('click',closePanels));document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanels();return}if(overview.classList.contains('open')||notes.classList.contains('open'))return;if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();show(current+1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}else if(e.key.toLowerCase()==='o')togglePanel(overview);else if(e.key.toLowerCase()==='n')togglePanel(notes);else if(e.key.toLowerCase()==='f')toggleFullscreen()});let touchX=0,touchY=0;document.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY},{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))show(current+(dx<0?1:-1))},{passive:true});function fits(n){const x=n.querySelector('.slide-inner');return x.scrollHeight<=n.clientHeight*.82&&x.scrollWidth<=n.clientWidth*.92}function fitNode(n,start=1){let f=start;n.classList.add('measuring');n.style.setProperty('--fit',f);while(f>.72&&!fits(n)){f-=.02;n.style.setProperty('--fit',f)}n.classList.remove('measuring');return f}function fitAll(){nodes.forEach(n=>n.style.setProperty('--fit',1));const groups={};nodes.forEach(n=>{if(n.dataset.buildGroup)(groups[n.dataset.buildGroup]??=[]).push(n)});const grouped=new Set(Object.values(groups).flat());Object.values(groups).forEach(g=>{const f=fitNode(g[g.length-1]);g.forEach(n=>n.style.setProperty('--fit',f))});nodes.filter(n=>!grouped.has(n)).forEach(n=>fitNode(n));show(current)}let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fitAll,120)});if(document.fonts?.ready)document.fonts.ready.then(fitAll);else fitAll();show(0);
